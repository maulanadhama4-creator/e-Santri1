<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-Santri</title>
<style>
:root{--navy:#143642;--navy2:#0e2a34;--green:#2bb3a6;--greenbg:#e1f3f1;--orange:#fa7e4a;--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e2e6ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0c2229;--navy2:#081a20;--greenbg:#173a38;--bg:#11141c;--card:#1b2030;--text:#e8ebf3;--muted:#9aa3b8;--line:#2b3247;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#0c2229;--navy2:#081a20;--greenbg:#173a38;--bg:#11141c;--card:#1b2030;--text:#e8ebf3;--muted:#9aa3b8;--line:#2b3247;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);color:var(--text);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
.logo{background:#fff;border-radius:10px;padding:3px 8px;display:inline-block}.logo img{height:40px;width:auto;display:block}
.burger{background:none;border:0;color:var(--text);font-size:26px;cursor:pointer}
nav{display:none;background:var(--navy2);color:#fff;padding:8px 18px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:19;max-height:75vh;overflow:auto}
nav.open{display:block}
nav .g{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin:14px 0 4px}
nav a{display:block;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
nav a.on{color:var(--green);font-weight:700}
.strip{background:var(--navy2);color:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 12px}
.strip a{text-align:center;font-size:13px;font-weight:600}.strip span{display:block;font-size:26px}
main{max-width:980px;margin:0 auto;padding:22px 18px 40px}
h2{font-size:24px;margin:8px 0}
.crumb{font-size:13px;color:var(--muted)}
.box{background:var(--greenbg);border-radius:12px;padding:20px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:17px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h3{color:#8fe0d8}}
.card p{margin:0;color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--green);color:#062a27;font-weight:700;border-radius:10px;padding:8px 16px;font-size:14px;margin-top:10px}
.gt{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:28px 0 0}
.empty{border:2px dashed var(--line);border-radius:14px;padding:40px 16px;text-align:center;color:var(--muted);margin-top:18px}
.sk{height:14px;border-radius:7px;background:var(--line);margin:10px 0}
.hero{position:relative;overflow:hidden;min-height:700px;color:#fff;--sat:1.9;background:var(--navy)}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:56px 56px 200px max(56px,calc((100% - 980px)/2 + 18px));opacity:0;visibility:hidden;transition:opacity .8s}.slide.on{opacity:1;visibility:visible}
.hv.p{object-position:center 35%;filter:saturate(var(--sat,1.9)) contrast(1.05);transform:none}
.hero h1.m{font-size:clamp(34px,7vw,54px);line-height:1.05}
.ar{position:absolute;top:42%;z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--navy);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}.ar.l{left:8px}.ar.r{right:8px}
.dots{position:absolute;z-index:4;left:0;right:0;bottom:150px;display:flex;justify-content:center;gap:8px}.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;cursor:pointer}.dot.on{background:#fff}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;filter:blur(2px) saturate(var(--sat,1.9)) contrast(1.08);transform:scale(1.05)}
.slide::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(8,52,62,.92) 0%,rgba(12,92,98,.7) 45%,rgba(20,190,175,.22) 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(64px);z-index:1;opacity:.85;pointer-events:none}.o1{width:280px;height:280px;background:#1b9a90;left:-70px;top:-70px}.o2{width:230px;height:230px;background:#fa7e4a;left:38%;bottom:-90px}
.hc{position:relative;z-index:2;max-width:560px}
.chip{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 14px;font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(44px,9vw,68px);margin:12px 0 4px;font-weight:800;line-height:1}.hero h1 span{color:var(--orange)}
.hero h3{margin:0 0 10px;font-size:clamp(17px,3.4vw,22px)}.hero p{margin:0;opacity:.92;max-width:480px}
.hb{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.hb .btn{margin:0;background:var(--orange);color:#2a1206}.hb .ghost{background:transparent;color:#fff;border:2px solid #fff;padding:6px 16px}
.dnav{display:none}
@media (orientation:landscape){.burger,nav{display:none!important}.dnav{display:flex;align-items:center;gap:2px;font-size:13px}}
.dnav .t{background:none;border:0;color:var(--text);font:inherit;font-weight:600;padding:10px 10px;cursor:pointer;display:block;border-radius:8px;white-space:nowrap}
.dnav .t:hover,.dnav .t.on,.dg.open>.t{background:var(--greenbg)}
.dg{position:relative}.dd{display:none;position:absolute;left:0;top:100%;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.dg:hover .dd,.dg.open .dd{display:block}.dg:nth-last-child(-n+2) .dd{left:auto;right:0}
.dd a{display:block;color:var(--text);padding:9px 12px;border-radius:6px;font-size:13px}.dd a:hover,.dd a.on{background:var(--greenbg);font-weight:700}
.cgrid{position:relative;z-index:5;margin-top:-130px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cgrid .card{text-align:center;border:0;padding:28px 16px;box-shadow:0 12px 28px rgba(8,40,48,.3)}
.cgrid .card:nth-child(1){background:linear-gradient(160deg,#25c0b2,#14796f)}.cgrid .card:nth-child(2){background:linear-gradient(160deg,#1f6d82,#143642)}.cgrid .card:nth-child(3){background:linear-gradient(160deg,#ff9561,#e8622a)}
.cgrid .card h3{color:#fff!important;font-size:20px}.cgrid .card p{color:rgba(255,255,255,.92)}.cgrid .btn{background:#fff;color:#143642}.cgrid .ic{font-size:34px}
.sec{margin:34px 0 0}.sec h2{border-left:5px solid var(--green);padding-left:10px}
.news .card{padding:0;overflow:hidden}.news .th{height:110px;background:linear-gradient(135deg,var(--navy),#1b9a90)}.news .bd{padding:14px}.news small{color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gal figcaption{padding:8px 10px;font-size:13px;line-height:1.4;color:var(--muted)}
@media(max-width:600px){.gal{gap:6px}.gal figcaption{padding:5px 6px;font-size:10.5px}}
.dev .devw{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.devf{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(8,40,48,.12)}
.devf img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.devf figcaption{padding:12px 14px;display:grid;gap:2px}.devf figcaption b{font-size:18px;color:var(--text)}.devf figcaption span{font-size:13px;color:var(--muted)}
.devc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.devc span{background:var(--greenbg);color:var(--text);border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;padding:6px 12px}
.devt p{margin:0 0 14px;line-height:1.85;text-align:justify;font-size:15.5px}
@media(max-width:720px){.dev .devw{grid-template-columns:1fr}.devf{max-width:320px;margin:0 auto}}
.abt .abv{margin:18px 0 24px;padding:26px 28px;border-radius:18px;color:#fff6e0;background:radial-gradient(500px 240px at 90% -10%,rgba(43,179,166,.35),transparent 60%),var(--navy2);border-left:6px solid var(--orange)}
.abt .abv small{display:block;font-size:13px;letter-spacing:.5px;opacity:.75;margin-bottom:6px}.abt .abv p{margin:0;font-size:clamp(24px,4.6vw,38px);font-weight:800;line-height:1.2}
.abt-t p{margin:0 0 16px;line-height:1.9;text-align:justify;font-size:16px}.abt .btn{margin-top:6px}
footer{background:var(--navy);color:#fff;padding:26px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;font-size:14px}
footer h4{margin:0 0 8px;color:var(--green)}footer p{margin:2px 0;opacity:.85}
/* ===== Navigasi pil -> menyatu dengan halaman saat scroll ===== */
header{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:calc(100% - 24px);max-width:1000px;padding:6px 10px 6px 14px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(8,40,48,.25);transition:top .35s ease,width .35s ease,max-width .35s ease,border-radius .35s ease,padding .35s ease,box-shadow .35s ease,background .35s ease}
body.sc header{top:env(safe-area-inset-top,0px);width:100%;max-width:100%;padding:8px 18px;border-width:0 0 1px;border-radius:0;background:var(--card);box-shadow:0 2px 14px rgba(8,40,48,.12)}
body::before{background:transparent;transition:background .35s}body.sc::before{background:var(--card)}
.burger{width:42px;height:42px;border-radius:50%;background:var(--greenbg);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.dnav .t{border-radius:999px}
.dd{top:calc(100% + 12px);border-radius:16px}.dd::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:1000px;top:calc(env(safe-area-inset-top,0px) + 78px);border-radius:24px;box-shadow:0 14px 34px rgba(8,40,48,.3);max-height:70vh;transition:top .35s ease,width .35s ease,max-width .35s ease,border-radius .35s ease}
body.sc nav{top:calc(env(safe-area-inset-top,0px) + 64px);width:100%;max-width:100%;border-radius:0 0 24px 24px}
body.nohero #app{padding-top:84px}
/* ===== Seputar Kesantrian ===== */
.ss{position:relative;overflow:hidden;margin-top:40px;padding:64px 0 54px;color:#fff6e0;background:radial-gradient(900px 440px at 88% -5%,rgba(43,179,166,.28),transparent 62%),radial-gradient(600px 360px at -5% 105%,rgba(250,126,74,.18),transparent 60%),var(--navy2)}
.ssw{max-width:1100px;margin:0 auto;padding:0 18px}
.ss h2{font-size:clamp(30px,5.4vw,48px);line-height:1.1;font-weight:800;margin:0 0 36px;padding:0;border:0;color:#fff6e0}
.ssl{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}.ssl::-webkit-scrollbar{display:none}
.ssi{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:44px;align-items:center}

.ssrc{font-size:14px;color:rgba(255,246,224,.62);margin:0 0 14px}
.ssi h3{margin:0 0 22px;font-size:clamp(28px,4.9vw,50px);line-height:1.08;font-weight:800;color:#fff6e0}
.ssi .ssx{margin:0 0 26px;font-size:clamp(15px,2.1vw,18px);line-height:1.85;text-align:justify;color:rgba(255,246,224,.92);max-width:none}
.ssb{display:inline-flex;align-items:center;gap:10px;background:rgba(255,246,224,.08);color:#fff6e0;border:1px solid rgba(255,246,224,.18);border-radius:999px;font:inherit;font-weight:700;font-size:17px;padding:14px 28px;cursor:pointer;transition:background .2s,transform .2s}
.ssb:hover{background:rgba(255,246,224,.16);transform:translateX(3px)}
.ssc{position:relative}
.sscard{position:relative;overflow:hidden;min-height:410px;display:flex;flex-direction:column;justify-content:flex-end;padding:34px 30px 92px;border-radius:104px 22px 22px 22px;color:#fff;box-shadow:0 22px 50px rgba(0,0,0,.38)}
.sscard::before{content:attr(data-m);position:absolute;right:-6px;top:-46px;font-size:360px;font-weight:900;line-height:1;opacity:.13;pointer-events:none}
.sscard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.28));pointer-events:none}
.sscard>*{position:relative;z-index:1}
.ssn{font-size:clamp(22px,3.2vw,30px);font-weight:800;line-height:1.15;margin:0 0 6px}
.sssub{font-size:13px;opacity:.85;margin:0 0 16px}
.sscard ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.sscard li{padding-left:22px;position:relative;line-height:1.4}.sscard li::before{content:"✓";position:absolute;left:0;font-weight:800;color:#fff6e0}
.sspill{position:absolute;z-index:2;left:22px;bottom:22px;max-width:calc(100% - 44px);background:#fff6e0;color:#143642;font-weight:800;font-size:15px;padding:14px 24px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ssd{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px}
.ssdt{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid #fff6e0;background:transparent;cursor:pointer;transition:background .2s,transform .2s}.ssdt.on{background:#fff6e0;transform:scale(1.1)}
.ssa{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,246,224,.35);background:transparent;color:#fff6e0;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}.ssa:hover{background:rgba(255,246,224,.14)}
.m2{padding-top:10px}
@media (max-width:820px){.ssi{grid-template-columns:1fr;gap:28px}.sscard{min-height:330px;border-radius:84px 20px 20px 20px}.ss{padding:52px 0 44px}}
.sscard>.ssp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.sscard.ph{min-height:440px}.sscard.ph::before{display:none}.sscard.ph::after{background:none}
.rdc{margin:-12px 0 18px;font-size:12px;color:var(--muted)}.rdl{display:block;margin:4px 0 14px;color:var(--green);font-weight:700;text-align:center}.rdi{display:block;width:100%;max-height:300px;object-fit:cover;object-position:center 22%;border-radius:16px;margin:0 0 20px}
/* pembaca biografi */
.rd{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(6,16,20,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:calc(env(safe-area-inset-top,0px) + 20px) 12px calc(env(safe-area-inset-bottom,0px) + 20px)}
.rd.open{display:flex}
.rdp{position:relative;width:100%;max-width:780px;background:var(--card);color:var(--text);border-radius:24px;padding:38px 32px 30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.rdx{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--greenbg);color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0}
.rdp h3{margin:0 44px 6px 0;font-size:clamp(22px,4vw,30px);line-height:1.2;color:var(--text)}
.rds{margin:0 0 20px;color:var(--muted);font-style:italic}
.rdp .rdb p{margin:0 0 16px;line-height:1.8;text-align:justify;font-size:16px;color:var(--text)}
.rdp .rdf{display:block;margin:8px auto 0;background:var(--green);color:#062a27;border:0;border-radius:999px;font:inherit;font-weight:700;padding:11px 28px;cursor:pointer}
@media (max-width:520px){.rdp{padding:34px 20px 24px}.rdp .rdb p{text-align:left}}
/* ===== Animasi & menu ===== */
html{scroll-behavior:smooth}
#sp{position:fixed;left:0;right:0;top:0;height:3px;z-index:50;background:linear-gradient(90deg,var(--green),var(--orange));transform:scaleX(0);transform-origin:left;pointer-events:none}
.rv{opacity:0;transform:translateY(34px);transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1)}
.rv.z{transform:translateY(26px) scale(.94)}
.rv.in{opacity:1;transform:none}
.rv.done{transition:transform .25s ease,box-shadow .25s ease,opacity .25s ease}
.card.rv.done:hover,.gal figure.rv.done:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(8,40,48,.22)}
.hc{transform:translateY(var(--py,0px));opacity:var(--po,1);will-change:transform,opacity}
@keyframes hcIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.slide.on .hc>*{animation:hcIn .85s cubic-bezier(.2,.7,.2,1) both}
.slide.on .hc>*:nth-child(1){animation-delay:.1s}.slide.on .hc>*:nth-child(2){animation-delay:.22s}.slide.on .hc>*:nth-child(3){animation-delay:.34s}.slide.on .hc>*:nth-child(4){animation-delay:.46s}.slide.on .hc>*:nth-child(5){animation-delay:.58s}.slide.on .hc>*:nth-child(6){animation-delay:.7s}
@keyframes orbf{50%{translate:0 -18px}}
.orb{animation:orbf 9s ease-in-out infinite}.orb.o2{animation-duration:12s;animation-direction:reverse}
.dnav .dg .dd{display:block;visibility:hidden;opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top center;pointer-events:none;transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.dnav .dg.open .dd{visibility:visible;opacity:1;transform:none;pointer-events:auto;transition:opacity .22s ease,transform .22s ease,visibility 0s}
.dnav .t{transition:background .2s}
nav{display:block;visibility:hidden;opacity:0;transform:translateX(-50%) translateY(-14px);pointer-events:none;transition:top .35s ease,width .35s ease,max-width .35s ease,border-radius .35s ease,opacity .25s ease,transform .3s ease,visibility 0s linear .3s}
nav.open{visibility:visible;opacity:1;transform:translateX(-50%);pointer-events:auto;transition:top .35s ease,width .35s ease,max-width .35s ease,border-radius .35s ease,opacity .25s ease,transform .3s ease,visibility 0s}
@media (orientation:landscape){nav{display:none!important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1!important;transform:none!important;transition:none!important}*{animation:none!important}}
/* ===== Login & Daftar ===== */
body.locked{overflow:hidden}
body.locked header,body.locked nav,body.locked #app,body.locked footer,body.locked #sp{display:none!important}
#auth{display:none;position:fixed;inset:0;z-index:200;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(900px 440px at 90% -5%,rgba(43,179,166,.35),transparent 62%),radial-gradient(600px 360px at -5% 105%,rgba(250,126,74,.22),transparent 60%),var(--navy2)}
body.locked #auth{display:flex}
.ac{margin:auto;width:100%;max-width:420px;background:var(--card);color:var(--text);border-radius:22px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:acIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes acIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.ac .logo{display:inline-block}
.ac h2{margin:14px 0 4px;font-size:24px;border:0;padding:0}
.ac .am{margin:0 0 14px;color:var(--muted);font-size:14px}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:6px}
.atabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:9px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.atabs button.on{background:var(--green);color:#062a27}
.af[hidden]{display:none}
.af label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}

.lo{cursor:pointer}
/* ===== Halaman Developer (tim) ===== */
.tm{max-width:900px;margin:0 auto}
.tm-hero,.tm-card{background:var(--card);border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:0 10px 26px rgba(8,40,48,.1)}

.tm-pill{display:inline-block;background:var(--greenbg);border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;padding:4px 12px;margin-bottom:8px}

.tm-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 0}
.tm-chips span{background:var(--greenbg);border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;padding:6px 12px}
.tm-box{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;font-size:15px;line-height:1.7}
.tm-card .tm-box{font-size:14.5px;line-height:1.65;padding:12px 14px}
.tm-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.tm-more>div{overflow:hidden;min-height:0}
.tm-open .tm-more{grid-template-rows:1fr}
.tm-more p{margin:14px 2px 0;text-align:justify;line-height:1.85;font-size:15px}
.tm-more p:last-child{margin-bottom:4px}
.tm-btn{margin-top:14px;background:var(--greenbg);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tm-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.tm-btn i{display:inline-block;transition:transform .3s ease;font-style:normal}
.tm-open .tm-btn i{transform:rotate(180deg)}
.tm-hr{height:1px;background:var(--line);margin:30px 0}
.tm-h{text-align:center;font-size:20px;margin:0 0 16px;border:0;padding:0}
.tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.tm-focus{padding:20px 18px;margin-top:16px}

/* ===== Ruang Diskusi ===== */

.ds-bar .sp{flex:1}
.ds-btn{background:var(--green);color:#062a27;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.ds-btn.g{background:var(--greenbg);color:var(--text);border:1px solid var(--line)}

.ds-form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px;display:grid;gap:10px;box-shadow:0 8px 22px rgba(8,40,48,.08)}

.ds-item.hid{opacity:.55}

.ds-t{font-size:17px;font-weight:800;margin:0 0 4px;line-height:1.35}
.ds-sn{margin:0 0 10px;color:var(--muted);font-size:14.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.ds-chip{background:var(--greenbg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}

.ds-role.pengajar,.ds-role.developer{background:var(--green);color:#062a27;border-color:var(--green)}
.ds-msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted);text-align:center}
.ds-msg.err{color:#e5484d}
.ds-post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 6px 18px rgba(8,40,48,.07)}
.ds-post.hid{opacity:.6}
.ds-post h3{margin:0 0 8px;font-size:20px;line-height:1.35}
.ds-body{white-space:pre-wrap;word-wrap:break-word;line-height:1.75;font-size:15.5px;margin:10px 0 0}
.ds-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ds-rh{margin:18px 0 10px;font-size:17px}
.ds-reply{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px}
.ds-reply.hid{opacity:.6}
.ds-back{background:none;border:0;color:var(--text);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;margin:0 0 8px}

.ds-form[hidden]{display:none}

var NEWS=[{"id": "uci", "src": "Biografi Pendiri · Pondok Pesantren Sunanulhuda", "h": "Mama KH. Uci Sanusi, Perintis Pondok Pesantren Sunanulhuda Cikaroya", "ex": "Ulama kharismatik asal Sukabumi yang bersama istrinya, Hj. Titi Atikah, merintis Pondok Pesantren Sunanulhuda di Cikaroya, Cisaat. Beliau mengajarkan kitab kuning secara sistematis, menekankan adab dan akhlakul karimah, serta tercatat sebagai murid KH. Ahmad Sanusi. Beliau wafat pada tahun 1965.", "name": "Mama KH. Uci Sanusi", "mono": "U", "pill": "Pendiri Pesantren", "facts": ["Murid KH. Ahmad Sanusi", "Bersama Hj. Titi Atikah merintis pesantren", "Wafat pada tahun 1965"], "bg": "linear-gradient(160deg,#25c0b2,#14796f)", "title": "BIOGRAFI MAMA KH. UCI SANUSI", "sub": "Ulama Perintis, Guru para Kiai, dan Pendiri Pondok Pesantren Sunanulhuda Cikaroya Sukabumi", "body": ["Mama KH. Uci Sanusi bin Mama Sarbini merupakan ulama kharismatik asal Sukabumi yang dikenal luas sebagai pendiri Pondok Pesantren Sunanulhuda di Cikaroya, Cibolangkaler, Kecamatan Cisaat, Kabupaten Sukabumi. Sebutan kehormatan “Mama” yang melekat pada nama beliau mencerminkan kedudukan mulia seorang ajengan sepuh dalam tradisi masyarakat Sunda yang tidak hanya dihormati karena kedalaman ilmu agamanya, tetapi juga dicintai sebagai ayah rohani dan pengayom umat. Sejak usia muda, beliau tumbuh dalam lingkungan religius yang kental dengan tradisi pesantren, membentuk pribadi yang tekun dalam beribadah, bersahaja dalam keseharian, serta berdedikasi penuh terhadap syiar Islam.", "Perjalanan keilmuan Mama KH. Uci Sanusi ditempa melalui pengembaraan menuntut ilmu di berbagai pesantren tradisional di tanah Pasundan dan sekitarnya. Beliau mengkaji secara mendalam beragam cabang ilmu keislaman klasik atau <em>kutubut turats</em>, mulai dari ilmu nahwu, sharaf, balaghah, fiqih, ushul fiqih, hadis, tafsir, hingga tasawuf. Dalam jaringan keilmuan ulama Sukabumi, beliau juga tercatat memiliki pertalian sanad keilmuan dan merupakan salah satu murid dari ulama besar sekaligus pahlawan nasional asal Sukabumi, KH. Ahmad Sanusi, yang turut mewarnai keluasan wawasan keislaman dan semangat juang beliau.", "Bekal ilmu yang matang dari berbagai pesantren tidak membuat Mama KH. Uci Sanusi berpuas diri, melainkan mendorongnya untuk segera mengamalkannya di tengah masyarakat. Beliau memilih mengabdikan diri di wilayah Cikaroya, Cisaat, Sukabumi, yang pada masa awal rintisannya masih berupa lingkungan pedesaan yang tenang dan membutuhkan sentuhan pembinaan keagamaan yang berkelanjutan. Dengan kesabaran dan ketulusan hati, beliau mulai membuka pengajian bagi warga sekitar, mengajarkan tata cara membaca Al-Qur’an, dasar-dasar akidah, serta fikih ibadah sehari-hari.", "Seiring berjalannya waktu, pancaran keilmuan dan akhlak mulia Mama KH. Uci Sanusi menarik perhatian para pencari ilmu dari berbagai pelosok Sukabumi maupun luar daerah. Para pemuda mulai berdatangan untuk bermukim dan menimba ilmu secara langsung di bawah bimbingan beliau. Dari majelis pengajian yang semula sederhana itulah, bersama sang istri tercinta, Hj. Titi Atikah binti H. Junaedi, beliau merintis dan mendirikan Pondok Pesantren Sunanulhuda Cikaroya sebagai wadah kaderisasi santri dan pusat pengkajian ilmu-ilmu agama Islam.", "Di bawah asuhan Mama KH. Uci Sanusi, Pondok Pesantren Sunanulhuda tumbuh dengan karakter kepesantrenan salafiyah yang kuat dan berakar pada tradisi <em>Ahlussunnah wal Jama’ah</em>. Beliau menerapkan metode pengajaran kitab kuning secara tekun dan sistematis, membimbing para santri agar mampu memahami teks-teks klasik Arab dengan ketelitian tata bahasa dan kedalaman makna. Bagi beliau, penguasaan kitab kuning bukan sekadar kecakapan akademis, melainkan kunci untuk menjaga kemurnian pemahaman agama dari generasi ke generasi.", "Selain mengasah kecerdasan intelektual para santri, Mama KH. Uci Sanusi sangat menekankan pembentukan akhlakul karimah, adab, serta kedisiplinan spiritual. Beliau senantiasa mendidik santrinya untuk menjunjung tinggi penghormatan kepada guru, berbakti kepada orang tua, hidup sederhana, serta menjaga keikhlasan dalam setiap amal perbuatan. Keteladanan tersebut tidak hanya disampaikan melalui nasihat lisan, tetapi tercermin langsung dalam laku hidup beliau yang tawadhu, istiqamah dalam shalat berjamaah, dan penuh kasih sayang kepada siapa saja yang datang bersilaturahmi.", "Di tengah masyarakat Sukabumi, Mama KH. Uci Sanusi berperan sebagai rujukan moral dan tempat bertanya dalam berbagai persoalan keagamaan maupun kemasyarakatan. Beliau dikenal sebagai sosok ulama yang teduh, bijaksana, dan mampu merangkul berbagai lapisan masyarakat tanpa memandang status sosial. Kehadiran beliau di Cikaroya menjadikan kawasan tersebut berkembang sebagai salah satu simpul dakwah dan pendidikan Islam yang berpengaruh di wilayah Cisaat dan Kabupaten Sukabumi secara umum.", "Dalam kehidupan berkeluarga, Mama KH. Uci Sanusi dan Hj. Titi Atikah membangun rumah tangga yang sarat dengan nilai-nilai keilmuan dan pengabdian. Beliau mendidik putra-putrinya secara langsung dalam suasana pesantren yang disiplin sehingga tumbuh menjadi penerus estafet perjuangan dakwah. Salah satu putra beliau, Buya KH. Dadun Sanusi, kelak tampil melanjutkan tongkat estafet kepemimpinan Pondok Pesantren Sunanulhuda dan mengembangkan lembaga pendidikan tersebut hingga mencakup jenjang pendidikan formal.", "Mama KH. Uci Sanusi wafat pada tahun 1965, meninggalkan duka mendalam bagi keluarga besar, para santri, dan masyarakat Sukabumi yang sangat mencintainya. Meski beliau telah berpulang ke rahmatullah, fondasi keilmuan dan lembaga pendidikan yang telah dirintisnya tetap berdiri kokoh dan terus berkembang pesat di bawah kepemimpinan putra serta keturunannya. Estafet kepemimpinan pesantren yang langsung dilanjutkan oleh putranya, Buya KH. Dadun Sanusi, menjadi bukti keberhasilan kaderisasi internal yang beliau tanamkan semasa hidup.", "Hingga kini, nama Mama KH. Uci Sanusi senantiasa dikenang dengan penuh takzim dalam setiap peringatan haul masyayikh dan sejarah perjalanan Pondok Pesantren Sunanulhuda Cikaroya. Jasa-jasa beliau dalam membuka jalan pendidikan Islam, mencetak ribuan alumni yang tersebar di berbagai penjuru negeri, serta mewariskan keteladanan hidup seorang ulama sejati merupakan amal jariyah yang terus mengalir pahalanya. Warisan spiritual dan intelektual Mama KH. Uci Sanusi tetap menjadi suluh inspirasi bagi keluarga besar Sunanulhuda dan umat Islam di Sukabumi."]}, {"id": "dadun", "src": "Biografi Pengasuh · Pondok Pesantren Sunanulhuda", "h": "KH. Dadun Sanusi, Memadukan Tradisi Salafiyah dan Pendidikan Formal", "ex": "Pengasuh yang melanjutkan estafet kepemimpinan pesantren dan mengembangkan Sunanulhuda hingga memiliki lembaga pendidikan formal MTs dan MA yang berjalan beriringan dengan kurikulum kepesantrenan. Beliau dikenang sebagai guru yang penuh kasih sayang, tegas dalam adab, dan menjadi rujukan masyarakat Sukabumi.", "name": "Buya KH. Dadun Sanusi", "mono": "D", "pill": "Pengembang Pendidikan Formal", "facts": ["Putra Mama KH. Uci Sanusi", "Mengembangkan jenjang MTs hingga MA", "Rujukan ulama dan tokoh masyarakat Sukabumi"], "bg": "linear-gradient(160deg,#1f6d82,#143642)", "title": "BIOGRAFI KH. DADUN SANUSI", "sub": "Ulama Kharismatik, Pejuang Pendidikan Islam, dan Pendiri Pondok Pesantren Sunanulhuda Cikaroya Sukabumi", "body": ["KH. Dadun Sanusi dikenal luas oleh masyarakat Sukabumi dan sekitarnya sebagai sosok ulama kharismatik, pendidik yang tekun, sekaligus perintis lembaga pendidikan Islam terpadu yang melahirkan ribuan generasi berilmu dan berakhlak mulia. Lahir dan tumbuh di lingkungan religius Tatar Sunda, beliau mewarisi tradisi keilmuan pesantren yang kuat sejak usia dini. Sejak masa mudanya, KH. Dadun Sanusi menunjukkan ketekunan luar biasa dalam menuntut ilmu-ilmu keislaman klasik, mulai dari ilmu alat seperti nahwu dan sharaf, fiqih, tauhid, hingga tafsir dan tasawuf, yang kelak menjadi fondasi utama dalam kiprah dakwah serta pengabdiannya di tengah masyarakat.", "Perjalanan intelektual KH. Dadun Sanusi ditempa melalui pengembaraan ilmu dari satu pesantren ke pesantren lainnya di wilayah Jawa Barat, mengikuti tradisi <em>rihlah ilmiyah</em> para kiai Nusantara. Di bawah bimbingan para masyayikh yang alim dan wara’, beliau tidak hanya menyerap kedalaman teks-teks kitab kuning (<em>kutubut turats</em>), tetapi juga meresapi nilai-nilai keteladanan, kesederhanaan, ketawadhuan, serta keikhlasan dalam berkhidmat. Tempaan spiritual dan keilmuan tersebut membentuk karakter beliau menjadi pribadi yang tenang, bijaksana dalam mengambil keputusan, serta memiliki kepekaan sosial yang tinggi terhadap kondisi umat.", "Sekembalinya dari masa menuntut ilmu, KH. Dadun Sanusi memusatkan perhatian pada upaya mencerdaskan kehidupan masyarakat di wilayah Cikaroya, Cibolangkaler, Kecamatan Cisaat, Kabupaten Sukabumi. Pada masa awal pengabdiannya, beliau memulai dakwah dengan cara yang sangat bersahaja, yakni mengajar anak-anak dan warga sekitar membaca Al-Qur’an serta dasar-dasar ibadah di surau sederhana. Ketulusan dan kedalaman ilmu beliau perlahan menarik simpati masyarakat luas, sehingga semakin banyak santri dari berbagai pelosok Sukabumi dan luar daerah yang datang untuk berguru serta bermukim.", "Melihat antusiasme para pencari ilmu yang terus bertambah dari waktu ke waktu, KH. Dadun Sanusi kemudian merintis dan mengembangkan Pondok Pesantren Sunanulhuda di Cikaroya, Sukabumi. Pesantren ini didirikan dengan visi besar untuk menjaga kemurnian tradisi keilmuan salafiyah sekaligus menjawab tantangan zaman yang terus berubah. Di bawah kepemimpinan beliau, Sunanulhuda tidak hanya menjadi pusat pengkajian kitab-kitab klasik, melainkan juga ruang pembinaan mental, spiritual, dan kemandirian para santri agar kelak siap terjun mengabdi di tengah masyarakat.", "Salah satu pemikiran visioner KH. Dadun Sanusi yang paling menonjol adalah keterbukaannya terhadap integrasi antara pendidikan pesantren salafiyah dengan sistem pendidikan formal. Beliau menyadari sepenuhnya bahwa umat Islam membutuhkan generasi yang tidak hanya fasih membaca dan memahami kitab kuning, tetapi juga memiliki penguasaan ilmu pengetahuan umum serta ijazah formal yang diakui negara. Melalui ikhtiar panjang dan kerja keras, di lingkungan Pondok Pesantren Sunanulhuda kemudian berkembang lembaga pendidikan formal mulai dari jenjang Madrasah Tsanawiyah (MTs) hingga Madrasah Aliyah (MA) yang berjalan beriringan dengan kurikulum kepesantrenan.", "Dalam kesehariannya sebagai pengasuh pesantren, KH. Dadun Sanusi dikenal sebagai figur guru yang penuh kasih sayang namun tetap tegas dalam menanamkan kedisiplinan ibadah dan adab. Beliau senantiasa menekankan kepada para santrinya bahwa ketinggian ilmu seseorang tidak akan bermakna tanpa dibarengi dengan keluhuran budi pekerti dan penghormatan kepada guru serta orang tua. Keteladanan itu beliau tunjukkan secara nyata melalui konsistensi dalam memimpin shalat berjamaah, membacakan kitab di hadapan para santri, serta menyapa dan mendengarkan keluh kesah masyarakat tanpa membeda-bedakan status sosial.", "Selain berkiprah di lingkungan internal pesantren, KH. Dadun Sanusi juga aktif dalam berbagai kegiatan sosial kemasyarakatan dan keorganisasian Islam di Kabupaten Sukabumi. Beliau kerap menjadi rujukan utama bagi tokoh masyarakat, ulama muda, maupun pemerintah daerah dalam berbagai persoalan keagamaan dan kemaslahatan umat. Nasihat-nasihat beliau selalu menyejukkan, mengedepankan persatuan (<em>ukhuwah Islamiyah</em>), serta menjunjung tinggi keharmonisan hidup bermasyarakat di tengah keberagaman latar belakang warga.", "Selama masa perjuangannya, KH. Dadun Sanusi tidak luput dari berbagai ujian dan keterbatasan, baik dari sisi sarana prasarana pesantren pada masa rintisan maupun dinamika sosial politik yang menyertai perjalanan bangsa. Namun, dengan keteguhan prinsip, kesabaran, dan keyakinan penuh kepada pertolongan Allah Swt., beliau mampu melewati setiap rintangan dengan kepala tegak. Semangat kemandirian dan gotong royong yang beliau tanamkan membuat Pondok Pesantren Sunanulhuda terus bertumbuh secara fisik maupun kualitas akademiknya dari generasi ke generasi.", "Warisan terbesar yang ditinggalkan oleh KH. Dadun Sanusi bukan sekadar bangunan fisik pesantren dan madrasah yang megah, melainkan jaringan keilmuan serta ribuan alumni yang tersebar di berbagai penjuru daerah. Para santri didikan beliau kini banyak yang berkiprah menjadi kiai, ustaz, akademisi, pendidik, hingga penggerak masyarakat yang meneruskan nilai-nilai keislaman yang moderat dan berakar kuat pada tradisi pesantren. Melalui para murid dan keturunannya, sanad keilmuan serta semangat juang beliau tetap hidup dan terus memberi manfaat luas.", "Hingga kini, nama KH. Dadun Sanusi senantiasa dikenang dengan penuh takzim sebagai suluh penerang bagi masyarakat Sukabumi dan keluarga besar Pondok Pesantren Sunanulhuda. Keteladanan hidup beliau dalam memadukan kedalaman ilmu agama, keluasan pandangan terhadap pendidikan modern, serta ketulusan dalam melayani umat menjadi inspirasi abadi bagi generasi penerus. Perjalanan hidup dan pengabdian beliau merupakan bukti nyata bahwa keikhlasan dalam mendidik manusia akan melahirkan amal jariyah yang cahayanya tidak pernah padam melintasi zaman."]}, {"id": "encep", "src": "Biografi Pengasuh · Pondok Pesantren Sunanulhuda", "h": "KH. Encep Solahudin Al-Ayubi Sanusi, Meneruskan Estafet Keilmuan Sunanulhuda", "ex": "Ulama penerus dalam jajaran pengasuh yang merawat tradisi kitab kuning sekaligus mengawal perkembangan lembaga pendidikan formal di bawah Yayasan Pondok Pesantren Sunanulhuda. Beliau berpesan agar santri menjadikan ilmu agama dan adab sebagai kompas moral di tengah arus era digital.", "name": "KH. Encep Solahudin Al-Ayubi Sanusi", "mono": "E", "pill": "Pengasuh Penerus", "facts": ["Cucu Mama KH. Uci Sanusi, putra Buya KH. Dadun Sanusi", "Mengampu pengajian kitab kuning", "Terlibat di Yayasan Pondok Pesantren Sunanulhuda"], "bg": "linear-gradient(160deg,#ff9561,#e8622a)", "title": "BIOGRAFI KH. ENCEP SOLAHUDIN AL-AYUBI SANUSI", "sub": "Ulama Penerus, Pengasuh Pesantren, dan Tokoh Pendidikan Islam di Pondok Pesantren Sunanulhuda Cikaroya Sukabumi", "body": ["KH. Encep Solahudin Al-Ayubi Sanusi merupakan salah satu figur ulama penerus dan tokoh sentral dalam jajaran pengasuh Pondok Pesantren Sunanulhuda Cikaroya, Kecamatan Cisaat, Kabupaten Sukabumi. Lahir dan dibesarkan di lingkungan keluarga besar pesantren yang kental dengan tradisi keilmuan Islam serta pengabdian umat, beliau mewarisi semangat dakwah para pendahulunya, yakni sang kakek sekaligus pendiri pesantren, Mama KH. Uci Sanusi, serta sang ayah, Buya KH. Dadun Sanusi. Sejak usia dini, nilai-nilai ketawadhuan, kedisiplinan ibadah, dan kecintaan terhadap ilmu pengetahuan telah tertanam kuat dalam kepribadian beliau.", "Pendidikan pertama KH. Encep Solahudin Al-Ayubi Sanusi ditempa langsung di lingkungan keluarga dan Pondok Pesantren Sunanulhuda di bawah bimbingan langsung para masyayikh keluarga besar Sanusi. Dalam masa belajarnya, beliau tekun mendalami berbagai disiplin ilmu keislaman klasik atau <em>kutubut turats</em>, mulai dari ilmu alat seperti nahwu dan sharaf, fiqih, ushul fiqih, tauhid, hadis, hingga tafsir Al-Qur’an. Selain menempa diri di lingkungan pesantren sendiri, beliau juga memperluas cakrawala intelektual dan keagamaannya melalui pendidikan lanjutan serta interaksi keilmuan dengan para ulama di berbagai majelis ilmu.", "Sebagai bagian dari generasi penerus keluarga besar Sunanulhuda, KH. Encep Solahudin Al-Ayubi Sanusi memikul amanah besar untuk menjaga kesinambungan tradisi keilmuan salafiyah sekaligus mengawal perkembangan lembaga pendidikan di era modern. Beliau meyakini bahwa pesantren harus tetap berdiri kokoh di atas fondasi kitab kuning dan akhlakul karimah, namun di saat yang sama harus adaptif terhadap kemajuan zaman agar para santri mampu berkiprah secara luas di berbagai bidang kehidupan masyarakat.", "Dalam kiprahnya mengasuh dan membina santri di Pondok Pesantren Sunanulhuda Cikaroya, KH. Encep Solahudin Al-Ayubi Sanusi dikenal sebagai sosok kiai yang dekat dengan para santri, sabar dalam membimbing, serta memiliki gaya penyampaian ilmu yang jernih dan mudah dipahami. Beliau secara konsisten mengampu pengajian kitab kuning dan pembinaan keagamaan, menanamkan pemahaman Islam <em>Ahlussunnah wal Jama’ah</em> yang moderat, sejuk, serta menjunjung tinggi adab penghormatan kepada guru dan sesama.", "Selain berperan aktif dalam pembinaan kepesantrenan, KH. Encep Solahudin Al-Ayubi Sanusi juga turut terlibat dalam pengelolaan dan pengembangan lembaga pendidikan formal yang bernaung di bawah Yayasan Pondok Pesantren Sunanulhuda. Sinergi antara kurikulum pesantren dan madrasah formal yang telah dirintis oleh generasi sebelumnya terus beliau rawat dan perkuat, sehingga lulusan Sunanulhuda memiliki keseimbangan antara kedalaman spiritual, penguasaan khazanah klasik, dan kompetensi akademik formal.", "Di tengah masyarakat Cikaroya, Cisaat, dan Kabupaten Sukabumi pada umumnya, KH. Encep Solahudin Al-Ayubi Sanusi dikenal luas sebagai mubalig dan tokoh agama yang kerap hadir dalam berbagai kegiatan dakwah, majelis taklim, maupun forum-forum keumatan. Kehadiran beliau selalu membawa suasana teduh dan mempersatukan, menjadikan nasihat-nasihat keagamaan beliau diterima dengan penuh hormat oleh berbagai kalangan masyarakat, mulai dari generasi tua hingga kalangan pemuda.", "Keteladanan KH. Encep Solahudin Al-Ayubi Sanusi juga tampak dalam keterlibatannya pada organisasi keagamaan dan kemasyarakatan Islam di tingkat lokal maupun regional. Beliau senantiasa mendorong terjalinnya ukhuwah Islamiyah antarpesantren, ulama, umara, dan elemen masyarakat demi terciptanya harmoni sosial serta kemajuan pendidikan Islam di Sukabumi. Sikap rendah hati dan keterbukaannya dalam berdialog membuat beliau menjadi salah satu figur rujukan yang disegani.", "Dalam memandang tantangan generasi muda di era digital dan arus informasi yang begitu cepat, KH. Encep Solahudin Al-Ayubi Sanusi senantiasa menekankan pentingnya ketahanan akidah dan akhlak. Beliau berpesan agar para santri tidak silau oleh perubahan zaman hingga melupakan jati diri kepesantrenannya, melainkan menjadikan ilmu agama dan adab sebagai kompas moral dalam mengarungi kehidupan bermasyarakat, berbangsa, dan bernegara.", "Bersama jajaran Dewan Pengasuh dan keluarga besar Pondok Pesantren Sunanulhuda lainnya, KH. Encep Solahudin Al-Ayubi Sanusi bahu-membahu menjaga marwah pesantren sebagai kawah candradimuka pencetak kader ulama dan intelektual muslim. Dedikasi beliau dalam mengajar, membimbing, serta melayani kebutuhan umat merupakan kelanjutan nyata dari mata rantai pengabdian yang diwariskan oleh Mama KH. Uci Sanusi dan Buya KH. Dadun Sanusi.", "Melalui kiprah dan pengabdiannya hingga saat ini, KH. Encep Solahudin Al-Ayubi Sanusi terus menjadi bagian penting dari denyut nadi pendidikan dan dakwah di Pondok Pesantren Sunanulhuda Cikaroya. Ketekunan beliau dalam merawat tradisi ilmu, membina akhlak generasi muda, serta mengabdi kepada masyarakat menjadi cerminan nyata pengabdian seorang ulama pesantren yang istiqamah meneruskan cahaya keilmuan para pendahulunya bagi kemaslahatan umat."]}, {"id": "adab", "src": "Ubudiyah · NU Online Jabar", "h": "Sepuluh Adab Murid kepada Guru Menurut Imam al-Ghazali", "ex": "Ulasan sepuluh adab yang perlu dijaga santri saat berinteraksi dengan guru, kiai, atau ustadz, bersumber dari risalah al-Adab fid Din karya Imam al-Ghazali: dari mendahului salam hingga menjaga lisan dan waktu bertanya.", "name": "Adab Murid kepada Guru", "mono": "A", "pill": "Ubudiyah", "facts": [], "bg": "linear-gradient(160deg,#25c0b2,#14796f)", "pos": "50%", "title": "SEPULUH ADAB MURID KEPADA GURU", "sub": "Menurut Imam al-Ghazali dalam al-Adab fid Din · NU Online Jabar", "cap": "Ilustrasi: santri belajar kitab di pesantren tempo dulu.", "link": "https://jabar.nu.or.id/ubudiyah/sepuluh-adab-murid-kepada-guru-menurut-imam-al-ghazali-2jaEk", "body": ["Dalam proses belajar, murid membutuhkan guru, ustadz, atau kiai, dan keduanya perlu berinteraksi. Karena itu Imam al-Ghazali, dalam risalah al-Adab fid Din, menasihatkan sejumlah adab yang harus dijaga murid terhadap gurunya.", "Pertama, mendahului salam, sejalan dengan tuntunan bahwa yang muda memberi salam kepada yang lebih tua. Kedua, tidak banyak berbicara di hadapan guru agar tidak terkesan merasa lebih tahu. Ketiga, berdiri ketika guru berdiri, sebagai sopan santun sekaligus kesiapan membantu bila guru memerlukan.", "Keempat, tidak langsung menyanggah dengan mengatakan bahwa pendapat orang lain berbeda; murid sebaiknya meminta izin lebih dulu. Kelima, tidak bertanya-tanya kepada teman sebelah saat guru sedang mengajar, melainkan langsung kepada guru. Keenam, tidak mengumbar senyum atau tawa berlebihan ketika berbicara dengan guru, karena guru tidak setara dengan teman sebaya.", "Ketujuh, tidak menunjukkan perbedaan pendapat secara terang-terangan di depan orang banyak; lebih santun jika disampaikan sebagai permintaan komentar kepada guru. Kedelapan, tidak menarik pakaian guru ketika beliau berdiri; bila hendak membantu, murid dapat menawarkan pundak atau mengikuti arahan guru.", "Kesembilan, tidak menanyakan persoalan di tengah perjalanan, terutama yang bersifat pribadi, hingga guru tiba di rumah. Kesepuluh, tidak banyak mengajukan pertanyaan ketika guru sedang lelah, apalagi yang jawabannya rumit, agar guru dapat beristirahat memulihkan tenaga.", "Intinya, murid hendaknya hormat kepada guru, baik lewat sikap maupun dengan menjaga lisan, serta tahu kapan dan bagaimana patut berbicara atau bertanya."]}, {"id": "mu", "src": "Opini · NU Online Jabar", "h": "Mengintip ‘Berkah’ Laga Eksibisi Legenda MU vs Arsenal bagi Perkembangan Sepak Bola Nasional", "ex": "Opini Rudi Sirojudin Abas tentang laga eksibisi The Rivalry Returns 2026 di Stadion Gelora Bung Karno, Jakarta, dan bagaimana pertandingan besar seperti ini dapat menumbuhkan gairah serta mendorong perbaikan sepak bola nasional.", "name": "Laga Eksibisi Legenda Manchester United vs Arsenal", "mono": "M", "pill": "Berita", "facts": [], "bg": "linear-gradient(160deg,#25c0b2,#14796f)", "pos": "50%", "title": "LAGA EKSIBISI LEGENDA MU VS ARSENAL", "sub": "Opini Rudi Sirojudin Abas · NU Online Jabar, 10 Oktober 2026", "cap": "Ilustrasi laga eksibisi Legenda Manchester United vs Arsenal di Stadion Gelora Bung Karno. Sumber: NU Online Jabar/Gemini AI.", "link": "https://jabar.nu.or.id/opini/mengintip-berkah-laga-eksibisi-legenda-mu-vs-arsenal-bagi-perkembangan-sepak-bola-nasional-I7hPS", "body": ["Opini ini ditulis Rudi Sirojudin Abas, Ketua Lakpesdam PCNU Kabupaten Garut, dan dimuat NU Online Jabar pada 10 Oktober 2026. Penulis memandang sepak bola bukan sekadar permainan atau urusan menang dan kalah, melainkan momen yang mengingatkan para penggemarnya pada kemeriahan, drama, dan sejarah yang dikenang bersama.", "Menurut penulis, sebutan pemain legendaris tidak mudah diperoleh. Pemain perlu berjasa besar bagi timnya, konsisten membela klub dalam waktu lama, meraih prestasi, mampu memotivasi tim, dan memberi keteladanan dalam bermain.", "Laga eksibisi internasional The Rivalry Returns 2026 digelar di Stadion Utama Gelora Bung Karno (SUGBK), Jakarta, pada 10 Oktober 2026, mempertemukan para legenda Manchester United dan Arsenal. Penulis mengapresiasi PSSI yang menggagasnya. Meski hanya eksibisi dan bukan agenda resmi FIFA, laga ini dinilai membawa dampak baik: menghibur penggemar, memperlihatkan permainan yang indah dari pemain-pemain bintang, dan melengkapi euforia setelah Timnas Indonesia menjuarai FIFA ASEAN Cup 2026.", "Penulis juga mencatat bahwa negara-negara Asia seperti Jepang, Korea Selatan, dan negara-negara Arab maju karena mampu beradaptasi dengan sepak bola Eropa, baik dari sisi pemain, event, maupun ekonomi. Indonesia mulai menempuh jalan serupa lewat diaspora pemain, keterlibatan pemain asing di liga, dan penyelenggaraan event internasional.", "Di akhir tulisan, ia menegaskan bahwa peningkatan kualitas sepak bola nasional membutuhkan banyak langkah: regulasi liga, pembinaan pemain muda, pencarian bakat, pemantauan, optimalisasi sarana dan prasarana, serta keterlibatan dalam gelaran internasional. Laga besar, sekalipun eksibisi, dapat menjadi salah satu indikator arah perbaikan sepak bola Indonesia."]}];

var DEV={"img": "assets/355b7c67fc.webp", "paras": ["Dhama Maulana adalah seorang mahasiswa program studi Pendidikan Bahasa dan Sastra Indonesia (PBSI) di Universitas Islam Negeri (UIN) Syarif Hidayatullah Jakarta yang berasal dari Sukabumi, Jawa Barat. Tumbuh dari latar belakang pendidikan di MTs dan MA Sunanulhuda, ia memiliki ketertarikan yang mendalam terhadap dunia kesusastraan klasik maupun modern Indonesia, kajian gender, serta dinamika sosial-budaya. Komitmen akademiknya terlihat dari produktivitasnya dalam menulis karya ilmiah termasuk publikasi artikel di jurnal terindeks SINTA dan penelitian lapangan mengenai tradisi lokal yang dipergunakan untuk persiapan langkah lanjutnya menuju studi pascasarjana di bidang Kajian Gender Universitas Indonesia.", "Di luar ruang kuliah, Dhama aktif menggerakkan ekosistem literasi dan seni pertunjukan melalui berbagai peran kepemimpinan. Ia dipercaya mengemban amanah sebagai Kepala Bidang Literasi dan Pengembangan (Litbang) di organisasi daerah Riungan Mahasiswa Sukabumi (RIMASI) sekaligus menjabat sebagai Penyunting Naskah (Editorial Lead) di Lembaga Semi Otonom (LSO) Sakustik. Kepeduliannya terhadap pendidikan masyarakat juga diwujudkan melalui keterlibatan langsung dalam gerakan literasi akar rumput untuk anak-anak, serta pengalaman mengajar sebagai tutor privat di lembaga bimbingan belajar.", "Perpaduan antara kepekaan sastra, jiwa wirausaha, dan keterampilan teknologi menjadi ciri khas dari setiap inisiatif yang ia bangun. Di sela kesibukan akademik dan organisasinya, Dhama mengelola usaha percetakan mandiri bernama Karsa Print yang melayani kebutuhan cetak mahasiswa, sekaligus merancang berbagai media pembelajaran interaktif berbasis web dan permainan edukasi seperti Sobat Bahasa, PenasSiswa, VTS-CLAW, dan Katanya Indonesia. Sosoknya merepresentasikan generasi muda yang tidak hanya tekun merawat tradisi intelektual dan sastra, tetapi juga adaptif dalam menghadirkan inovasi digital yang berdampak bagi dunia pendidikan."], "chips": ["PBSI UIN Syarif Hidayatullah Jakarta", "Alumni MTs &amp; MA Sunanulhuda", "Kabid Litbang RIMASI", "Editorial Lead LSO Sakustik", "Karsa Print"]};

var TM_INDP=["Indah Fadhilla, M.Hum., merupakan seorang akademisi dan tenaga pengajar di Universitas Islam Negeri (UIN) Syarif Hidayatullah Jakarta. Menyandang gelar Magister Humaniora (M.Hum.), beliau mendedikasikan kiprah keilmuannya dalam bidang kajian humaniora serta pengembangan wacana akademik di lingkungan perguruan tinggi Islam negeri. Kehadirannya sebagai dosen di UIN Jakarta mencerminkan komitmen dalam memadukan kedalaman analisis ilmu-ilmu kemanusiaan dengan nilai-nilai keislaman dan keindonesiaan yang menjadi ciri khas institusi tersebut.", "Dalam menjalankan peran pengajarannya, Indah Fadhilla dikenal sebagai pendidik yang mendorong mahasiswa untuk berpikir kritis, analitis, dan peka terhadap dinamika sosial maupun budaya. Beliau aktif membimbing mahasiswa dalam berbagai mata kuliah keilmuan serta pendampingan penulisan karya ilmiah, dengan pendekatan pembelajaran yang dialogis dan konstruktif. Melalui proses perkuliahan, beliau berupaya membekali generasi muda dengan kemampuan literasi akademik yang kuat agar mampu merespons tantangan intelektual di era kontemporer.", "Selain aktivitas mengajar di ruang kelas, beliau juga terlibat aktif dalam kegiatan penelitian dan publikasi ilmiah yang menjadi bagian integral dari Tri Dharma Perguruan Tinggi. Fokus kajiannya berkaitan erat dengan ranah humaniora, kebudayaan, serta dinamika keilmuan yang relevan dengan perkembangan masyarakat modern. Partisipasinya dalam berbagai forum diskusi akademik, seminar, dan pengembangan kajian keilmuan turut memperkaya khazanah intelektual di lingkungan sivitas akademika UIN Syarif Hidayatullah Jakarta.", "Melalui dedikasinya di bidang pendidikan, penelitian, dan pengabdian kepada masyarakat, Indah Fadhilla, M.Hum., terus berkontribusi dalam mencetak lulusan yang unggul secara intelektual maupun berintegritas secara moral. Kiprahnya sebagai dosen tidak hanya berfokus pada transfer pengetahuan semata, melainkan juga pada pembentukan karakter akademisi yang humanis, terbuka, dan berkontribusi nyata bagi kemajuan ilmu pengetahuan serta masyarakat luas."];
var TM_DIDP=["Didah Nurhamidah, M.Pd. merupakan dosen Program Studi Pendidikan Bahasa dan Sastra Indonesia, Fakultas Ilmu Tarbiyah dan Keguruan, Universitas Islam Negeri Syarif Hidayatullah Jakarta. Saat ini, ia sedang menempuh pendidikan doktor pada Universitas Negeri Jakarta dengan fokus penelitian pada pengembangan model pembelajaran bahasa, khususnya integrasi literasi kritis dan Visual Thinking Strategy (VTS) untuk pengembangan keterampilan menulis akademik mahasiswa.", "Dalam aktivitas akademiknya, Didah Nurhamidah memiliki perhatian terhadap pengembangan pembelajaran bahasa Indonesia, keterampilan menulis akademik, strategi pembelajaran, dan inovasi media pembelajaran. Keterlibatannya dalam pengajaran berbagai mata kuliah, seperti Menulis Akademik, Strategi Pembelajaran, Media Pembelajaran, dan Metodologi Penelitian, menjadi bagian dari pengalaman akademik yang mendukung pengembangan pendekatan pembelajaran yang berorientasi pada penguatan kemampuan berpikir kritis, literasi, dan keterampilan berbahasa mahasiswa.", "Selain menjalankan tugas sebagai dosen, ia juga aktif dalam kegiatan penelitian, publikasi ilmiah, dan pengelolaan jurnal akademik. Dalam bidang publikasi, ia berperan sebagai Managing Editor Jurnal Dialektika, sebuah jurnal ilmiah yang berfokus pada kajian pendidikan bahasa dan sastra Indonesia. Keterlibatan tersebut mencerminkan kontribusinya dalam pengembangan budaya akademik, penguatan kualitas publikasi ilmiah, serta diseminasi hasil penelitian di bidang pendidikan bahasa dan sastra.", "Melalui penelitian disertasi berjudul Model Pembelajaran Literasi Kritis Berbasis Visual Thinking Strategy (VTS) untuk Pengembangan Keterampilan Menulis Akademik, ia mengembangkan model VTS-CLAW sebagai pendekatan pembelajaran yang mengintegrasikan pengamatan visual, pertanyaan kritis, interpretasi berbasis bukti, dialog multiperspektif, penelusuran sumber akademik, konstruksi argumentasi, serta produksi dan refleksi tulisan akademik. Model ini dirancang untuk memfasilitasi mahasiswa dalam mengembangkan kemampuan literasi kritis sekaligus meningkatkan kualitas proses dan hasil menulis akademik.", "Pengembangan model VTS-CLAW merupakan bagian dari upaya menghadirkan inovasi pembelajaran bahasa Indonesia di perguruan tinggi yang lebih dialogis, reflektif, berbasis bukti, dan berorientasi pada pengembangan kemampuan berpikir tingkat tinggi. Melalui penelitian ini, Didah Nurhamidah berupaya memberikan kontribusi teoretis dan praktis terhadap pengembangan model pembelajaran literasi kritis dan keterampilan menulis akademik dalam konteks pendidikan tinggi."];

var MATERI=[{"id":"kelas-8","judul":"Bahasa Indonesia Kelas VIII","sub":"Modul Terpadu Kurikulum Merdeka · Bab 1–17","deskripsi":"Teks laporan hasil observasi, iklan, artikel ilmiah populer, eksposisi, eksplanasi, ulasan, puisi, drama, serta paket soal PAS, PAT, dan pengenalan TKA dengan kunci jawaban.","bab":[{"id":"c0","label":"Pengantar","judul":"Tentang Modul Ini","b":[["p","Modul pembelajaran ini mencakup 17 bab lengkap yang memadukan teori struktur teks, kaidah kebahasaan, keterampilan menyusun teks fungsional maupun sastra, serta evaluasi sumatif (PAS, PAT) dan pengenalan Tes Kemampuan Akademik (TKA)."],["h","Cakupan Materi"],["ul",["Semester Ganjil (Bab 1 - Bab 9): Teks Laporan Hasil Observasi (1 & 2), Iklan-Slogan-Poster (1 & 2), Artikel Ilmiah Populer, Teks Eksposisi, Teks Eksplanasi, Penilaian Akhir Semester (PAS), & Pengenalan TKA (1).","Semester Genap (Bab 10 - Bab 17): Teks Ulasan (1 & 2), Puisi (1 & 2), Drama (1 & 2), Penilaian Akhir Tahun (PAT), & Pengenalan Tes Kemampuan Akademik / TKA (2).","Fitur Evaluasi: Dilengkapi Paket Soal Latihan PAS, PAT, Pengenalan TKA (1) & (2), serta Kunci Jawaban dan Pembahasan Lengkap."]]]},{"id":"c1","label":"Bab 1","judul":"Teks Laporan Hasil Observasi (1): Pengertian, Ciri, & Struktur","b":[["p","Teks Laporan Hasil Observasi (LHO) adalah teks yang menghadirkan informasi mengenai suatu hal secara apa adanya sebagai hasil pengamatan sistematis dan analisis ilmiah. Objek pengamatan dapat berupa keadaan alam, lingkungan hidup, hewan, tumbuhan, fenomena sosial, kesenian, maupun peristiwa budaya."],["h","A. Tujuan dan Ciri-Ciri Teks Laporan Hasil Observasi"],["p","Tujuan utama teks LHO adalah menyampaikan informasi faktual kepada pembaca secara objektif dan sistematis tanpa dipengaruhi opini pribadi penulis. Ciri-ciri pokok teks LHO meliputi:"],["ul",["Bersifat Objektif dan Faktual: Informasi yang disajikan didasarkan pada fakta hasil pengamatan langsung di lapangan, bukan rekaan atau dugaan subjektif penulis.","Ditulis Secara Lengkap dan Sistematis: Menguraikan bagian-bagian objek secara runtut dari gambaran umum menuju rincian khusus.","Bersifat Universal dan Ilmiah: Menggunakan bahasa baku dan istilah keilmuan yang dapat dipertanggungjawabkan kebenarannya.","Tidak Mengandung Prasangka atau Pemihakan: Penulis bersikap netral dan tidak menyelipkan ajakan persuasif sebagaimana dalam teks iklan atau persuasi."]],["h","B. Struktur Teks Laporan Hasil Observasi"],["tb",["Bagian Struktur","Fungsi & Isi Pokok","Penanda Kebahasaan Khas"],[["1. Definisi Umum (Pernyataan Umum)","Berisi pembuka yang memuat pengertian, klasifikasi umum, nama ilmiah (bahasa Latin), serta gambaran global mengenai objek yang diamati.","Menggunakan verba kopula (adalah, ialah, merupakan, yaitu, yakni, digolongkan menjadi)."],["2. Deskripsi Bagian","Memerinci bagian-bagian objek secara mendetail (ciri fisik, habitat, jenis-jenis, perilaku, struktur tubuh, atau komponen pembentuknya).","Menggunakan kata sifat deskriptif, pengelompokan (terbagi atas, terdiri dari), dan rincian indrawi."],["3. Deskripsi Manfaat / Simpulan","Menjelaskan kegunaan, fungsi, nilai ekonomis, ekologis, atau dampak positif objek bagi manusia dan lingkungan (bersifat opsional sebagai penutup).","Menggunakan kata fungsi (bermanfaat untuk, berfungsi sebagai, berguna bagi, dimanfaatkan dalam)."]]],["h","C. Contoh Analisis Struktur Teks LHO Singkat"],["h3","Contoh Teks: Lidah Buaya (Aloe vera)"],["ul",["[Definisi Umum] Lidah buaya (Aloe vera) adalah spesies tumbuhan dengan daun berdaging tebal dari genus Aloe yang berasal dari Jazirah Arab dan telah menyebar ke berbagai wilayah beriklim tropis maupun subtropis di dunia.","[Deskripsi Bagian] Tanaman ini tidak memiliki batang yang tampak jelas karena tertutup oleh pelepah daun yang tersusun rapat membentuk roset. Daunnya berwarna hijau keabu-abuan, meruncing di bagian ujung, serta memiliki gerigi duri kecil di sepanjang tepinya. Di dalam daun terdapat lapisan gel bening yang kaya akan air, vitamin, dan asam amino.","[Deskripsi Manfaat] Gel lidah buaya dimanfaatkan secara luas dalam industri farmasi dan kosmetik untuk melembapkan kulit, menyembuhkan luka bakar ringan, serta menjaga kesehatan rambut. Selain itu, daging daunnya juga diolah menjadi minuman kesehatan yang menyegarkan."]]]},{"id":"c2","label":"Bab 2","judul":"Teks Laporan Hasil Observasi (2): Kaidah Kebahasaan & Penyusunan Teks","b":[["p","Untuk menghasilkan teks laporan hasil observasi yang lugas dan informatif, penulis wajib mematuhi kaidah kebahasaan ilmiah serta mampu memadukan paragraf deskripsi dan paragraf eksposisi secara proporsional."],["h","A. Kaidah Kebahasaan Teks Laporan Hasil Observasi"],["ul",["1. Kata dan Frasa Nomina serta Verba: Dominan menggunakan kata benda (nomina) untuk menyebut objek pengamatan beserta frasa nominal (contoh: tumbuhan obat keluarga, ekosistem terumbu karang) dan kata kerja (verba) aktif untuk menjelaskan perilaku atau proses (tumbuh, berkembang biak, menyerap).","2. Afiksasi (Pengimbuhan): Perubahan kelas kata melalui imbuhan (misalnya nomina 'observasi' menjadi verba 'mengobservasi'; adjektiva 'kering' menjadi verba 'mengeringkan' atau nomina 'kekeringan').","3. Kalimat Definisi dan Kalimat Deskripsi: Kalimat definisi menjelaskan pengertian umum objek menggunakan kopula (adalah, ialah, merupakan). Kalimat deskripsi menggambarkan sifat atau ciri fisik objek secara spesifik (contoh: 'Daunnya berbentuk lanset dengan panjang mencapai 40 sentimeter').","4. Kalimat Simpleks dan Kalimat Kompleks: Kalimat simpleks hanya memiliki satu struktur predikat/klausa (contoh: 'Komodo merupakan kadal terbesar di dunia'). Kalimat kompleks memiliki dua klausa atau lebih yang dihubungkan oleh konjungsi (contoh: 'Komodo berburu mangsa pada siang hari, sedangkan pada malam hari ia beristirahat di dalam liang').","5. Penggunaan Istilah Teknis / Keilmuan: Memakai kosakata bidang ilmu tertentu sesuai objek observasi (contoh: fotosintesis, habitat, karnivora, ekosistem, endemik)."]],["h","B. Perbedaan Paragraf Deskripsi dan Paragraf Eksposisi dalam LHO"],["tb",["Aspek","Paragraf Deskripsi dalam LHO","Paragraf Eksposisi dalam LHO"],[["Fokus Uraian","Menggambarkan wujud fisik, bentuk, warna, ukuran, dan ciri lahiriah objek secara konkret.","Menjelaskan proses kerja, fungsi, klasifikasi ilmiah, atau data statistik objek secara informatif."],["Contoh Kalimat","Bunga bangkai raksasa memiliki kelopak luar berwarna hijau pucat dan bagian dalam berwarna merah marun pekat.","Penyerbukan bunga bangkai dibantu oleh serangga kumbang bangkai yang tertarik pada aroma menyengat dari tongkolnya."]]],["h","C. Langkah-Langkah Menyusun Teks Laporan Hasil Observasi"],["ul",["Langkah 1 - Menentukan Objek dan Tujuan Observasi: Memilih objek yang menarik, spesifik, dan dapat diamati secara langsung maupun melalui rujukan ilmiah terpercaya.","Langkah 2 - Melakukan Pengamatan dan Mencatat Data Faktual: Mengumpulkan fakta lapangan dengan panduan rumus 5W + 1H (apa objeknya, di mana ditemukan, bagaimana ciri fisiknya, apa manfaatnya).","Langkah 3 - Menyusun Kerangka Karangan: Mengelompokkan catatan fakta ke dalam tiga kerangka utama: definisi umum, deskripsi bagian, dan deskripsi manfaat.","Langkah 4 - Mengembangkan Kerangka dan Menyunting: Menulis paragraf utuh menggunakan kalimat efektif, istilah teknis yang tepat, dan ejaan sesuai kaidah EYD."]]]},{"id":"c3","label":"Bab 3","judul":"Iklan, Slogan, dan Poster (1): Definisi, Perbedaan, & Jenis","b":[["p","Iklan, slogan, dan poster merupakan media komunikasi massa yang bertujuan menyampaikan pesan, membangun citra, serta memengaruhi khalayak agar menerima gagasan atau melakukan tindakan tertentu."],["h","A. Pengertian dan Perbandingan Unsur Pembentuk"],["tb",["Bentuk Teks","Definisi","Unsur Utama yang Dimiliki","Media Penyampaian"],[["Iklan","Teks pemberitahuan kepada khalayak mengenai barang atau jasa yang dijual, dipasang di media massa atau ruang publik.","Perpaduan lengkap: Gambar, Kata-kata (teks), Gerak, dan Suara (pada media elektronik/digital).","Media cetak (koran, majalah), media elektronik (TV, radio), media digital (media sosial, situs web)."],["Slogan","Perkataan atau kalimat pendek yang menarik, mencolok, dan mudah diingat untuk memberitahukan atau menjelaskan tujuan suatu ideologi, golongan, organisasi, atau kampanye.","Mengutamakan Kata-kata (kalimat singkat, padat, berima/puitis) dan Suara (jika dilisankan).","Spanduk, kaos, stiker, tajuk kampanye, logo acara, media audio."],["Poster","Plakat (kata-kata dan gambar) yang dipajang di tempat-tempat umum sebagai pengumuman atau iklan layanan masyarakat.","Perpaduan Gambar/ilustrasi visual yang dominan dan Kata-kata singkat yang mencolok.","Dinding bangunan, papan pengumuman, tiang reklame, majalah dinding (mading)."]]],["h","B. Klasifikasi Jenis Iklan Berdasarkan Isi dan Tujuan"],["ul",["1. Iklan Pemberitahuan (Pengumuman): Bertujuan memberitahukan suatu informasi atau peristiwa kepada masyarakat luas, seperti iklan berita duka cita, pengumuman rapat umum pemegang saham, atau iklan reuni.","2. Iklan Layanan Masyarakat (Nonkomersial): Bertujuan memberikan penerangan, edukasi, dan kesadaran sosial kepada masyarakat tanpa mencari keuntungan finansial (contoh: kampanye hemat energi, bahaya narkoba, pentingnya imunisasi, gerakan membaca buku).","3. Iklan Penawaran (Niaga/Komersial): Bertujuan menawarkan produk barang atau jasa kepada konsumen untuk meningkatkan penjualan (contoh: iklan produk makanan, jasa pengiriman, bimbingan belajar).","4. Iklan Permintaan: Berisi ajakan atau permintaan agar pihak lain memenuhi kebutuhan pemasang iklan, misalnya iklan lowongan pekerjaan."]],["h","C. Contoh Slogan Berdasarkan Tema"],["ul",["Slogan Pendidikan: \"Tiada hari tanpa prestasi, tiada prestasi tanpa literasi.\" / \"Buku adalah jendela dunia, membaca adalah kuncinya.\"","Slogan Lingkungan: \"Hijaukan kembali bumi kita, selamatkan masa depan generasi bangsa.\" / \"Buanglah sampah pada tempatnya, bersih itu sehat.\"","Slogan Kesehatan: \"Mencegah lebih baik daripada mengobati.\" / \"Tubuh sehat, jiwa kuat, belajar pun semangat.\""]]]},{"id":"c4","label":"Bab 4","judul":"Iklan, Slogan, dan Poster (2): Kaidah Kebahasaan & Perancangan","b":[["p","Keberhasilan sebuah iklan, slogan, maupun poster sangat ditentukan oleh ketepatan pemilihan diksi dan kekuatan daya bujuk (persuasi) bahasanya. Pesan harus tersampaikan dalam hitungan detik kepada pembaca atau pemirsa."],["h","A. Kaidah Kebahasaan Iklan, Slogan, dan Poster"],["ul",["1. Kalimat Persuasif: Kalimat yang bertujuan meyakinkan dan membujuk pembaca agar tertarik mengikuti isi pesan. Ditandai kata-kata positif seperti nikmati, rasakan, dapatkan, wujudkan, hemat, terpercaya.","2. Kalimat Imperatif (Perintah/Ajakan): Kalimat yang berisi perintah, larangan, atau ajakan halus menggunakan partikel -lah atau kata ajakan seperti ayo, mari, gunakanlah, jagalah, hindarilah.","3. Berima dan Puitis: Memanfaatkan persamaan bunyi (rima) atau permainan kata agar mudah diingat (memorable). Contoh: 'Orang bijak taat pajak', 'Bersih pangkal sehat'.","4. Berkesan Positif dan Komunikatif: Menonjolkan keunggulan produk atau manfaat positif tindakan tanpa menjatuhkan pihak lain secara tidak etis.","5. Singkat, Padat, dan Jelas: Menghindari kalimat bertele-tele; menggunakan frasa atau klausa pendek dengan ukuran huruf yang kontras dan terbaca dari jarak jauh."]],["h","B. Struktur Anatomi Teks Iklan Komersial"],["ul",["Kepala Tulisan (Headline): Bagian paling mencolok dengan ukuran huruf terbesar untuk menarik perhatian (attention) pembaca pertama kali.","Subjudul (Subheadline): Penjelasan singkat yang menjembatani headline dengan isi utama iklan.","Tubuh Iklan (Body Copy): Uraian keunggulan produk, spesifikasi, manfaat utama, atau promo yang ditawarkan.","Justifikasi / Penutup (Call to Action): Ajakan bertindak segera disertai informasi kontak, alamat, situs web, atau akun media sosial pemasar."]],["h","C. Prinsip AIDA dalam Merancang Iklan dan Poster"],["h3","Formula AIDA untuk Perancangan Iklan & Poster Efektif"],["ul",["Attention (Perhatian): Gunakan ilustrasi kontras, warna serasi, dan headline provokatif yang langsung memikat mata.","Interest (Minat): Sajikan manfaat relevan yang menjawab kebutuhan atau masalah target audiens.","Desire (Keinginan): Bangkitkan dorongan emosional atau keuntungan rasional (diskon, garansi, kualitas teruji).","Action (Tindakan): Cantumkan instruksi jelas (misalnya: 'Daftar sekarang melalui tautan berikut!' atau 'Hubungi nomor layanan kami')."]]]},{"id":"c5","label":"Bab 5","judul":"Artikel Ilmiah Populer: Ciri, Struktur, & Fakta vs Opini","b":[["p","Artikel ilmiah populer adalah karya tulis yang mengandung ilmu pengetahuan, data penelitian, atau kajian akademik, tetapi disajikan dengan bahasa yang ringan, komunikatif, dan mudah dipahami oleh masyarakat umum di media massa (surat kabar, majalah, atau portal berita daring)."],["h","A. Ciri-Ciri Artikel Ilmiah Populer"],["ul",["1. Berbasis Fakta dan Data Ilmiah: Gagasan yang diangkat didukung oleh bukti empiris, hasil riset, atau pendapat pakar, bukan sekadar opini kosong.","2. Bahasa Komunikatif dan Lugas: Menghindari jargon teknis yang terlalu kaku; jika memakai istilah ilmiah, penulis langsung memberikan penjelasan sederhana yang mudah dicerna pembaca awam.","3. Objektif dan Logis: Penalaran disusun secara runtut berdasarkan hubungan sebab-akibat yang masuk akal.","4. Aktual dan Relevan: Mengangkat persoalan yang dekat dengan kehidupan masyarakat sehari-hari (pendidikan, kesehatan, lingkungan, teknologi, budaya)."]],["h","B. Struktur Artikel Ilmiah Populer"],["tb",["Bagian Struktur","Isi & Fungsi Utama"],[["1. Judul","Singkat, padat, menarik minat baca, dan mencerminkan topik utama artikel secara akurat."],["2. Pendahuluan (Lead)","Paragraf pembuka yang memaparkan latar belakang fenomena aktual, data awal, atau pertanyaan pemantik untuk menarik perhatian pembaca menuju tesis penulis."],["3. Isi / Pembahasan","Uraian mendalam mengenai pokok persoalan yang dilengkapi argumen logis, bukti statistik, kutipan ahli, serta perbandingan fakta lapangan."],["4. Penutup","Berisi simpulan ringkas atas seluruh pembahasan disertai rekomendasi, harapan, atau ajakan reflektif bagi pembaca."]]],["h","C. Fakta dan Opini dalam Artikel Ilmiah Populer"],["p","Artikel ilmiah populer selalu memadukan fakta sebagai landasan objektif dan opini penulis sebagai gagasan analisis. Fakta adalah hal atau peristiwa yang benar-benar terjadi dan dapat dibuktikan kebenarannya (misalnya data survei BPS, hasil uji laboratorium, tanggal peristiwa). Sementara itu, opini adalah pendapat, penilaian, atau saran penulis dalam menyikapi fakta tersebut (sering ditandai kata sebaiknya, perlu, diharapkan, sangat penting, menurut para ahli)."],["h","D. Cara Mengumpulkan Data untuk Artikel Ilmiah Populer"],["ul",["Wawancara: Tanya jawab langsung dengan narasumber ahli atau pelaku lapangan menggunakan daftar pertanyaan terstruktur.","Kuesioner (Angket): Menyebarkan daftar pertanyaan tertulis kepada responden untuk memperoleh data kuantitatif maupun kecenderungan sikap.","Studi Pustaka (Membaca Tulisan Orang Lain): Mengumpulkan rujukan dari jurnal ilmiah, buku teks, laporan resmi lembaga pemerintah, atau ensiklopedia terpercaya."]]]},{"id":"c6","label":"Bab 6","judul":"Teks Eksposisi: Struktur, Pola Pengembangan, & Kaidah Kebahasaan","b":[["p","Teks eksposisi adalah karangan nonfiksi yang memuat sejumlah informasi dan pengetahuan yang disajikan secara singkat, padat, akurat, dan objektif dengan tujuan menjelaskan atau memaparkan suatu konsep agar wawasan pembaca bertambah."],["h","A. Struktur Teks Eksposisi"],["ul",["1. Tesis (Pernyataan Pendapat): Bagian pembuka yang berisi pengenalan isu, masalah, atau pandangan umum penulis mengenai topik yang akan dibahas.","2. Rangkaian Argumen: Bagian isi yang memuat sejumlah alasan logis, fakta, data statistik, dan pernyataan para ahli untuk memperkuat tesis yang dikemukakan di awal.","3. Penegasan Ulang (Simpulan): Bagian penutup yang merumuskan kembali inti tesis secara ringkas berdasarkan argumen-argumen yang telah dipaparkan."]],["h","B. Pola-Pola Pengembangan Teks Eksposisi"],["tb",["Pola Pengembangan","Mekanisme Penyajian Gagasan"],[["1. Pola Umum - Khusus (Deduktif)","Ide pokok ditempatkan pada awal paragraf, lalu diikuti ide-ide penjelas yang bersifat khusus dan rinci."],["2. Pola Khusus - Umum (Induktif)","Hal-hal khusus atau contoh empiris diuraikan terlebih dahulu, lalu ditarik simpulan umum pada akhir paragraf."],["3. Pola Ilustrasi / Contoh","Gagasan yang terlalu umum diperjelas dengan menghadirkan ilustrasi atau contoh konkret yang dialami dalam kehidupan nyata."],["4. Pola Perbandingan","Menjelaskan suatu ide dengan membandingkan persamaan maupun perbedaannya dengan hal lain yang sudah dikenal pembaca."],["5. Pola Definisi","Menguraikan pengertian suatu istilah secara luas meliputi ciri, sifat, dan ruang lingkupnya."],["6. Pola Proses","Memaparkan urutan tahapan kerja, cara pembuatan, atau langkah-langkah terjadinya suatu hal secara kronologis."]]],["h","C. Kaidah Kebahasaan Teks Eksposisi"],["ul",["Pronomina (Kata Ganti): Menggunakan pronomina persona (kita, kami, penulis, mereka) dan pronomina nonpersona (ini, itu, tersebut, hal ini).","Kata Teknis / Peristilahan: Memakai istilah sesuai bidang keilmuan topik (misalnya: inflasi, deforestasi, kurikulum, metabolisme).","Konjungsi Kausalitas dan Kronologis: Menggunakan kata penghubung sebab-akibat (sebab, karena, oleh karena itu, akibatnya, sehingga) dan urutan (pertama, kedua, selanjutnya, akhirnya).","Verba Mental: Kata kerja yang menggambarkan persepsi, afeksi, atau kognisi (berpendapat, menyimpulkan, memperkirakan, menduga, menganggap).","Kata Perujukan: Frasa untuk merujuk sumber data (berdasarkan data..., merujuk pada pendapat..., menurut laporan...)."]]]},{"id":"c7","label":"Bab 7","judul":"Teks Eksplanasi: Fenomena Alam/Sosial & Hubungan Kausalitas","b":[["p","Teks eksplanasi adalah teks yang menjelaskan proses terjadinya atau terbentuknya suatu fenomena alam, sosial, budaya, maupun ilmu pengetahuan. Teks ini menjawab pertanyaan 'mengapa' dan 'bagaimana' suatu peristiwa dapat terjadi secara ilmiah."],["h","A. Ciri-Ciri dan Struktur Teks Eksplanasi"],["p","Teks eksplanasi disusun berdasarkan fakta ilmiah yang dirangkai secara kausalitas (sebab-akibat) dan kronologis (urutan waktu). Strukturnya terdiri atas tiga bagian utama:"],["ul",["1. Identifikasi Fenomena (Pernyataan Umum): Menggambarkan secara umum fenomena atau peristiwa yang akan dijelaskan (apa fenomena tersebut dan gambaran dasarnya).","2. Penggambaran Rangkaian Kejadian (Deretan Penjelas): Memerinci proses terjadinya fenomena secara bertahap. Bagian ini dapat disusun berdasarkan pola kausalitas (hubungan sebab-akibat) maupun pola kronologis (urutan proses dari awal hingga akhir).","3. Ulasan (Interpretasi): Berisi komentar, simpulan, atau penilaian atas konsekuensi maupun dampak fenomena yang telah dijelaskan (bersifat opsional)."]],["h","B. Kaidah Kebahasaan Teks Eksplanasi"],["tb",["Kaidah Kebahasaan","Fungsi & Contoh Penggunaan"],[["Konjungsi Kausalitas","Menyatakan hubungan sebab-akibat: sebab, karena, oleh sebab itu, oleh karena itu, sehingga, mengakibatkan, berdampak pada."],["Konjungsi Kronologis","Menyatakan urutan waktu atau tahapan proses: kemudian, lalu, setelah itu, pada akhirnya, sebelum, sejak, ketika."],["Kata Benda Fenomena (Nomina)","Merujuk pada jenis fenomena yang dijelaskan, bukan persona/orang: gerhana matahari, tanah longsor, urbanisasi, pengangguran, hujan asam."],["Kata Teknis Ilmiah","Istilah spesifik sesuai bidang fenomena: lempeng tektonik, kondensasi, presipitasi, stratifikasi sosial, abrasi."],["Kalimat Pasif","Mengutamakan proses atau objek yang dikenai tindakan menggunakan verba berawalan di- atau ter-: 'Uap air terbawa angin ke lapisan atmosfer yang lebih dingin.'"]]],["h","C. Perbedaan Utama Teks Eksposisi dan Teks Eksplanasi"],["h3","Cara Cepat Membedakan Teks Eksposisi vs Teks Eksplanasi"],["ul",["Tujuan Penulisan: Eksposisi bertujuan memaparkan gagasan/pendapat ilmiah untuk menambah wawasan; Eksplanasi bertujuan menjelaskan proses sebab-akibat terjadinya suatu fenomena.","Struktur: Eksposisi (Tesis - Rangkaian Argumen - Penegasan Ulang); Eksplanasi (Identifikasi Fenomena - Rangkaian Kejadian - Ulasan).","Fokus Isi: Eksposisi menonjolkan argumen untuk mendukung sebuah pandangan; Eksplanasi menonjolkan kronologi dan mekanisme alamiah/sosial terjadinya peristiwa."]]]},{"id":"c8","label":"Bab 8","judul":"Penilaian Akhir Semester (PAS): Evaluasi Sumatif Semester Ganjil","b":[["p","Paket Penilaian Akhir Semester (PAS) ini menguji penguasaan materi Bab 1 hingga Bab 7 (Teks Laporan Hasil Observasi, Iklan-Slogan-Poster, Artikel Ilmiah Populer, Teks Eksposisi, dan Teks Eksplanasi)."],["q","1",[["t","Bacalah kutipan teks berikut:"],["bq","'Terumbu karang adalah sekumpulan hewan karang yang bersimbiosis dengan sejenis tumbuhan alga yang disebut zooxanthellae. Ekosistem ini umumnya hidup di perairan laut dangkal yang jernih dan hangat dengan kedalaman kurang dari 50 meter.'"],["t","Dalam struktur teks laporan hasil observasi, kutipan tersebut termasuk bagian ..."]],["Deskripsi bagian","Definisi umum","Deskripsi manfaat","Rangkaian argumen","Interpretasi fenomena"]],["q","2",[["t","Kalimat berikut yang merupakan kalimat definisi dalam teks LHO adalah ..."]],["Bunglon dapat mengubah warna kulitnya sesuai lingkungan sekitar.","Hutan bakau memiliki akar tunjang yang kokoh menahan abrasi pantai.","Wayang kulit merupakan seni pertunjukan tradisional Indonesia yang telah diakui UNESCO.","Setiap pagi, burung jalak bali mencari serangga kecil di pepohonan.","Daun pepaya memiliki rasa pahit tetapi kaya akan enzim papain."]],["q","3",[["t","Cermati teks berikut: 'Satu pohon menyelamatkan ribuan kehidupan. Mari tanam pohon hari ini demi udara bersih esok hari!' Teks tersebut lebih tepat dikategorikan sebagai ..."]],["Iklan niaga","Slogan lingkungan","Teks eksposisi","Laporan observasi","Pengumuman resmi"]],["q","4",[["t","Perhatikan kalimat iklan berikut: 'Gunakan Sabun Herbal Segar! Kulit bersih, lembut, dan bebas kuman sepanjang hari.' Kalimat pertama pada iklan tersebut menggunakan jenis kalimat ..."]],["Deklaratif","Interogatif","Imperatif","Retoris","Kompleks bertingkat"]],["q","5",[["t","Perbedaan mendasar antara artikel ilmiah murni dan artikel ilmiah populer terletak pada ..."]],["Kebenaran data penelitian yang disajikan di dalamnya","Penggunaan ragam bahasa yang lebih ringan dan komunikatif bagi pembaca umum","Kewajiban mencantumkan fakta empiris dari lapangan","Struktur pemikiran yang logis dan sistematis","Keobjektifan penulis dalam memaparkan temuan"]],["q","6",[["t","Bacalah kutipan artikel berikut:"],["bq","'(1) Konsumsi gula berlebih pada remaja meningkat tajam dalam lima tahun terakhir. (2) Menurut data survei kesehatan nasional, rata-rata konsumsi minuman berpemanis pada pelajar mencapai dua hingga tiga gelas per hari. (3) Kebiasaan ini sangat berisiko memicu obesitas dan diabetes melitus di usia muda. (4) Oleh karena itu, sekolah perlu membatasi penjualan minuman tinggi gula di lingkungan kantin.'"],["t","Kalimat fakta dalam kutipan tersebut ditunjukkan oleh nomor ..."]],["(1) dan (2)","(1) dan (3)","(2) dan (4)","(3) dan (4)","(1) dan (4)"]],["q","7",[["t","Bagian struktur teks eksposisi yang berisi pengenalan isu dan pandangan awal penulis mengenai masalah yang dibahas disebut ..."]],["Orientasi","Tesis","Rangkaian argumen","Penegasan ulang","Identifikasi fenomena"]],["q","8",[["t","Bacalah paragraf berikut:"],["bq","'Gempa bumi tektonik terjadi akibat pergeseran lempeng-lempeng kerak bumi secara tiba-tiba. Ketika dua lempeng saling bertumbukan atau bergesekan, energi potensial yang terkumpul selama bertahun-tahun dilepaskan dalam bentuk gelombang seismik. Akibatnya, permukaan tanah bergetar hebat dan dapat memicu kerusakan bangunan.'"],["t","Kutipan tersebut merupakan bagian dari teks eksplanasi ka
