in, mahasiswa melaksanakan upacara di Lapangan Rektorat.","Ayah membeli jeruk Bali dan pisang Ambon di pasar tradisional.","Gubernur Jawa Barat meresmikan jembatan yang melintasi Sungai Citarum.","Kita harus menghormati Bapak dan Ibu kita di mana pun berada.","Ia membaca novel dari Ave Maria ke Jalan Lain ke Roma kemarin sore."]],["q","2",[["t","Penulisan kata depan dan imbuhan yang tepat terdapat pada kalimat ..."]],["Dimana pun berada, kita harus menjaga nama baik almamater.","Buku itu diletakkan diatas meja kerja kepala sekolah.","Keluarlah dari ruangan ini jika diskusi sudah selesai.","Pertemuan itu akan dilaksanakan di aula kampus pada hari Sabtu.","Ia lebih memilih tinggal dirumah daripada pergi keluar kota."]],["q","3",[["t","Cermati kalimat berikut: 'Untuk meningkatkan kualitas pelayanan publik, maka pemerintah daerah memperbaiki sistem administrasi.' Perbaikan kalimat tersebut agar menjadi kalimat efektif adalah ..."]],["Menghilangkan kata 'untuk'","Menghilangkan kata 'maka'","Mengganti kata 'memperbaiki' menjadi 'diperbaiki'","Menambahkan tanda titik koma sebelum kata 'maka'","Mengubah kata 'administrasi' menjadi 'administratif'"]],["q","4",[["t","Kalimat berikut yang memiliki pola dasar S - P - O - Pel adalah ..."]],["Para peneliti sedang mendiskusikan temuan terbaru di ruang rapat.","Pemerintah memberikan bantuan modal kepada pelaku usaha kecil.","Ayah membelikan adik sepeda gunung pada akhir pekan lalu.","Mahasiswa semester akhir menyusun skripsi dengan penuh ketekunan.","Tubuhnya berlumuran keringat setelah berlari mengelilingi stadion."]],["q","5",[["t","Penggunaan tanda baca yang sesuai dengan kaidah EYD terdapat pada kalimat ..."]],["Ibu membeli: beras, gula, minyak goreng, dan telur di warung.","Meskipun hujan turun sangat lebat; acara pentas seni tetap berlangsung.","Oleh karena itu kita harus mempersiapkan diri sejak dini.","Saya ingin melanjutkan studi ke jenjang magister, tetapi biaya kuliahnya cukup tinggi.","Rapat tersebut dihadiri oleh 1.250. peserta dari berbagai daerah."]],["q","6",[["t","Kata yang mengalami perubahan makna ameliorasi terdapat pada kalimat ..."]],["Oknum pegawai tersebut telah diamankan oleh pihak berwajib.","Setiap sarjana diharapkan mampu berkontribusi bagi pembangunan bangsa.","Para tunawisma mendapatkan tempat tinggal layak dari dinas sosial.","Suaranya terdengar sangat manis ketika menyanyikan lagu daerah itu.","Ia terpaksa membanting tulang demi mencukupi kebutuhan keluarganya."]],["q","7",[["t","Pasangan kata berikut yang merupakan contoh homograf adalah ..."]],["Bank dan bang","Massa dan masa","Bisa (racun) dan bisa (mampu)","Apel (buah) dan apel (upacara)","Kepala sekolah dan kepala surat"]],["q","8",[["t","Cermati paragraf berikut: '(1) Literasi digital menjadi keterampilan wajib bagi generasi muda di era informasi. (2) Kemampuan ini mencakup kecakapan menyaring informasi hoaks, memahami etika bermedia sosial, serta melindungi data pribadi. (3) Selain itu, literasi digital membantu pelajar memanfaatkan teknologi untuk kegiatan produktif. (4) Banyak remaja menghabiskan waktu berjam-jam bermain gim daring tanpa pengawasan orang tua. (5) Dengan penguasaan literasi digital yang baik, generasi muda dapat menjadi pengguna teknologi yang cerdas dan bertanggung jawab.' Kalimat sumbang dalam paragraf tersebut ditunjukkan oleh nomor ..."]],["(1)","(2)","(3)","(4)","(5)"]],["q","9",[["t","Manakah penulisan unsur serapan baku yang tepat dalam kalimat berikut?"]],["Jadual ujian praktik akan diumumkan secara resmi pada bulan Pebruari.","Penelitian ini menggunakan metode kualitatif untuk menganalisa data.","Setiap atlet wajib menjaga stamina dan aktifitas fisik menjelang pertandingan.","Apotek tersebut menyediakan berbagai obat sesuai resep dan diagnosis dokter.","Kuitansi pembayaran harus diserahkan sebagai syarat pengambilan ijasah."]],["q","10",[["t","Kalimat yang mengandung kesalahan keparalelan bentuk adalah ..."]],["Tugas panitia meliputi perencanaan acara, pelaksanaan kegiatan, dan evaluasi hasil.","Siswa diminta membaca teks bacaan, mencatat ide pokok, dan menyusun simpulan.","Langkah-langkah penelitian ini adalah merumuskan masalah, mengumpulkan data, dan menganalisis temuan.","Tujuan pelatihan ini adalah meningkatkan kompetensi guru, memperluas wawasan literasi, dan pengembangan media ajar.","Mereka bekerja keras, berpikir kritis, dan bertindak cepat dalam menyelesaikan proyek."]],["key","Kunci Jawaban & Pembahasan Singkat Latihan (1)",["1. C (Gubernur Jawa Barat & Sungai Citarum kapital karena diikuti nama diri; A: lapangan rektorat kecil; B: jeruk bali & pisang ambon kecil karena nama jenis; D: bapak & ibu kecil karena bukan sapaan; E: Dari kapital di awal judul).","2. D ('di aula' terpisah karena kata depan tempat; 'pada hari Sabtu' tepat).","3. B (Konjungsi 'untuk' sudah menandai anak kalimat tujuan, sehingga tidak boleh diikuti 'maka' pada induk kalimat).","4. C (Ayah [S] membelikan [P] adik [O] sepeda gunung [Pel] pada akhir pekan lalu [K]).","5. D (Tanda koma dipakai sebelum konjungsi pertentangan intrakalimat 'tetapi').","6. C ('Tunawisma' dirasakan lebih halus daripada 'gelandangan' = ameliorasi).","7. D ('Apel' buah dan 'apel' upacara sama ejaannya tetapi beda pelafalan dan maknanya = homograf).","8. D (Kalimat 4 membicarakan kecanduan gim daring, menyimpang dari gagasan utama manfaat literasi digital).","9. D ('Apotek' dan 'diagnosis' adalah bentuk baku; A: jadwal, Februari; B: menganalisis; C: aktivitas; E: ijazah).","10. D ('pengembangan' berbentuk nomina pe-an, tidak sejajar dengan verba me-kan pada 'meningkatkan' dan 'memperluas')."]]]},{"id":"c11","label":"Bagian 11","judul":"Latihan (2): Kemahiran Bahasa, Majas, Peribahasa, dan Kesusastraan","b":[["p","Petunjuk: Kerjakan soal-soal berikut dengan mencermati kutipan teks nonfiksi maupun teks sastra yang disajikan."],["q","1",[["t","Bacalah kutipan tajuk rencana berikut:"],["bq","'Kelangkaan pupuk bersubsidi menjelang musim tanam kembali dikeluhkan petani di berbagai daerah. Distribusi yang tersendat serta pendataan penerima yang belum akurat menjadi pemicu utama persoalan berulang ini. Pemerintah perlu segera membenahi sistem pengawasan rantai pasok dari tingkat distributor hingga pengecer agar petani tidak terus dirugikan.'"],["t","Opini redaksi dalam kutipan tajuk rencana tersebut adalah ..."]],["Kelangkaan pupuk bersubsidi dikeluhkan petani di berbagai daerah.","Musim tanam segera tiba di sejumlah wilayah sentra pertanian.","Pemerintah perlu segera membenahi sistem pengawasan rantai pasok pupuk bersubsidi.","Pupuk bersubsidi disalurkan melalui distributor dan pengecer resmi.","Petani mengalami kerugian akibat cuaca ekstrem pada musim tanam."]],["q","2",[["t","Penulisan daftar pustaka yang tepat untuk buku berjudul 'Pengantar Semantik Bahasa Indonesia' karya Abdul Chaer yang diterbitkan oleh Rineka Cipta di Jakarta pada tahun 2013 adalah ..."]],["Abdul Chaer. 2013. Pengantar Semantik Bahasa Indonesia. Jakarta: Rineka Cipta.","Chaer, Abdul. 2013. Pengantar Semantik Bahasa Indonesia. Jakarta: Rineka Cipta.","Chaer, Abdul, 2013, Pengantar Semantik Bahasa Indonesia, Rineka Cipta: Jakarta.","Chaer, Abdul. (2013). Pengantar Semantik Bahasa Indonesia. Rineka Cipta, Jakarta.","Chaer, A. 2013. \"Pengantar Semantik Bahasa Indonesia.\" Jakarta: Rineka Cipta."]],["q","3",[["t","Cermati kalimat berikut: 'Suara sirene ambulans itu meraung-raung membelah kesunyian malam.' Majas yang terkandung dalam kalimat tersebut adalah ..."]],["Metafora","Litotes","Personifikasi","Metonimia","Paradoks"]],["q","4",[["t","Pak Budi selalu membantu warga desa yang kesulitan tanpa pamrih. Namun, ternyata di balik kebaikannya itu ia diam-diam mengincar tanah warisan warga dengan harga murah. Peribahasa yang paling tepat untuk menggambarkan perilaku Pak Budi adalah ..."]],["Air beriak tanda tak dalam.","Bagaikan air di daun talas.","Ada udang di balik batu.","Besar pasak daripada tiang.","Tak ada gading yang tak retak."]],["q","5",[["t","Bacalah kutipan cerpen berikut:"],["bq","'Raka menatap jendela kamar yang basah oleh gerimis. Tumpukan buku di sudut meja seolah mengejeknya yang tak kunjung selesai menulis skripsi. Namun, ia menarik napas panjang, meraih penanya kembali, dan mulai mengetik baris demi baris dengan tekad bulat bahwa bulan depan naskah itu harus rampung.'"],["t","Watak tokoh Raka dalam kutipan tersebut digambarkan melalui teknik ..."]],["Analitik langsung oleh pengarang","Dialog antartokoh dalam cerita","Tanggapan tokoh lain terhadap Raka","Dramatik melalui tindakan dan pikiran tokoh","Pelukisan latar tempat tinggal tokoh"]],["q","6",[["t","Bacalah kutipan puisi berikut:"],["bq","'Sawah menguning emas membentang luas"],["t","Angin pagi menyapa lembut pipi petani"],["t","Suara kokok ayam bersahutan riang"],["t","Menyambut mentari di ufuk timur'"],["t","Citraan yang dominan pada larik pertama dan ketiga puisi tersebut secara berurutan adalah ..."]],["Penglihatan dan penciuman","Penglihatan dan pendengaran","Perabaan dan gerak","Pendengaran dan pengecapan","Gerak dan penglihatan"]],["q","7",[["t","Sudut pandang yang digunakan apabila pengarang berada di luar cerita dan mengetahui segala perasaan serta pikiran semua tokohnya disebut ..."]],["Orang pertama pelaku utama","Orang pertama pelaku sampingan","Orang ketiga serbatahu","Orang ketiga pengamat","Campuran orang pertama dan kedua"]],["q","8",[["t","Penulisan alamat surat lamaran pekerjaan yang paling tepat adalah ..."]],["Kepada Yth. HRD PT. Maju Bersama\nJln. Sudirman No. 45\nJakarta Selatan.","Yth. Manajer Personalia PT Maju Bersama\nJalan Sudirman No. 45\nJakarta Selatan","Yth. Bapak/Ibu HRD PT Maju Bersama\nJl. Sudirman No. 45,\nJakarta Selatan.","Kepada Yth: Manajer Personalia PT Maju Bersama\nJalan Sudirman Nomor 45\nDi Jakarta Selatan","Yth. Manajer Personalia PT. Maju Bersama,"]],["p","Jalan Sudirman No. 45,"],["p","Jakarta Selatan"],["q","9",[["t","Karya sastra angkatan Balai Pustaka umumnya mengangkat tema ..."]],["Perjuangan fisik melawan penjajah dan kemanusiaan universal","Kritik sosial terhadap tirani kekuasaan Orde Baru","Pertentangan kaum muda melawan adat istiadat lama dan kawin paksa","Eksperimentasi puisi mantra yang membebaskan kata dari makna","Kehidupan masyarakat urban metropolitan pascareformasi"]],["q","10",[["t","Petunjuk teknis mengenai ekspresi, gerak-gerik, dan tata laku tokoh dalam naskah drama disebut ..."]],["Prolog","Epilog","Monolog","Dialog","Kramagung"]],["key","Kunci Jawaban Latihan (2)",["1. C (Ditandai kata modalitas saran 'perlu segera membenahi')","2. B (Nama dibalik, tahun, judul miring, kota: penerbit)","3. C (Personifikasi: sirene meraung)","4. C (Ada udang di balik batu = maksud tersembunyi)","5. D (Tindakan meraih pena dan tekad dalam pikiran)","6. B (Sawah menguning = visual/penglihatan; suara kokok ayam = auditif/pendengaran)","7. C (Orang ketiga serbatahu)","8. B (Tanpa 'Kepada', PT tanpa titik, 'Jalan' tidak disingkat, tanpa titik di akhir baris)","9. C (Ciri khas Balai Pustaka)","10. E (Kramagung / sampingan)."]]]},{"id":"c12","label":"Bagian 12","judul":"Persiapan US (1): Simulasi Kebahasaan & Wacana Nonfiksi","b":[["p","Paket Persiapan Ujian Sekolah (US) Bagian 1 dirancang untuk melatih ketelitian analisis teks eksposisi, penentuan ide pokok, simpulan logis, fakta-opini, serta ketepatan ejaan dan kalimat efektif sesuai kisi-kisi Ujian Sekolah."],["q","1",[["t","Bacalah paragraf berikut dengan saksama!"],["bq","'Pengelolaan sampah plastik di kawasan perkotaan memerlukan pendekatan terpadu dari hulu hingga hilir. Di tingkat hulu, produsen didorong merancang kemasan ramah lingkungan yang mudah didaur ulang. Sementara itu, di tingkat hilir, pemerintah daerah memperkuat fasilitas bank sampah dan teknologi pengolahan limbah menjadi energi. Tanpa sinergi kedua sisi tersebut, timbulan sampah plastik akan terus membebani tempat pembuangan akhir.'"],["t","Ide pokok paragraf tersebut adalah ..."]],["Peran produsen dalam merancang kemasan plastik ramah lingkungan","Penguatan fasilitas bank sampah oleh pemerintah daerah","Perlunya pendekatan terpadu dalam pengelolaan sampah plastik perkotaan","Beban tempat pembuangan akhir akibat timbulan sampah plastik","Teknologi pengolahan limbah plastik menjadi sumber energi baru"]],["q","2",[["t","Kalimat yang mengandung fakta dalam paragraf di bawah ini adalah ..."],["bq","'(1) Sektor ekonomi kreatif Indonesia menunjukkan pertumbuhan yang sangat menjanjikan dalam beberapa tahun terakhir. (2) Berdasarkan data Kementerian Pariwisata dan Ekonomi Kreatif, subsektor kuliner, kriya, dan fesyen menyumbang lebih dari 70 persen terhadap produk domestik bruto ekonomi kreatif nasional. (3) Pemerintah sebaiknya memperluas akses permodalan bagi pelaku usaha pemula di daerah. (4) Langkah tersebut diyakini mampu menciptakan jutaan lapangan kerja baru. (5) Dengan demikian, daya saing produk lokal diharapkan semakin meningkat di pasar global.'"]],["(1)","(2)","(3)","(4)","(5)"]],["q","3",[["t","Cermati kalimat berikut: 'Para hadirin sekalian dimohon berdiri sejenak untuk menyanyikan lagu kebangsaan Indonesia Raya.' Perbaikan kalimat tersebut agar efektif adalah ..."]],["Hadirin dimohon berdiri sejenak untuk menyanyikan lagu kebangsaan Indonesia Raya.","Para hadirin dimohon berdiri sejenak untuk menyanyikan lagu kebangsaan Indonesia Raya.","Hadirin sekalian dimohon berdiri sejenak untuk menyanyikan lagu kebangsaan Indonesia Raya.","Kepada para hadirin dimohon berdiri sejenak untuk menyanyikan lagu kebangsaan Indonesia Raya.","Para hadirin sekalian dimohon untuk berdiri sejenak menyanyikan lagu kebangsaan Indonesia Raya."]],["q","4",[["t","Penulisan gabungan kata yang tepat terdapat pada kalimat ..."]],["Setiap warga negara harus ikut bertanggungjawab menjaga ketertiban umum.","Panitia telah menanda tangani surat perjanjian kerja sama dengan pihak sponsor.","Pemerintah menyalurkan bea siswa kepada mahasiswa berprestasi dari keluarga prasejahtera.","Seluruh anggota tim wajib mempertanggungjawabkan penggunaan dana kegiatan secara transparan.","Acara olahraga antar fakultas berlangsung sangat meriah di stadion utama."]],["q","5",[["t","Bacalah kutipan biografi berikut:"],["bq","'B.J. Habibie dikenal sebagai ilmuwan dirgantara kelas dunia yang menciptakan teori crack propagation untuk menghitung keretakan pada badan pesawat terbang. Meskipun memiliki karier cemerlang dan fasilitas lengkap di Jerman, beliau memilih kembali ke tanah air atas panggilan negara untuk membangun industri strategis nasional. Ketekunan belajar dan kecintaannya pada Indonesia menjadi inspirasi bagi generasi muda.'"],["t","Keteladanan tokoh B.J. Habibie berdasarkan kutipan tersebut adalah ..."]],["Menciptakan teori crack propagation untuk pesawat terbang","Memiliki fasilitas penelitian yang lengkap selama tinggal di Jerman","Rela meninggalkan kenyamanan karier di luar negeri demi mengabdi kepada bangsa","Membangun berbagai industri strategis nasional di bidang dirgantara","Mendapatkan gelar ilmuwan dirgantara kelas dunia dari pemerintah Jerman"]],["q","6",[["t","Makna istilah 'mitigasi' dalam kalimat 'Pemerintah daerah meningkatkan edukasi mitigasi bencana kepada masyarakat di kawasan rawan gempa' adalah ..."]],["Proses pemulihan kondisi ekonomi setelah terjadinya bencana alam","Tindakan mengurangi dampak dan risiko kerugian akibat bencana","Penyaluran bantuan logistik darurat bagi para pengungsi","Pemetaan wilayah permukiman padat penduduk di perkotaan","Pembangunan kembali infrastruktur publik yang rusak berat"]],["q","7",[["t","Kalimat berikut yang menggunakan kata berimbuhan secara tidak tepat adalah ..."]],["Tim peneliti sedang mengoordinasi jadwal wawancara dengan para narasumber.","Kebijakan baru tersebut sangat memengaruhi stabilitas harga bahan pokok.","Seluruh warga bahu-membahu menyukseskan program penghijauan lingkungan.","Pihak sekolah mensosialisasikan tata tertib baru kepada seluruh orang tua murid.","Ia berupaya mengubah pola belajarnya agar meraih hasil yang lebih optimal."]],["q","8",[["t","Cermati kalimat majemuk berikut: 'Meskipun kondisi cuaca kurang bersahabat, para relawan tetap mendistribusikan logistik ke desa terpencil.' Induk kalimat pada kalimat majemuk bertingkat tersebut adalah ..."]],["Meskipun kondisi cuaca kurang bersahabat","Kondisi cuaca kurang bersahabat","Para relawan tetap mendistribusikan logistik ke desa terpencil","Tetap mendistribusikan logistik ke desa terpencil","Ke desa terpencil"]],["q","9",[["t","Penggunaan tanda titik dua (:) yang tepat terdapat pada kalimat ..."]],["Peserta lomba wajib membawa: kartu pelajar, alat tulis, dan papan ujian.","Ketua panitia mengumumkan: bahwa lomba debat akan ditunda minggu depan.","Perlengkapan berkemah yang harus disiapkan meliputi: tenda, senter, dan kompas.","Ibu membeli kebutuhan pokok: beras, gula, minyak goreng, dan tepung terigu.","Mereka berkunjung ke beberapa kota besar seperti: Jakarta, Bandung, dan Surabaya."]],["q","10",[["t","Konjungsi antarkalimat yang tepat untuk melengkapi bagian rumpang berikut: 'Tingkat literasi membaca siswa perlu ditingkatkan melalui pembiasaan sejak dini. ..., sekolah perlu menyediakan koleksi buku bacaan yang beragam dan menarik minat anak.' adalah ..."]],["Namun demikian","Oleh karena itu","Akan tetapi","Meskipun demikian","Sebaliknya"]]]},{"id":"c13","label":"Bagian 13","judul":"Persiapan US (2): Fokus Pemahaman Bacaan & Penyuntingan Teks","b":[["p","Paket Persiapan Ujian Sekolah (US) Bagian 2 berfokus pada keterampilan menyimpulkan wacana, menelaah hubungan antarparagraf, memperbaiki kesalahan tanda baca, serta memilih diksi baku dalam konteks paragraf rumpang."],["q","1",[["t","Bacalah teks berikut:"],["bq","'Transportasi publik yang terintegrasi merupakan kunci utama mengurangi kemacetan di kota-kota besar. Ketika jadwal bus, kereta komuter, dan moda raya terpadu saling terhubung dengan tarif yang terjangkau, masyarakat akan beralih dari kendaraan pribadi ke angkutan umum. Selain menekan kepadatan lalu lintas, peralihan ini juga berdampak langsung pada penurunan emisi karbon perkotaan.'"],["t","Simpulan yang paling tepat untuk paragraf tersebut adalah ..."]],["Tarif transportasi publik di kota besar harus digratiskan bagi seluruh pelajar.","Kendaraan pribadi merupakan satu-satunya penyebab polusi udara di perkotaan.","Integrasi transportasi publik yang terjangkau efektif mengatasi kemacetan sekaligus menekan emisi karbon.","Kereta komuter dan moda raya terpadu lebih diminati daripada bus kota.","Masyarakat perkotaan enggan menggunakan angkutan umum karena jadwalnya tidak pasti."]],["q","2",[["t","Cermati kalimat tidak efektif berikut:"],["bq","'Dalam rapat koordinasi kemarin membahas tentang rencana pelaksanaan bakti sosial di daerah bencana.'"],["t","Alasan ketidakefektifan kalimat tersebut adalah ..."]],["Penggunaan kata 'kemarin' yang tidak menunjukkan waktu secara spesifik","Ketidakjelasan unsur subjek karena didahului preposisi 'dalam' serta pemborosan kata 'tentang'","Penggunaan imbuhan me-kan pada kata 'membahas' yang seharusnya berimbuhan di-","Tidak adanya objek yang melengkapi predikat dalam struktur kalimat","Penggunaan frasa 'di daerah bencana' yang seharusnya diletakkan di awal kalimat"]],["q","3",[["t","Penulisan judul karangan ilmiah yang sesuai dengan kaidah EYD adalah ..."]],["Peran Pemuda Dalam Meningkatkan Literasi Digital Di Pedesaan","Peran Pemuda dalam Meningkatkan Literasi Digital di Pedesaan","Peran Pemuda Dalam Meningkatkan Literasi Digital di Pedesaan","PERAN PEMUDA DALAM MENINGKATKAN LITERASI DIGITAL DI PEDESAAN.","Peran pemuda dalam meningkatkan literasi digital di pedesaan"]],["q","4",[["t","Cermati paragraf rumpang berikut:"],["bq","'Ketahanan pangan nasional tidak hanya bergantung pada produksi beras, tetapi juga pada ... konsumsi pangan lokal. Masyarakat perlu didorong untuk kembali mengonsumsi sumber karbohidrat alternatif seperti singkong, jagung, sagu, dan umbi-umbian. Langkah ini sangat ... untuk mengurangi ketergantungan impor gandum dan menjaga stabilitas pasokan pangan daerah.'"],["t","Istilah baku yang tepat untuk melengkapi bagian rumpang tersebut adalah ..."]],["diversifikasi - strategis","diverifikasi - stratergis","eksplorasi - sistematis","klasifikasi - pragmatis","modifikasi - ekonomis"]],["q","5",[["t","Kalimat berikut yang menggunakan tanda koma (,) secara tidak tepat adalah ..."]],["Karena jalanan licin akibat hujan deras, pengendara diminta mengurangi kecepatan.","Buku ini tidak hanya memuat teori kebahasaan, tetapi juga menyajikan latihan soal.","Wah, pemandangan matahari terbit di puncak gunung ini sungguh memukau!","Dia tidak jadi berangkat ke Bandung, karena tiket kereta api sudah habis terjual.","Prof. Dr. Indah Fadhilla, M.Hum. menjadi pembicara utama dalam seminar nasional tersebut."]],["q","6",[["t","Bacalah kutipan teks eksplanasi berikut:"],["bq","'Fenomena embun upas di dataran tinggi Dieng terjadi akibat penurunan suhu udara secara ekstrem pada puncak musim kemarau. Langit yang cerah tanpa tutupan awan menyebabkan panas bumi terlepas bebas ke atmosfer pada malam hari. Akibatnya, suhu permukaan tanah turun hingga di bawah titik beku sehingga uap air mengkristal menyerupai salju tipis.'"],["t","Hubungan antarbagian yang dominan dalam kutipan teks eksplanasi tersebut adalah ..."]],["Perbandingan dan pertentangan","Kronologis urutan langkah","Kausalitas (sebab-akibat)","Klasifikasi dan definisi","Generalisasi dan contoh"]],["q","7",[["t","Kata yang mengalami perubahan makna sinestesia terdapat pada kalimat ..."]],["Setiap kepala keluarga wajib mengikuti kerja bakti pada hari Minggu.","Tatapan matanya yang dingin membuat suasana diskusi menjadi canggung.","Ia menjadi tangan kanan pimpinan perusahaan karena kejujurannya.","Banyak sarjana muda yang merintis usaha rintisan di bidang teknologi.","Para perantau pulang ke kampung halaman menjelang hari raya."]],["q","8",[["t","Perhatikan urutan kalimat acak berikut:"],["t","(1) Setelah data terkumpul, peneliti melakukan verifikasi dan klasifikasi berdasarkan kategori."],["t","(2) Langkah pertama dalam penelitian lapangan adalah menentukan rumusan masalah dan tujuan."],["t","(3) Tahap akhir adalah menyusun laporan hasil penelitian secara sistematis."],["t","(4) Selanjutnya, peneliti turun ke lapangan untuk mengumpulkan data melalui wawancara dan observasi."],["t","(5) Data yang telah diklasifikasikan kemudian dianalisis menggunakan teori yang relevan."],["t","Urutan kalimat tersebut agar menjadi paragraf proses yang padu adalah ..."]],["(2) - (4) - (1) - (5) - (3)","(2) - (1) - (4) - (5) - (3)","(4) - (2) - (1) - (5) - (3)","(2) - (4) - (5) - (1) - (3)","(1) - (2) - (4) - (5) - (3)"]],["q","9",[["t","Penulisan angka dan bilangan yang sesuai dengan pedoman ejaan terdapat pada kalimat ..."]],["25 siswa kelas XII mengikuti pembinaan olimpiade sains tingkat provinsi.","Ayah membeli 3 ekor ayam dan 2 kilogram beras di pasar pagi.","Dalam rapat tersebut, 45 anggota menyetujui usulan, 12 anggota menolak, dan 3 anggota abstain.","Peristiwa bersejarah itu terjadi pada abad ke 20 yang lalu.","Ia sudah membaca novel tebal itu sebanyak 2 kali dalam sebulan."]],["q","10",[["t","Kalimat yang mengandung makna konotatif adalah ..."]],["Petani memanen padi di sawah dengan wajah penuh syukur.","Adik menanam bunga mawar di halaman depan rumah.","Sebagai anak emas di perusahaan itu, ia selalu mendapat proyek strategis.","Ayah memperbaiki kursi kayu yang patah di teras belakang.","Burung merpati hinggap di dahan pohon mangga yang rindang."]]]},{"id":"c14","label":"Bagian 14","judul":"Persiapan US (3): Fokus Apresiasi Sastra & Menulis Terbatas","b":[["p","Paket Persiapan Ujian Sekolah (US) Bagian 3 menguji kemampuan menafsirkan amanat, nilai budaya/moral, konflik batin tokoh, persamaan tema dua kutipan karya sastra, serta melengkapi bagian rumpang pada pantun, puisi, dan naskah drama."],["q","1",[["t","Bacalah kutipan novel berikut:"],["bq","'Di kampung pesisir itu, laut bukan sekadar hamparan air asin, melainkan nadi kehidupan yang menentukan nasib setiap keluarga. Namun, sejak kapal-kapal pukat harimau merapat ke perairan dangkal, jaring para nelayan tradisional sering pulang dalam keadaan hampa. Pak Tua Karim berdiri di ujung dermaga kayu, mengepalkan tangannya sambil berjanji akan mengumpulkan seluruh nelayan untuk memperjuangkan hak wilayah tangkap mereka.'"],["t","Konflik yang tergambar dalam kutipan novel tersebut adalah ..."]],["Konflik batin Pak Tua Karim karena takut melaut sendirian","Konflik sosial antara nelayan tradisional dan kapal pukat harimau yang merusak mata pencaharian","Konflik keluarga akibat hasil tangkapan ikan yang tidak mencukupi kebutuhan","Konflik budaya antara generasi tua dan generasi muda di kampung pesisir","Konflik fisik antara Pak Tua Karim dan pemilik dermaga kayu"]],["q","2",[["t","Nilai sosial yang terkandung dalam kutipan novel pada soal nomor 1 adalah ..."]],["Keteguhan beribadah meskipun sedang dilanda kesulitan ekonomi","Solidaritas dan tanggung jawab bersama untuk memperjuangkan hak masyarakat nelayan","Kepatuhan mutlak terhadap adat istiadat leluhur di daerah pesisir","Keindahan panorama alam laut pada waktu senja hari","Kemampuan teknis membuat jaring penangkap ikan tradisional"]],["q","3",[["t","Bacalah kutipan puisi berikut:"],["bq","'Di antara riuh langkah kota yang tergesa"],["t","Aku menepi pada selembar kertas putih"],["t","Merangkai aksara yang nyaris terlupa"],["t","Agar nurani tetap terjaga bening'"],["t","Suasana yang tergambar dalam kutipan puisi tersebut adalah ..."]],["Kacau dan mencekam","Riang dan bersemangat","Hening dan reflektif","Marah dan memberontak","Putus asa dan tertekan"]],["q","4",[["t","Cermati pantun rumpang berikut:"],["bq","'Pergi ke pasar membeli talas,"],["t","Pulangnya singgah membeli jamu."],["t","..."],["t","...'"],["t","Isi yang paling tepat untuk melengkapi pantun nasihat tersebut adalah ..."]],["Janganlah kamu bersikap malas,\nAgar tercapai semua cita-citamu.","Rajin-rajinlah membantu orang tua,\nSupaya hidupmu selalu bahagia.","Jika ingin menjadi anak cerdas,\nJangan lupa membaca buku setiap hari.","Mari kita menjaga kebersihan kelas,\nSupaya belajar terasa nyaman selalu.","Belajarlah dengan tekun dan ikhlas,"]],["p","Niscaya ilmu bermanfaat bagimu."],["q","5",[["t","Bacalah kutipan naskah drama berikut:"],["t","Dina : (Melipat tangannya di dada, menatap tajam ke arah Reno) \"Jadi, kau belum juga menyerahkan laporan kegiatan itu kepada panitia?\""],["t","Reno : (Menunduk pelan, suaranya lirih) \"Maafkan aku, Din. Semalam listrik di rumahku padam hingga dini hari.\""],["t","Dina : \"Alasan saja! Seharusnya kau menyicilnya sejak tiga hari lalu, bukan menunggu batas akhir!\""],["t","Watak tokoh Dina dalam kutipan drama tersebut adalah ..."]],["Sabar dan pemaaf","Tegas namun mudah marah","Pemalu dan penakut","Acuh tak acuh terhadap tugas","Bijaksana dan penuh pengertian"]],["q","6",[["t","Bacalah kutipan hikayat berikut:"],["bq","'Maka setelah didengar oleh baginda raja akan sembah perdana menteri itu, terlalu sukacita hati baginda seraya menitahkan sekalian hulubalang berhimpun di balairung istana untuk menyambut kedatangan utusan negeri seberang.'"],["t","Karakteristik sastra Melayu klasik yang tampak pada kutipan hikayat tersebut adalah ..."]],["Menggunakan sudut pandang orang pertama pelaku utama","Menggambarkan kehidupan masyarakat urban modern","Istana sentris dan menggunakan kosakata arkais (maka, baginda, titah, hulubalang)","Menonjolkan kritik sosial terhadap kebijakan pemerintah kolonial","Terikat oleh aturan jumlah suku kata dan rima akhir a-b-a-b"]],["q","7",[["t","Cermati kalimat bermajas berikut: 'Prestasi gemilang tim bulu tangkis Indonesia di kejuaraan dunia mengharumkan nama bangsa di mata internasional.' Majas yang digunakan pada kata 'Indonesia' dalam kalimat tersebut adalah ..."]],["Sinekdoke pars pro toto","Sinekdoke totem pro parte","Metonimia","Eufemisme","Simile"]],["q","8",[["t","Bacalah dua kutipan cerpen berikut:"],["t","Teks 1: 'Sari menyisihkan sebagian uang jajannya setiap hari demi membeli buku pelajaran untuk adiknya di kampung.'"],["t","Teks 2: 'Meski upahnya sebagai buruh cuci tidak seberapa, Bu Tini tetap berjuang menyekolahkan kedua anaknya hingga perguruan tinggi.'"],["t","Persamaan tema kedua kutipan teks sastra tersebut adalah ..."]],["Kemiskinan masyarakat di wilayah pedesaan","Pengorbanan dan kasih sayang demi pendidikan keluarga","Perjuangan meraih kesuksesan karier di kota besar","Konflik antara orang tua dan anak dalam memilih sekolah","Pentingnya menabung untuk masa depan diri sendiri"]],["q","9",[["t","Amanat yang dapat dipetik dari Teks 2 pada soal nomor 8 adalah ..."]],["Bekerjalah sebagai buruh cuci agar dapat membiayai kuliah anak","Keterbatasan ekonomi bukan penghalang untuk memperjuangkan pendidikan","Anak-anak harus membantu orang tua bekerja sejak masih kecil","Perguruan tinggi hanya dapat diakses oleh keluarga yang mampu","Jangan pernah mengeluh meskipun mendapat upah yang sangat kecil"]],["q","10",[["t","Kalimat resensi yang mengungkapkan keunggulan buku fiksi adalah ..."]],["Sayangnya, alur cerita pada bagian tengah novel ini terasa lambat dan bertele-tele.","Banyak kesalahan cetak yang cukup mengganggu kenyamanan pembaca pada beberapa bab.","Pengarang berhasil menghidupkan latar budaya lokal melalui deskripsi yang detail dan bahasa yang mengalir indah.","Sampul buku didesain dengan warna yang terlalu gelap sehingga kurang menarik perhatian.","Konflik antartokoh diselesaikan secara tergesa-gesa pada halaman terakhir."]]]},{"id":"c15","label":"Bagian 15","judul":"Persiapan US (4): Prediksi Komprehensif & Kunci Pembahasan Lengkap","b":[["p","Paket Persiapan Ujian Sekolah (US) Bagian 4 merupakan evaluasi terpadu yang menggabungkan seluruh kompetensi mulai dari Bab I hingga Bab IX, diikuti dengan tabel kunci jawaban dan pembahasan lengkap untuk seluruh paket Persiapan US (1)-(4)."],["q","1",[["t","Penulisan kata yang seluruhnya baku terdapat pada kelompok kata ..."]],["apotek, atlet, hierarki, kuitansi, nasihat","apotik, atlit, hirarki, kwitansi, nasehat","apotek, atlit, hierarki, kuitansi, nasihat","apotek, atlet, hirarki, kuitansi, nasehat","apotik, atlet, hierarki, kwitansi, nasihat"]],["q","2",[["t","Cermati kalimat berikut: 'Berdasarkan hasil penelitian menunjukkan bahwa minat baca siswa meningkat sebesar 25 persen setelah program pojok baca diterapkan.' Perbaikan yang tepat untuk kalimat tersebut adalah ..."]],["Menghilangkan kata 'bahwa'","Menghilangkan kata 'berdasarkan' atau kata 'menunjukkan'","Mengganti kata 'sebesar' menjadi 'sebanyak'","Mengubah '25 persen' menjadi 'dua puluh lima prosen'","Menambahkan tanda koma setelah kata 'menunjukkan'"]],["q","3",[["t","Penulisan gelar akademis dan nama orang yang tepat sesuai kaidah EYD adalah ..."]],["Dr. Dhama Maulana, S.Pd, M.Hum","Dr. Dhama Maulana, S.Pd., M.Hum.","DR. Dhama Maulana, S.Pd., M.Hum.","Dr. Dhama Maulana S.Pd., M.Hum.","Dr. Dhama Maulana, SPd., MHum."]],["q","4",[["t","Bacalah paragraf berikut:"],["bq","'Pendidikan karakter di sekolah tidak cukup hanya diajarkan melalui hafalan teori di dalam kelas. Nilai-nilai kejujuran, disiplin, dan empati harus dibiasakan melalui keteladanan guru serta budaya sekolah sehari-hari. Tanpa keteladanan nyata, pembelajaran karakter hanya akan menjadi slogan kosong.'"],["t","Jenis paragraf tersebut berdasarkan letak kalimat utamanya adalah ..."]],["Induktif","Ineratif","Deduktif","Deskriptif","Naratif"]],["q","5",[["t","Hubungan makna antara kata 'kendaraan' dan 'kereta api, bus, sepeda motor' adalah ..."]],["Sinonim","Homonim","Polisemi","Hipernim dan hiponim","Antonim relasional"]],["q","6",[["t","Bacalah kutipan editorial berikut:"],["bq","'Kenaikan harga bahan pangan pokok menjelang hari raya menjadi persoalan klasik yang selalu berulang setiap tahun. Operasi pasar murah yang digelar pemerintah daerah memang membantu meredam gejolak harga dalam jangka pendek. Namun, pembenahan tata niaga distribusi dan pengawasan terhadap praktik penimbunan jauh lebih mendesak untuk dilakukan.'"],["t","Pihak yang dituju oleh redaksi dalam kutipan editorial tersebut adalah ..."]],["Pedagang pasar tradisional","Konsumen rumah tangga","Pemerintah dan aparat pengawas distribusi pangan","Petani penghasil bahan pangan","Perusahaan jasa ekspedisi barang"]],["q","7",[["t","Kalimat pembuka surat lamaran pekerjaan yang tepat berdasarkan pengumuman resmi perusahaan adalah ..."]],["Dengan hormat, bersama surat ini saya melamar pekerjaan di perusahaan Bapak.","Sehubungan dengan iklan lowongan kerja di koran hari ini, maka saya mengajukan lamaran.","Berdasarkan pengumuman lowongan kerja PT Nusantara Digital pada laman resmi perusahaan tanggal 10 November 2026, saya mengajukan lamaran untuk posisi Staf Konten.","Saya yang bertanda tangan di bawah ini bermaksud melamar kerja sesuai lowongan yang ada.","Melalui surat ini perkenankanlah saya melamar posisi yang Bapak butuhkan saat ini."]],["q","8",[["t","Cermati kalimat berikut: 'Ia lebih baik pulang ke rumah daripada harus menunggu janji yang tak kunjung pasti.' Kata 'daripada' pada kalimat tersebut berfungsi sebagai ..."]],["Kata depan penunjuk asal","Konjungsi perbandingan","Partikel penegas","Kata sandang","Pronomina penunjuk"]],["q","9",[["t","Peribahasa yang bermakna 'seseorang yang tidak mampu melakukan sesuatu, tetapi menyalahkan keadaan atau alat yang digunakan' adalah ..."]],["Buruk muka cermin dibelah","Tong kosong nyaring bunyinya","Air susu dibalas dengan air tuba","Gajah di pelupuk mata tak tampak","Sepandai-pandainya tupai melompat"]],["q","10",[["t","Bacalah kutipan puisi berikut:"],["bq","'Hujan bulan Juni"],["t","Tak ada yang lebih tabah"],["t","Dari hujan bulan Juni"],["t","Dirahasiakannya rintik rindunya"],["t","Kepada pohon berbunga itu'"],["t","Majas yang paling menonjol dalam penggalan puisi karya Sapardi Djoko Damono tersebut adalah ..."]],["Hiperbola","Ironi","Personifikasi","Antitesis","Metonimia"]]]},{"id":"c16","label":"Lampiran","judul":"Kunci Jawaban & Pembahasan Paket Persiapan US (1) - (4)","b":[["p","Gunakan kunci jawaban dan pembahasan di bawah ini untuk mengevaluasi hasil pengerjaan mandiri seluruh paket simulasi Persiapan Ujian Sekolah."],["tb",["No.","Persiapan US (1)","Persiapan US (2)","Persiapan US (3)","Persiapan US (4)"],[["1","C (Gagasan utama di kalimat pertama: pendekatan terpadu pengelolaan sampah)","C (Merangkum dampak integrasi transportasi: atasi macet & tekan emisi)","B (Konflik sosial nelayan tradisional vs pukat harimau)","A (Seluruh kata sesuai KBBI V: apotek, atlet, hierarki, kuitansi, nasihat)"],["2","B (Memuat data kuantitatif resmi >70% PDB dari Kemenparekraf)","B (Preposisi 'dalam' menghilangkan subjek; 'membahas tentang' tidak baku)","B (Solidaritas memperjuangkan hak bersama masyarakat nelayan)","B (Preposisi 'berdasarkan' membuat kalimat kehilangan subjek)"],["3","A ('Hadirin' sudah bermakna jamak, tidak perlu 'para' dan 'sekalian')","B (Kata tugas 'dalam' dan 'di' ditulis dengan huruf kecil)","C (Suasana hening dan reflektif saat menyendiri menulis)","B (Gelar depan Dr. dan gelar belakang S.Pd., M.Hum. dipisah koma & titik)"],["4","D ('mempertanggungjawabkan' mendapat awalan & akhiran sekaligus -> serangkai)","A (Diversifikasi = penganekaragaman; strategis = penting/menentukan)","E (Rima a-b-a-b: talas-ikhlas, jamu-bagimu dan selaras isi nasihat)","C (Kalimat utama di awal paragraf: pendidikan karakter tidak cukup hafalan)"],["5","C (Rela meninggalkan kenyamanan karier di Jerman demi mengabdi di tanah air)","D (Anak kalimat sebab yang berada setelah induk kalimat tidak didahului koma)","B (Dina tegas menagih tugas, namun mudah marah/emosional)","D ('Kendaraan' = hipernim/umum; 'kereta api, bus, motor' = hiponim/khusus)"],["6","B (Mitigasi = upaya mengurangi risiko dan dampak bencana)","C (Ditandai konjungsi sebab-akibat: akibat, menyebabkan, akibatnya, sehingga)","C (Istana sentris dan kosakata Melayu klasik/arkais)","C (Ditujukan kepada pemerintah & aparat pengawas tata niaga distribusi)"],["7","D (Kata dasar 'sosia var ABT=["Pondok Pesantren Sunanulhuda berdiri di atas sebuah cita-cita yang terangkum dalam visinya: berjiwa ulul ilmi, berakhlak salafi. Berjiwa ulul ilmi berarti membentuk santri yang haus akan ilmu, mendalam dalam memahaminya, dan tidak berhenti belajar. Berakhlak salafi berarti menjadikan adab, kesantunan, dan keteladanan para ulama terdahulu sebagai pegangan dalam bersikap. Ilmu yang luas tanpa akhlak akan kehilangan arah, dan akhlak yang baik tanpa ilmu akan kehilangan daya. Karena itu keduanya dirawat bersama, dari ruang kelas, majelis pengajian, hingga kehidupan sehari-hari di pesantren.", "e-Santri hadir sebagai ikhtiar untuk menghidupkan visi tersebut di ruang digital. Melalui satu platform, santri dapat mengakses materi pembelajaran, berdiskusi dengan sesama santri dan para pengajar, mencatat presensi, mengerjakan tugas dan kuis, menuliskan refleksi, hingga menjelajah koleksi E-Library. Setiap fitur disusun agar kebiasaan belajar yang baik tetap berlangsung di luar jam pelajaran: membaca, bertanya, berdiskusi, dan mengevaluasi diri, sehingga semangat ulul ilmi tumbuh sebagai kebiasaan, bukan hanya sebagai slogan.", "Meski berbasis teknologi, e-Santri tidak dimaksudkan menggantikan peran guru maupun majelis ilmu. Hubungan santri dengan para kiai dan ustadz tetap menjadi jantung pendidikan pesantren, dan platform ini hadir sebagai sarana yang mendukungnya. Dengan semangat ruang santri berkembang dan berkarya, e-Santri diharapkan menjadi tempat santri Sunanulhuda menumbuhkan kecintaan pada ilmu, menjaga adab dalam belajar, serta berani menghasilkan karya yang bermanfaat bagi pesantren, masyarakat, dan bangsa."];
