rena ..."]],["Membujuk pembaca agar waspada terhadap bencana alam","Menjelaskan proses sebab-akibat terjadinya suatu fenomena alam","Menggambarkan keindahan bentuk permukaan lempeng bumi","Menyampaikan pendapat pribadi penulis tentang gempa bumi","Mempromosikan alat pendeteksi gelombang seismik"]],["q","9",[["t","Konjungsi kausalitas yang terdapat pada paragraf soal nomor 8 adalah ..."]],["Ketika dan dalam","Secara dan dapat","Akibat dan akibatnya","Yang dan atau","Selama dan bentuk"]],["q","10",[["t","Kalimat pasif yang lazim ditemukan dalam teks eksplanasi adalah ..."]],["Masyarakat membersihkan saluran air menjelang musim penghujan.","Hujan asam terbentuk ketika gas sulfur dioksida bereaksi dengan uap air di atmosfer.","Para relawan menyalurkan bantuan logistik ke posko pengungsian.","Pemerintah membangun tanggul penahan banjir di sepanjang sungai.","Warga menanam pohon bakau di pesisir pantai utara."]],["key","Kunci Jawaban & Pembahasan Ringkas PAS (Bab 8)",["1. B (Memuat pengertian & kopula 'adalah')","2. C (Menggunakan kopula 'merupakan')","3. B (Kalimat pendek mengajak kepedulian lingkungan = slogan)","4. C ('Gunakan...' = kalimat perintah/imperatif)","5. B (Artikel populer memakai bahasa ringan & komunikatif)","6. A (Kalimat 1 & 2 berupa data terukur; 3 prediksi risiko; 4 saran)","7. B (Tesis)","8. B (Menjelaskan mekanisme sebab-akibat fenomena alam)","9. C ('Akibat' dan 'akibatnya')","10. B (Verba pasif 'terbentuk')."]]]},{"id":"c9","label":"Bab 9","judul":"Pengenalan TKA (1): Literasi Membaca Teks Informasi & Penalaran","b":[["p","Tes Kemampuan Akademik (TKA) pada aspek literasi membaca mengukur kemampuan peserta didik dalam memahami, menggunakan, merefleksikan, dan mengevaluasi beragam jenis teks informasi untuk memecahkan masalah secara kritis."],["h","A. Tiga Level Kompetensi Literasi Membaca TKA"],["tb",["Level Kognitif","Fokus Kemampuan yang Diuji","Contoh Bentuk Pertanyaan"],[["1. Menemukan Informasi (Access & Retrieve)","Mencari, mengidentifikasi, dan memilih informasi tersurat (eksplisit) yang tercantum langsung dalam teks atau infografik.","Mengapa fenomena X terjadi menurut paragraf kedua? / Berapa persentase kenaikan pada tahun tertentu?"],["2. Memahami & Menginterpretasi (Integrate & Interpret)","Menyimpulkan ide pokok, membandingkan dua informasi, memaknai istilah dalam konteks, serta menarik inferensi tersirat.","Apa simpulan yang paling tepat dari keseluruhan bacaan? / Apa hubungan antara paragraf 1 dan paragraf 2?"],["3. Mengevaluasi & Merefleksi (Evaluate & Reflect)","Menilai keakuratan bukti, membedakan fakta dan opini, menilai relevansi argumen penulis, serta merefleksikan isi teks dengan kehidupan nyata.","Apakah bukti yang disajikan penulis cukup kuat mendukung klaimnya? / Bagaimana sikap yang tepat berdasarkan bacaan?"]]],["h","B. Latihan Soal Pengenalan TKA (1) - Teks Informasi"],["p","Bacalah teks stimulus berikut untuk menjawab soal nomor 1 sampai 5!"],["bq","\"Transisi menuju energi baru terbarukan (EBT) menjadi agenda prioritas global guna menekan laju perubahan iklim. Indonesia memiliki potensi energi surya yang sangat melimpah karena letak geografisnya di garis khatulistiwa dengan rata-rata penyinaran matahari mencapai 4,8 kWh/m² per hari. Namun, pemanfaatan pembangkit listrik tenaga surya (PLTS) atap di sektor rumah tangga masih menghadapi tantangan biaya investasi awal yang relatif tinggi serta keterbatasan infrastruktur penyimpanan energi (baterai). Oleh karena itu, skema pembiayaan hijau dan insentif tarif sangat diperlukan untuk mempercepat adopsi energi bersih di tingkat masyarakat.\""],["q","1",[["t","[Level Menemukan Informasi] Berdasarkan teks tersebut, faktor geografis yang mendukung besarnya potensi energi surya di Indonesia adalah ..."]],["Rendahnya biaya investasi panel surya di tingkat rumah tangga","Letak Indonesia yang berada tepat di garis khatulistiwa","Ketersediaan infrastruktur baterai penyimpanan energi yang memadai","Tingginya subsidi tarif listrik dari sektor industri","Banyaknya pembangkit listrik tenaga air di wilayah pegunungan"]],["q","2",[["t","[Level Interpretasi] Hubungan logis antara kalimat ketiga dan kalimat keempat dalam teks tersebut adalah ..."]],["Kalimat keempat merupakan contoh rincian dari kalimat ketiga","Kalimat keempat menyajikan solusi atas kendala yang dipaparkan pada kalimat ketiga","Kalimat keempat mempertentangkan data statistik pada kalimat ketiga","Kalimat keempat mengulangi definisi yang disebutkan pada kalimat pertama","Kalimat keempat menyanggah kebenaran informasi pada kalimat ketiga"]],["q","3",[["t","[Level Interpretasi] Makna istilah 'adopsi' dalam kalimat terakhir bacaan tersebut adalah ..."]],["Pengangkatan anak secara sah menurut hukum","Penerimaan dan penerapan suatu teknologi atau sistem baru oleh masyarakat","Penghapusan seluruh pembangkit listrik konvensional","Penjualan perangkat elektronik ramah lingkungan ke luar negeri","Pengurangan kuota ekspor bahan bakar fosil nasional"]],["q","4",[["t","[Level Evaluasi] Pernyataan manakah yang paling sesuai sebagai tindak lanjut logis apabila pemerintah menerapkan skema pembiayaan hijau bagi PLTS atap?"]],["Masyarakat akan sepenuhnya berhenti menggunakan listrik jaringan negara dalam waktu satu minggu.","Hambatan biaya investasi awal bagi rumah tangga berkurang sehingga pemasangan PLTS meningkat.","Potensi penyinaran matahari di Indonesia akan meningkat menjadi dua kali lipat.","Harga baterai penyimpanan energi akan otomatis menjadi gratis bagi seluruh warga.","Agenda transisi energi terbarukan tidak lagi diperlukan di kawasan khatulistiwa."]],["q","5",[["t","[Level Evaluasi] Kalimat yang memuat opini berbentuk rekomendasi penulis dalam teks di atas adalah ..."]],["Kalimat pertama","Kalimat kedua","Kalimat ketiga","Kalimat keempat","Tidak ada opini dalam teks"]],["key","Kunci Jawaban Pengenalan TKA (1)",["1. B (Tersurat pada kalimat kedua: letak geografis di garis khatulistiwa)","2. B (Kalimat 3 memaparkan kendala biaya & baterai, kalimat 4 menawarkan solusi 'Oleh karena itu, skema pembiayaan hijau...')","3. B (Penerapan teknologi baru)","4. B (Menjawab langsung hambatan biaya investasi awal)","5. D (Kalimat keempat menggunakan kata 'sangat diperlukan')."]]]},{"id":"c10","label":"Bab 10","judul":"Teks Ulasan (1): Pengertian, Tujuan, & Struktur Ulasan Karya","b":[["p","Teks ulasan (review/resensi) adalah teks yang berisi tinjauan, penilaian, dan apresiasi kritis terhadap suatu karya, baik berupa buku fiksi (novel, kumpulan cerpen), buku nonfiksi (ilmu pengetahuan, biografi), film, pementasan drama, maupun karya seni lainnya."],["h","A. Tujuan dan Manfaat Teks Ulasan"],["ul",["Bagi Pembaca / Penonton: Memberikan gambaran isi karya secara ringkas, membantu mempertimbangkan layak tidaknya suatu karya dinikmati, serta menumbuhkan daya apresiasi kritis.","Bagi Penulis / Kreator Karya: Menjadi umpan balik konstruktif atas kelebihan dan kekurangan karyanya untuk peningkatan kualitas di masa mendatang."]],["h","B. Struktur Teks Ulasan Secara Lengkap"],["tb",["Bagian Struktur","Isi Pokok & Ciri Uraian"],[["1. Identitas Karya","Memuat informasi bibliografis atau data teknis karya: judul karya, nama pengarang/sutradara, penerbit/rumah produksi, tahun terbit/rilis, tebal halaman/durasi, dan nomor ISBN."],["2. Orientasi","Bagian pengenalan yang menjelaskan gambaran umum karya, latar belakang penciptaan, penghargaan yang pernah diraih, atau posisi karya di tengah masyarakat."],["3. Sinopsis (Tafsiran Isi)","Ringkasan alur cerita (untuk karya fiksi/film) atau garis besar pokok bahasan setiap bab (untuk buku nonfiksi) secara objektif tanpa membocorkan akhir cerita secara berlebihan."],["4. Analisis","Paparan mengenai unsur-unsur pembangun karya, seperti tema, penokohan, alur, latar, gaya bahasa (pada novel), atau sinematografi dan akting (pada film)."],["5. Evaluasi","Penilaian kritis pengulas mengenai kelebihan (keunggulan) dan kekurangan (kelemahan) karya, disertai rekomendasi sasaran pembaca/penonton yang tepat."]]],["h","C. Contoh Penerapan Struktur Ulasan Buku"],["h3","Cuplikan Ulasan Novel 'Laskar Pelangi' Karya Andrea Hirata"],["ul",["[Identitas] Judul: Laskar Pelangi | Penulis: Andrea Hirata | Penerbit: Bentang Pustaka | Tahun: 2005 | Tebal: 529 halaman.","[Orientasi] Laskar Pelangi merupakan novel perdana karya Andrea Hirata yang menjadi fenomena sastra Indonesia dan telah diterjemahkan ke berbagai bahasa asing.","[Sinopsis] Novel ini mengisahkan perjuangan sepuluh anak dari keluarga kurang mampu di Pulau Belitung yang bersekolah di SD Muhammadiyah Gantong yang nyaris roboh.","[Analisis] Pengarang meramu alur maju dengan sudut pandang orang pertama ('Ikal') yang kuat, didukung diksi kaya metafora dan warna lokal budaya Melayu Belitung.","[Evaluasi] Keunggulan novel ini terletak pada kekuatan inspirasi pendidikan dan ketulusan persahabatan. Namun, penggunaan istilah ilmiah yang cukup padat pada beberapa bagian memerlukan konsentrasi ekstra bagi pembaca remaja."]]]},{"id":"c11","label":"Bab 11","judul":"Teks Ulasan (2): Kaidah Kebahasaan & Teknik Menulis Ulasan","b":[["p","Penulisan teks ulasan menuntut ketepatan penggunaan konjungsi penjelas, ungkapan penilaian yang santun dan objektif, serta alur penyajian yang runtut agar pembaca memperoleh pertimbangan yang seimbang."],["h","A. Kaidah Kebahasaan Teks Ulasan"],["ul",["1. Konjungsi Penerang: Digunakan untuk menerangkan atau memperjelas pernyataan sebelumnya, yaitu kata bahwa, yakni, yaitu. Contoh: 'Novel ini mengajarkan bahwa keterbatasan ekonomi bukanlah penghalang untuk bermimpi.'","2. Konjungsi Temporal (Waktu): Digunakan untuk menyatakan urutan waktu dalam sinopsis cerita, seperti sejak, semenjak, kemudian, akhirnya, sebelum, setelah. Contoh: 'Sejak kepindahan gurunya ke luar kota, semangat belajar mereka sempat menurun.'","3. Konjungsi Penyebab (Kausalitas): Digunakan untuk menjelaskan alasan munculnya keunggulan atau kelemahan karya, seperti karena, sebab, oleh sebab itu. Contoh: 'Film ini layak ditonton oleh keluarga karena sarat dengan nilai kebersamaan.'","4. Pernyataan Saran atau Rekomendasi: Menggunakan ungkapan ajakan atau pertimbangan di bagian akhir evaluasi, seperti hendaknya, sebaiknya, layak dibaca, sangat direkomendasikan, jangan sampai melewatkan.","5. Kata Sifat Penilaian (Adjektiva Evaluatif): Menggambarkan kualitas unsur karya secara spesifik, misalnya memukau, menyentuh, logis, membosankan, klise, bertele-tele, autentik."]],["h","B. Etika dan Langkah-Langkah Menyusun Teks Ulasan"],["ul",["Langkah 1 - Membaca atau Menyaksikan Karya Secara Tuntas: Menikmati seluruh bagian karya dari awal hingga akhir untuk memahami pesan utuhnya.","Langkah 2 - Mencatat Data Identitas dan Kutipan Penting: Mendata spesifikasi teknis karya serta menandai bagian-bagian yang menonjol (baik maupun kurang).","Langkah 3 - Menyusun Ringkasan (Sinopsis): Merangkum isi pokok karya dengan bahasa sendiri secara proporsional.","Langkah 4 - Merumuskan Penilaian Seimbang: Menyampaikan kelebihan dan kekurangan secara objektif dengan alasan logis, bukan berdasarkan sentimen pribadi terhadap pengarang.","Langkah 5 - Menuliskan Rekomendasi dan Menyunting: Menentukan segmentasi pembaca/penonton yang paling sesuai serta memeriksa kebakuan bahasa."]]]},{"id":"c12","label":"Bab 12","judul":"Puisi (1): Unsur Fisik dan Unsur Batin Pembangun Puisi","b":[["p","Puisi adalah ragam karya sastra yang bahasanya terikat oleh irama, matra, rima, serta penyusunan larik dan bait yang memadatkan makna dan pengalaman batin penyair secara estetis."],["h","A. Struktur Fisik Puisi (Metode Puisi)"],["ul",["1. Diksi (Pilihan Kata): Penyair memilih kata secara cermat berdasarkan ketepatan makna denotatif dan konotatif, kekuatan simbolik, serta keselarasan bunyi.","2. Pengimajian (Citraan / Imagery): Susunan kata yang mampu membangkitkan pengalaman pancaindra pembaca seolah-olah melihat, mendengar, atau merasakan langsung apa yang dilukiskan penyair: citraan penglihatan (visual), pendengaran (auditif), perabaan (taktil), penciuman (olfaktori), pengecapan (gustatori), dan gerak (kinestetik).","3. Kata Konkret: Kata-kata yang merujuk pada wujud nyata sehingga memudahkan pembaca membayangkan peristiwa atau suasana (contoh: kata 'salju' untuk melukiskan kebekuan hati; 'pelita' untuk harapan).","4. Bahasa Figuratif (Majas): Penggunaan gaya bahasa seperti personifikasi, metafora, simile, hiperbola, dan repetisi untuk memperkaya lapisan makna.","5. Rima (Persajakan) dan Ritme (Irama): Rima adalah pengulangan bunyi yang berselang pada awal, tengah, maupun akhir larik (rima silang a-b-a-b, rima berpeluk a-b-b-a, rima kembar a-a-b-b). Ritme adalah pergantian tinggi-rendah, panjang-pendek, dan keras-lembut ucapan bunyi.","6. Tipografi (Perwajahan Puisi): Tata letak baris, bait, penggunaan huruf kapital atau huruf kecil seluruhnya, serta tanda baca yang menciptakan kesan visual khas."]],["h","B. Struktur Batin Puisi (Hakikat Puisi)"],["tb",["Unsur Batin","Definisi & Cara Mengidentifikasi"],[["1. Tema (Sense)","Gagasan pokok atau persoalan dasar yang dikemukakan penyair dalam keseluruhan puisi (ketuhanan, kemanusiaan, cinta tanah air, kerinduan, kritik sosial)."],["2. Perasaan (Feeling)","Sikap emosional penyair yang menjiwai puisi (rasa haru, bangga, gelisah, duka cita, kagum, atau pemberontakan)."],["3. Nada dan Suasana (Tone)","Nada adalah sikap penyair terhadap pembaca (menasihati, menyindir, merayu, bercerita lugas). Suasana adalah kondisi psikologis yang timbul dalam diri pembaca setelah membaca puisi (khidmat, mencekam, syahdu, bersemangat)."],["4. Amanat (Intention)","Pesan moral atau tujuan yang ingin disampaikan penyair kepada pembaca melalui karya puisinya."]]]]},{"id":"c13","label":"Bab 13","judul":"Puisi (2): Puisi Diafan vs Prismatis, Interpretasi, & Deklamasi","b":[["p","Berdasarkan tingkat kejelasan maknanya, puisi modern dibagi menjadi puisi diafan dan puisi prismatis. Pemahaman perbedaan keduanya membantu pembaca menafsirkan makna puisi secara tepat tanpa terjebak pada arti harfiah semata."],["h","A. Perbandingan Puisi Diafan dan Puisi Prismatis"],["tb",["Aspek Pembeda","Puisi Diafan (Puisi Polos)","Puisi Prismatis"],[["Diksi & Gaya Bahasa","Menggunakan bahasa lugas, sehari-hari, minim majas, dan minim lambang/simbol rumit.","Kaya akan majas, metafora, lambang (simbol), dan kata bermakna konotatif."],["Keterbacaan Makna","Maknanya langsung mudah dipahami pada pembacaan pertama (transparan).","Maknanya berlapis (multi-tafsir) sehingga memerlukan perenungan dan analisis konteks lebih mendalam."],["Contoh Penyair","Puisi-puisi balada naratif sederhana atau puisi anak.","Karya Chairil Anwar, Sapardi Djoko Damono, Goenawan Mohamad, dan Subagio Sastrowardoyo."]]],["h","B. Langkah-Langkah Menginterpretasi (Memaknai) Puisi"],["ul",["1. Membaca Puisi Secara Berulang: Membaca dalam hati dan bersuara untuk merasakan irama, jeda, dan suasana emosionalnya.","2. Mengartikan Kata Kunci dan Lambang: Menemukan makna denotatif dan konotatif dari kata-kata dominan dalam setiap bait.","3. Memparafrasekan Larik Puisi: Mengubah bentuk puisi menjadi prosa dengan menambahkan kata penghubung yang dihilangkan penyair agar hubungan antarkata menjadi jelas.","4. Menyimpulkan Tema dan Amanat: Merumuskan gagasan utama dan pesan moral yang lahir dari keseluruhan bait."]],["h","C. Teknik Pembacaan Puisi dan Deklamasi"],["p","Membacakan puisi (dengan membawa teks) maupun deklamasi (membawakan puisi tanpa teks dengan hafalan dan penghayatan) memerlukan penguasaan empat unsur vokal dan ekspresi:"],["ul",["Lafal (Artikulasi): Kejelasan pengucapan setiap huruf vokal dan konsonan agar kata terdengar jernih.","Intonasi (Lagu Kalimat): Ketepatan naik-turunnya nada suara sesuai dengan emosi kalimat (berita, tanya, seru).","Jeda (Pemenggalan): Penghentian sementara untuk mengambil napas sekaligus menegaskan makna: jeda singkat (/), jeda sedang (//), dan jeda akhir bait (///).","Ekspresi dan Mimik: Keselarasan raut wajah dan gerak tubuh (gestur) yang wajar sesuai suasana isi puisi."]]]},{"id":"c14","label":"Bab 14","judul":"Drama (1): Karakteristik, Unsur Intrinsik, & Struktur Alur","b":[["p","Drama berasal dari bahasa Yunani 'draomai' yang berarti berbuat, berlaku, atau bertindak. Sebagai karya sastra, drama memiliki dua dimensi utama: dimensi sastra (naskah lakon) dan dimensi seni pertunjukan (pementasan di atas panggung)."],["h","A. Ciri Utama dan Unsur-Unsur Naskah Drama"],["ul",["1. Berbentuk Dialog (Percakapan): Seluruh kisah dibangun melalui percakapan langsung antartokoh (wawancang), tanpa narasi panjang pengarang seperti dalam novel.","2. Terdapat Petunjuk Lakuan (Kramagung): Keterangan teknis mengenai tindakan, mimik, posisi tokoh, pencahayaan, atau efek suara yang ditulis di dalam tanda kurung dan biasanya dicetak miring.","3. Mengandung Konflik: Pertentangan antartokoh maupun konflik batin dalam diri tokoh menjadi motor penggerak alur cerita.","4. Tokoh dan Perwatakan: Terdiri atas tokoh protagonis (mendukung tema/nilai utama), tokoh antagonis (penentang tokoh utama yang memicu konflik), dan tokoh tritagonis (penengah atau pembantu).","5. Latar (Setting): Mencakup latar tempat (panggung), latar waktu, dan latar suasana yang diwujudkan melalui tata panggung (dekorasi), tata lampu, dan tata suara."]],["h","B. Struktur Alur (Plot) dalam Drama"],["tb",["Tahapan Alur","Peran dalam Pertunjukan Drama"],[["1. Prolog","Kata pendahuluan atau pengantar yang dibacakan narator atau tokoh tertentu sebelum lakon dimulai untuk memperkenalkan latar dan situasi awal."],["2. Orientasi (Eksposisi)","Adegan awal yang memperkenalkan para tokoh, hubungan antartokoh, serta benih persoalan yang mulai muncul."],["3. Komplikasi","Bagian tengah ketika tokoh utama mulai menghadapi berbagai rintangan, kesalahpahaman, dan pertentangan yang semakin memanas."],["4. Klimaks","Puncak ketegangan konflik dalam drama yang menentukan nasib para tokoh utama."],["5. Resolusi (Peleraian)","Penyelesaian konflik setelah titik puncak terlewati, menunjukkan perubahan nasib atau kesadaran tokoh."],["6. Epilog","Kata penutup di akhir pementasan yang berisi simpulan atau pesan moral (amanat) cerita."]]]]},{"id":"c15","label":"Bab 15","judul":"Drama (2): Kaidah Kebahasaan & Penulisan Naskah Drama","b":[["p","Bahasa dalam naskah drama merepresentasikan tuturan lisan sehari-hari yang hidup dan ekspresif, disesuaikan dengan latar sosial, usia, dan karakter masing-masing tokoh."],["h","A. Kaidah Kebahasaan Khas Teks Drama"],["ul",["1. Penggunaan Kalimat Langsung: Seluruh dialog merupakan tuturan langsung tokoh yang dalam naskah drama ditulis setelah nama tokoh dan tanda titik dua (:), umumnya tanpa tanda petik jika sudah dipisahkan oleh kolom nama tokoh.","2. Kata Ganti Orang (Pronomina Persona): Dominan memakai kata ganti orang pertama dan kedua dalam dialog (aku, saya, kami, kita, kamu, engkau, Anda, kalian) serta kata ganti orang ketiga ketika membicarakan tokoh lain (dia, ia, beliau, mereka).","3. Kosakata Percakapan dan Kata Seru (Interjeksi): Memanfaatkan ungkapan ekspresif seperti wah, aduh, astaga, hei, oh, serta partikel penegas (-lah, -kah, sih, dong, kok) untuk menghidupkan dialog.","4. Konjungsi Temporal dan Kausalitas: Digunakan untuk merangkai peristiwa dalam dialog (sebelum, sekarang, setelah itu, karena, maka).","5. Verba Tindakan dan Verba Mental: Verba tindakan (membuka, melangkah, menoleh) banyak muncul pada kramagung, sedangkan verba mental (merasa, menduga, menyesal, berharap) muncul dalam dialog."]],["h","B. Contoh Format Penulisan Naskah Drama Baku"],["p","Babak I - Adegan 2: Ruang Redaksi Majalah Dinding Sekolah"],["p","[Latar: Sebuah ruangan kelas dengan papan mading besar di sudut kanan. Tumpukan kertas artikel berserakan di atas meja.]"],["p","Nadia : (Sambil merapikan lembaran kertas dengan wajah cemas) \"Rafi, batas pengumpulan naskah edisi bulan ini tinggal dua jam lagi. Mengapa artikel liputan utama belum juga dikirim?\""],["p","Rafi : (Masuk ke ruangan dengan napas terengah, membawa map biru) \"Tenang, Nad! Barusan aku selesai mewawancarai kepala perpustakaan. Ini draf finalnya.\""],["p","Nadia : (Tersenyum lega, menerima map biru) \"Syukurlah! Kalau begitu, mari kita tata tata letaknya bersama-sama sekarang.\""],["h","C. Langkah-Langkah Menulis dan Mementaskan Naskah Drama"],["p","Menulis naskah drama dapat dilakukan melalui dua cara: (1) menulis naskah orisinal berdasarkan ide/pengamatan kehidupan nyata, atau (2) mengalihwahanakan (mengadaptasi) karya prosa seperti cerpen atau novel menjadi bentuk dialog drama. Langkah penyusunannya meliputi: menentukan tema dan konflik utama, merancang daftar tokoh beserta wataknya, menyusun kerangka babak dan adegan, menulis dialog disertai kramagung yang jelas, serta melakukan pembacaan naskah bersama (reading) untuk menguji kelancaran dialog."]]},{"id":"c16","label":"Bab 16","judul":"Penilaian Akhir Tahun (PAT): Evaluasi Sumatif Semester Genap","b":[["p","Paket Penilaian Akhir Tahun (PAT) ini menguji penguasaan materi Bab 10 hingga Bab 15 (Teks Ulasan, Puisi, dan Drama) secara komprehensif."],["q","1",[["t","Bagian struktur teks ulasan yang memuat data judul, pengarang, penerbit, tahun terbit, dan jumlah halaman karya disebut ..."]],["Orientasi","Identitas karya","Sinopsis","Analisis","Evaluasi"]],["q","2",[["t","Cermati kutipan teks ulasan berikut:"],["bq","'Film dokumenter ini sangat layak ditonton oleh pelajar karena menyajikan data sejarah secara akurat dengan visualisasi animasi yang memukau. Meskipun alurnya terasa sedikit cepat pada bagian tengah, pesan kebangsaan yang disampaikan tetap terasa kuat.'"],["t","Kutipan tersebut merupakan bagian ..."]],["Identitas karya","Orientasi","Sinopsis","Evaluasi","Prolog"]],["q","3",[["t","Konjungsi penerang terdapat pada kalimat ..."]],["Sejak diterbitkan tahun lalu, novel itu telah dicetak ulang sebanyak lima kali.","Pengarang menjelaskan bahwa kisah tersebut terinspirasi dari pengalaman masa kecilnya.","Buku ini banyak diminati pembaca karena bahasanya sangat mudah dipahami.","Setelah membaca bab pertama, pembaca akan langsung terbawa suasana cerita.","Alur cerita berjalan lambat sehingga pembaca harus bersabar mengikuti kisahnya."]],["q","4",[["t","Bacalah kutipan puisi berikut:"],["bq","'Gemericik air sungai menyapa bebatuan"],["t","Desir angin membelai pucuk-pucuk ilalang"],["t","Sejuk embun pagi meresap ke telapak kaki'"],["t","Citraan yang terdapat pada larik pertama dan ketiga kutipan puisi tersebut secara berurutan adalah ..."]],["Penglihatan dan penciuman","Pendengaran dan perabaan","Gerak dan pengecapan","Penglihatan dan pendengaran","Perabaan dan penglihatan"]],["q","5",[["t","Puisi yang menggunakan bahasa lugas, tidak banyak memakai lambang atau majas yang rumit, sehingga maknanya mudah dipahami langsung oleh pembaca disebut puisi ..."]],["Prismatis","Diafan","Balada","Elegi","Ode"]],["q","6",[["t","Perasaan (feeling) penyair yang tergambar dalam kutipan puisi 'Tuhan, di batas senja ini / Hamba bersimpuh memohon ampunan / Atas segala khilaf langkah di bumi' adalah ..."]],["Kemarahan dan protes","Kekaguman terhadap alam","Penyesalan dan kerendahan hati","Kegembiraan yang meluap","Keputusasaan dalam hidup"]],["q","7",[["t","Unsur naskah drama yang berisi petunjuk perilaku, ekspresi, atau tindakan yang harus dilakukan tokoh di atas panggung disebut ..."]],["Wawancang","Prolog","Epilog","Kramagung","Monolog"]],["q","8",[["t","Tahapan alur drama ketika pertentangan antartokoh mencapai titik puncak ketegangan disebut ..."]],["Orientasi","Komplikasi","Klimaks","Resolusi","Epilog"]],["q","9",[["t","Bacalah kutipan drama berikut:"],["t","Bima : (Menatap tajam ke arah Sinta) \"Mengapa kau menyembunyikan surat itu dariku?\""],["t","Sinta : (Tertunduk takut) \"Aku... aku hanya tidak ingin membuatmu kecewa, Bim.\""],["t","Konflik yang tergambar dalam kutipan drama tersebut adalah ..."]],["Pertentangan fisik memperebutkan harta warisan","Ketidakjujuran Sinta yang memicu kemarahan Bima","Persaingan meraih juara lomba pidato di sekolah","Kesedihan Bima karena harus pindah ke kota lain","Perbedaan pendapat mengenai rencana kegiatan kelas"]],["q","10",[["t","Kalimat yang tepat untuk bagian rekomendasi dalam teks ulasan buku nonfiksi adalah ..."]],["Buku ini dicetak di atas kertas HVS berukuran 14 x 21 cm.","Bab pertama buku ini membahas sejarah perkembangan aksara Nusantara.","Penulis buku ini merupakan akademisi di bidang linguistik terapan.","Buku ini sangat direkomendasikan bagi mahasiswa dan guru yang ingin memperdalam teknik penyuntingan naskah.","Sampul buku didominasi warna biru tua dengan ilustrasi pena emas."]],["key","Kunci Jawaban & Pembahasan Ringkas PAT (Bab 16)",["1. B (Identitas karya)","2. D (Evaluasi: memuat kelebihan & kekurangan karya)","3. B (Konjungsi penerang 'bahwa')","4. B ('Gemericik air' = pendengaran/auditif; 'Sejuk embun meresap ke telapak kaki' = perabaan/taktil)","5. B (Puisi diafan)","6. C (Penyesalan & kerendahan hati di hadapan Tuhan)","7. D (Kramagung)","8. C (Klimaks)","9. B (Sinta menyembunyikan surat sehingga Bima marah)","10. D (Memuat saran/rekomendasi sasaran pembaca)."]]]},{"id":"c17","label":"Bab 17","judul":"Pengenalan TKA (2): Literasi Teks Sastra, Pembandingan Teks, & HOTS","b":[["p","Pengenalan Tes Kemampuan Akademik (TKA) Bagian 2 memfokuskan pada analisis mendalam terhadap teks sastra (prosa dan puisi) serta kemampuan membandingkan dua teks yang memiliki kesamaan tema atau perbedaan sudut pandang penyajian."],["h","A. Strategi Menjawab Soal TKA Literasi Sastra & Pembandingan Teks"],["ul",["1. Analisis Motif dan Perubahan Watak Tokoh: Perhatikan penyebab tindakan tokoh dan bagaimana peristiwa dalam cerita mengubah sikap tokoh dari awal hingga akhir.","2. Penafsiran Makna Simbolik dan Majas: Hubungkan kata-kata kias dalam puisi atau prosa dengan konteks suasana keseluruhan teks.","3. Pembandingan Dua Teks (Teks 1 vs Teks 2): Buat pemetaan cepat mengenai persamaan (tema, pesan moral, objek bahasan) dan perbedaan (sudut pandang, latar, gaya penyajian, atau sikap penulis)."]],["h","B. Paket Soal Latihan Pengenalan TKA (2)"],["p","Cermati dua kutipan teks sastra berikut untuk menjawab soal nomor 1 sampai 4!"],["p","Teks 1 (Kutipan Cerpen):"],["bq","\"Pukul empat pagi, lampu teplok di dapur Mbok Darmi sudah menyala. Tangannya yang keriput cekatan membungkus nasi uduk hangat ke dalam daun pisang. Meski lututnya kerap nyeri saat udara dingin menusuk, ia tak pernah absen menjajakan dagangannya di depan gerbang pabrik. Baginya, setiap rupiah yang terkumpul adalah batu bata yang kelak membangun masa depan cucunya di bangku kuliah.\""],["p","Teks 2 (Kutipan Puisi):"],["bq","\"Peluh jatuh membasahi kerah kemeja kusam"],["p","Langkah kaki menembus kabut subuh kota"],["p","Tak ada keluh yang terucap dari bibir"],["p","Hanya doa lirih agar anak-anak tetap mengeja aksara\""],["q","1",[["t","[Pembandingan Tema] Persamaan tema yang mendasari Teks 1 dan Teks 2 adalah ..."]],["Keindahan suasana pagi hari di pedesaan dan perkotaan","Kerja keras dan pengorbanan keluarga demi pendidikan generasi penerus","Kesulitan mencari lapangan pekerjaan di kawasan industri","Pentingnya menjaga kesehatan tubuh saat bekerja di pagi hari","Kemajuan pembangunan gedung perguruan tinggi di kota besar"]],["q","2",[["t","[Perbedaan Gaya Penyajian] Perbedaan cara penyajian gagasan antara Teks 1 dan Teks 2 adalah ..."]],["Teks 1 disajikan dalam bentuk dialog drama, sedangkan Teks 2 berbentuk artikel ilmiah.","Teks 1 menggunakan penceritaan prosa naratif dengan tokoh spesifik, sedangkan Teks 2 menggunakan larik-larik puisi yang padat citraan.","Teks 1 berlatar waktu malam hari, sedangkan Teks 2 berlatar waktu siang hari.","Teks 1 menonjolkan keluh kesah tokoh, sedangkan Teks 2 menonjolkan kemewahan hidup.","Teks 1 menggunakan sudut pandang orang pertama, sedangkan Teks 2 menggunakan sudut pandang orang kedua."]],["q","3",[["t","[Interpretasi Majas] Makna ungkapan 'setiap rupiah yang terkumpul adalah batu bata yang kelak membangun masa depan cucunya' pada Teks 1 adalah ..."]],["Mbok Darmi berencana membuka toko bahan bangunan di dekat pabrik.","Penghasilan kecil yang ditabung sedikit demi sedikit menjadi fondasi biaya pendidikan cucunya.","Cucu Mbok Darmi sedang menempuh pendidikan di jurusan teknik sipil.","Harga bahan bangunan semakin mahal sehingga sulit dijangkau warga.","Mbok Darmi membangun rumah baru dari hasil berjualan nasi uduk."]],["q","4",[["t","[Evaluasi Nilai Moral] Sikap keteladanan tokoh pada Teks 1 dan Teks 2 yang paling relevan diterapkan oleh pelajar adalah ..."]],["Bekerja sejak subuh dan meninggalkan kegiatan belajar di sekolah","Menghargai perjuangan orang tua dengan belajar sungguh-sungguh dan pantang menyerah","Menjual makanan tradisional di depan gerbang pabrik setiap pagi","Menghindari udara dingin dengan beristirahat sepanjang hari","Menulis puisi setiap kali menghadapi kesulitan ekonomi"]],["q","5",[["t","[Analisis Teks Ulasan & TKA] Bacalah kutipan berikut:"],["bq","'Buku kumpulan cerpen ini berhasil memotret dinamika kehidupan masyarakat pesisir dengan bahasa yang puitis namun tetap membumi. Sayangnya, beberapa cerita memiliki pola penyelesaian konflik yang serupa sehingga mudah ditebak pembaca.'"],["t","Simpulan penilaian pengulas terhadap buku kumpulan cerpen tersebut adalah ..."]],["Buku tersebut tidak layak dibaca karena seluruh ceritanya mudah ditebak.","Buku tersebut unggul dari segi kekuatan penggambaran latar dan bahasa, tetapi kurang bervariasi pada bagian akhir cerita.","Pengarang gagal menggambarkan kehidupan masyarakat pesisir secara nyata.","Bahasa yang digunakan pengarang terlalu sulit dipahami oleh pembaca umum.","Seluruh konflik dalam buku tersebut dibiarkan menggantung tanpa penyelesaian."]],["key","Kunci Jawaban & Pembahasan Pengenalan TKA (2) (Bab 17)",["1. B (Teks 1: Mbok Darmi berjualan demi kuliah cucunya; Teks 2: bekerja menembus kabut subuh agar anak-anak tetap bersekolah/mengeja aksara).","2. B (Teks 1 berbentuk prosa cerpen dengan tokoh Mbok Darmi; Teks 2 berbentuk puisi dengan citraan peluh dan kabut subuh).","3. B (Metafora 'batu bata' bermakna tabungan penghasilan yang dikumpulkan bertahap sebagai fondasi biaya kuliah).","4. B (Refleksi nilai moral bagi pelajar adalah menghargai pengorbanan keluarga dengan tekun belajar).","5. B (Merangkum kelebihan pada penggambaran latar/bahasa dan kelemahan pada penyelesaian konflik yang serupa)."]],["p","MODUL BAHASA INDONESIA SMP/MTs KELAS VIII - BAB 1 s.d. BAB 17"],["p","Modul Pembelajaran Bahasa Indonesia Kurikulum Merdeka & Persiapan TKA  |  Halaman"]]}]},{"id":"terpadu","judul":"Bahasa Indonesia Terpadu","sub":"Persiapan Ujian Sekolah · Bab I–IX + Latihan","deskripsi":"Ejaan, tata kalimat, tata makna, paragraf, kemahiran berbahasa, majas dan peribahasa, kesusastraan, latihan terpadu, dan paket simulasi ujian sekolah.","bab":[{"id":"c0","label":"Pengantar","judul":"Tentang Modul Ini","b":[["p","Modul ini disusun secara sistematis mengikuti urutan pokok bahasan dalam kurikulum bimbingan belajar Bahasa Indonesia, mencakup penguasaan kaidah kebahasaan (ejaan, sintaksis, semantik), keterampilan wacana dan kemahiran berbahasa, apresiasi sastra, hingga latihan terpadu persiapan Ujian Sekolah (US)."],["h","Cakupan Materi"],["tb",["Cakupan Bagian","Pokok Bahasan Utama"],[["BAB I & II","Ejaan yang Disempurnakan (EYD) - Huruf, Kata, & Tanda Baca"],["BAB III & IV","Tata Kalimat (Sintaksis) & Tata Makna (Semantik)"],["BAB V","Struktur, Syarat, dan Jenis-Jenis Paragraf"],["BAB VI & VII","Kemahiran Berbahasa - Membaca Kritis & Menulis Ilmiah/Praktis"],["BAB VIII & IX","Majas, Peribahasa, dan Apresiasi Kesusastraan Indonesia"],["BAGIAN AKHIR","Latihan Terpadu (1-2) & Paket Persiapan Ujian Sekolah (US 1-4)"]]],["h","Strategi Belajar Efektif"],["ul",["1. Pahami konsep dasar pada Bab I-V sebagai fondasi analisis soal kebahasaan dan penyuntingan teks.","2. Latih kecepatan membaca memindai (skimming & scanning) pada Bab VI-VII untuk menaklukkan teks panjang.","3. Kuasai pembedaan majas, peribahasa, dan unsur sastra pada Bab VIII-IX melalui tabel perbandingan.","4. Kerjakan Latihan (1)-(2) serta Paket Persiapan US (1)-(4) secara mandiri sebelum mencocokkan kunci jawaban."]]]},{"id":"c1","label":"Bab I","judul":"Ejaan yang Disempurnakan (1): Pemakaian Huruf & Penulisan Kata","b":[["p","Ejaan adalah keseluruhan peraturan bagaimana melambangkan bunyi ujaran dan bagaimana hubungan antara lambang-lambang itu (pemisahan dan penggabungannya dalam suatu bahasa). Dalam sejarah bahasa Indonesia, sistem ejaan mengalami penyempurnaan mulai dari Ejaan Van Ophuijsen (1901), Ejaan Republik/Soewandi (1947), Ejaan yang Disempurnakan/EYD (1972), Pedoman Umum Ejaan Bahasa Indonesia/PUEBI (2015), hingga EYD Edisi V (2022)."],["h","A. Pemakaian Huruf Kapital"],["p","Huruf kapital atau huruf besar memiliki aturan penggunaan yang ketat dalam tulisan formal. Kesalahan pemakaian huruf kapital merupakan salah satu butir soal yang paling sering diujikan dalam ujian sekolah maupun seleksi masuk perguruan tinggi."],["ul",["Huruf Pertama Awal Kalimat dan Petikan Langsung: Dipakai sebagai huruf pertama pada awal kalimat dan petikan langsung. Contoh: Adik bertanya, \"Kapan kita pulang ke Sukabumi?\"","Nama Tuhan, Agama, Kitab Suci, dan Kata Ganti Tuhan: Dipakai sebagai huruf pertama unsur nama Tuhan dan kitab suci, termasuk kata ganti untuk Tuhan. Contoh: Allah, Yang Mahakuasa, Islam, Al-Qur'an, Weda, hamba-Mu, atas rahmat-Nya.","Gelar Kehormatan, Keturunan, Keagamaan, dan Jabatan: Kapital jika diikuti nama orang atau dipakai sebagai pengganti nama orang tertentu (misalnya: Sultan Hasanuddin, Haji Agus Salim, Presiden Soekarno, Gubernur Jawa Barat). Tidak kapital jika tidak diikuti nama orang (misalnya: Ia bercita-cita menjadi gubernur).","Nama Bangsa, Suku Bangsa, Bahasa, dan Tahun/Bulan/Hari: Kapital pada nama diri bangsa, suku, bahasa, serta nama hari dan bulan, tetapi tidak pada kata dasarnya (misalnya: bangsa Indonesia, suku Sunda, bahasa Arab, hari Senin, bulan Agustus; bandingkan dengan: mengindonesiakan, keinggris-inggrisan).","Nama Geografi: Kapital jika diikuti nama diri geografi (Sungai Citarum, Gunung Gede, Selat Sunda, Kota Jakarta). Tidak kapital jika hanya merupakan jenis (berlayar ke teluk, mandi di sungai) atau nama geografi yang dipakai sebagai nama jenis (jeruk bali, kacang bogor, gula jawa, pisang ambon).","Judul Buku, Karangan, Artikel, dan Nama Media: Semua kata diawali huruf kapital kecuali kata tugas (di, ke, dari, dan, yang, untuk, pada, dalam, terhadap, sebagai) yang tidak terletak pada posisi awal judul. Contoh: Dari Ave Maria ke Jalan Lain ke Roma.","Kata Penunjuk Hubungan Kekerabatan: Kapital jika dipakai dalam penyapaan atau pengacuan langsung (\"Kapan Bapak berangkat?\", \"Silakan duduk, Dik!\"). Tidak kapital jika tidak dipakai dalam penyapaan (Kita harus menghormati bapak dan ibu kita)."]],["h","B. Pemakaian Huruf Miring dan Huruf Tebal"],["ul",["Huruf Miring: Dipakai untuk: (1) menuliskan judul buku, nama majalah, atau nama surat kabar yang dikutip dalam tulisan, termasuk dalam daftar pustaka; (2) menegaskan atau mengkhususkan huruf, bagian kata, kata, atau kelompok kata dalam kalimat; (3) menuliskan kata atau ungkapan dalam bahasa daerah atau bahasa asing yang belum diserap sepenuhnya (contoh: weltanschauung, ngabuburit, bhineka tunggal ika).","Huruf Tebal: Dipakai untuk: (1) menegaskan bagian tulisan yang sudah ditulis miring (misalnya: Huruf dh, seperti pada kata Ramadhan, tidak terdapat dalam Ejaan Bahasa Indonesia); (2) menegaskan bagian-bagian karangan, seperti judul buku, bab, atau subbab."]],["h","C. Penulisan Kata: Kata Dasar, Turunan, Ulang, dan Gabungan Kata"],["p","Kaidah penulisan kata mengatur bagaimana morfem bebas dan morfem terikat dirangkai secara ortografis:"],["tb",["Bentuk Kata","Kaidah Penulisan","Contoh Benar vs Salah"],[["Kata Berimbuhan","Imbuhan (awalan, sisipan, akhiran, gabungan) ditulis serangkai dengan bentuk dasarnya.","Benar: mengoordinasi, memengaruhi, menyukseskan, bertanggung jawab.\nSalah: mengkoordinir, mempengaruhi, mensukseskan."],["Bentuk Terikat","Ditulis serangkai dengan kata yang mengikutinya (adi-, antar-, catur-, dwi-, eka-, infra-, kontra-, maha-, non-, pasca-, pramu-, sub-, tuna-). Jika diikuti kata berhuruf kapital, diberi tanda hubung (-).","Benar: antarkota, pascasarjana, non-Indonesia, pro-Barat, Maha Esa (khusus sifat Tuhan).\nSalah: antar kota, pasca sarjana, non Indonesia."],["Kata Ulang","Ditulis dengan menggunakan tanda hubung (-) di antara unsur-unsurnya, termasuk bentuk ulang berimbuhan.","Benar: anak-anak, berjalan-jalan, sayur-mayur, bersalam-salaman.\nSalah: anak2, berjalan jalan."],["Gabungan Kata","Unsur gabungan kata (kata majemuk) ditulis terpisah, kecuali yang sudah padu (acapkali, adakalanya, apabila, bagaimana, barangkali, beasiswa, belasungkawa, dukacita, matahari, olahraga, peribahasa, segitiga, sukacita, darmabakti).","Benar: duta besar, kambing hitam, tanggung jawab, tanda tangan.\nJika mendapat awalan DAN akhiran sekaligus: mempertanggungjawabkan, menandatangani."],["Kata Depan (di, ke, dari)","Ditulis terpisah dari kata yang mengikutinya apabila menunjukkan tempat, arah, atau asal (dapat diuji dengan pertanyaan 'di mana/ke mana/dari mana').","Benar: di sekolah, ke kampus, dari rumah, di samping itu.\nBandingkan imbuhan: ditulis, keluar, daripada."]]],["h","D. Partikel, Singkatan, Akronim, Angka, dan Bilangan"],["ul",["Partikel -lah, -kah, dan -tah: Ditulis serangkai dengan kata yang mendahuluinya (Bacalah buku itu! Apakah maksudmu?).","Partikel pun: Ditulis terpisah dari kata yang mendahuluinya (Apa pun permasalahannya, kita harus tetap tenang; Satu kali pun ia belum pernah datang). Pengecualian: partikel pun yang merupakan unsur kata penghubung ditulis serangkai, yaitu adapun, andaipun, ataupun, bagaimanapun, biarpun, kalaupun, kendatipun, maupun, meskipun, sekalipun, sungguhpun, walaupun.","Partikel per: Ditulis terpisah jika berarti 'demi', 'tiap', atau 'mulai' (per helai, per orang, per 1 Januari). Ditulis serangkai jika merupakan bagian bilangan pecahan (sepertiga, dua perlima).","Singkatan dan Akronim: Singkatan nama orang, gelar, sapaan, jabatan diikuti tanda titik (A.H. Nasution, S.Pd., M.Hum., Sdr.). Singkatan nama lembaga/dokumen resmi ditulis kapital tanpa titik (NKRI, PBB, UUD, KTP). Singkatan umum tiga huruf atau lebih diikuti satu tanda titik (dll., dsb., dst., hlm., yth.).","Penulisan Angka dan Bilangan: Bilangan dalam teks yang dapat dinyatakan dengan satu atau dua kata ditulis dengan huruf, kecuali jika dipakai secara berurutan seperti dalam perincian (contoh: Mereka menonton drama itu sampai tiga kali; Di antara 72 anggota yang hadir, 52 orang setuju, 15 orang tidak setuju, dan 5 orang abstain). Angka pada awal kalimat harus dihindari dengan mengubah susunan kalimat atau mengejanya dengan huruf."]]]},{"id":"c2","label":"Bab II","judul":"Ejaan yang Disempurnakan (2): Pemakaian Tanda Baca & Unsur Serapan","b":[["p","Tanda baca berfungsi menjaga struktur sintaksis dan kejelasan makna kalimat. Perubahan letak satu tanda baca saja dapat mengubah maksud sebuah pernyataan secara total. Selain tanda baca, penguasaan kaidah penyesuaian ejaan unsur serapan dari bahasa asing (Arab, Inggris, Belanda, Sanskerta) sangat penting untuk menjaga kebakuan kosakata."],["h","A. Kaidah Pemakaian Tanda Baca Utama"],["tb",["Tanda Baca","Fungsi Utama & Kaidah Penting","Contoh Penggunaan yang Benar"],[["Tanda Titik (.)","Dipakai pada akhir kalimat pernyataan; di belakang angka/huruf dalam bagan atau ikhtisar (tanpa titik pada angka terakhir); memisahkan jam, menit, detik; memisahkan bilangan ribuan yang menunjukkan jumlah.","Pukul 07.30.15 WIB.\nJumlah peserta mencapai 1.250 orang.\nTidak dipakai pada tahun (tahun 2026) atau nomor halaman (hlm. 125)."],["Tanda Koma (,)","Dipakai di antara unsur perincian (sebelum 'dan/atau'); sebelum kata penghubung intrakalimat pertentangan (tetapi, melainkan, sedangkan); memisahkan anak kalimat yang mendahului induk kalimat; di belakang ungkapan penghubung antarkalimat (Oleh karena itu, Namun, Akan tetapi, Dengan demikian).","Saya membeli buku, pena, dan penghapus.\nDia pandai, tetapi kurang teliti.\nKarena hujan deras, rapat ditunda.\nOleh karena itu, kita harus waspada."],["Tanda Titik Koma (;)","Memisahkan bagian-bagian kalimat yang sejenis dan setara; pengganti kata penghubung untuk memisahkan kalimat setara dalam kalimat majemuk setara; memisahkan unsur perincian yang sudah mengandung tanda koma.","Hari sudah malam; anak-anak masih membaca buku.\nIbu membeli buku, pensil, dan tinta; baju, celana, dan kaus; serta pisang, apel, dan jeruk."],["Tanda Titik Dua (:)","Dipakai pada akhir pernyataan lengkap yang diikuti pemerincian atau penjelasan; sesudah kata/ungkapan yang memerlukan pemerian; dalam naskah drama sesudah kata yang menunjukkan pelaku percakapan.","Kita memerlukan perabot rumah tangga: kursi, meja, dan lemari.\nTidak dipakai jika pemerincian merupakan pelengkap yang mengakhiri pernyataan (Kita memerlukan kursi, meja, dan lemari)."],["Tanda Hubung (-)","Menyambung unsur kata ulang; merangkai se- dengan kata berhuruf kapital, ke- dengan angka, angka dengan -an, dan huruf kapital dengan imbuhan.","se-Indonesia, abad ke-21, tahun 1990-an, mem-PHK, ber-KTP, sinar-X."],["Tanda Pisah (-)","Membatasi penyisipan kata/kalimat yang memberi penjelasan di luar bangun kalimat; menegaskan adanya keterangan aposisi; berarti 'sampai dengan' atau 'sampai ke'.","Kemerdekaan bangsa itu-saya yakin akan tercapai-diperjuangkan oleh bangsa itu sendiri.\nTanggal 5-10 April 2026; Jakarta-Bandung."],["Tanda Petik (\"...\")","Mengapit petikan langsung; mengapit judul puisi, lagu, artikel, bab buku yang dipakai dalam kalimat; mengapit istilah ilmiah yang kurang dikenal atau kata yang mempunyai arti khusus.","Sajak \"Aku\" karya Chairil Anwar sangat terkenal.\nIa dijuluki \"kutu buku\" di kelasnya."],["Tanda Garis Miring (/)","Dipakai dalam nomor surat, nomor pada alamat, penandaan masa satu tahun yang terbagi dalam dua tahun takwim, serta pengganti kata 'dan', 'atau', serta 'setiap'.","No. 7/PK/II/2026\nTahun ajaran 2026/2027\nHarganya Rp15.000,00/lembar."]]],["h","B. Penulisan Unsur Serapan"],["p","Berdasarkan taraf integrasinya, unsur serapan dalam bahasa Indonesia dibagi menjadi dua golongan besar: (1) unsur asing yang belum sepenuhnya terserap ke dalam bahasa Indonesia (seperti force majeure, de facto, status quo) yang pengucapan dan penulisannya masih mengikuti cara asing dengan cetak miring; dan (2) unsur asing yang penulisan dan pengucapannya disesuaikan dengan kaidah bahasa Indonesia."],["tb",["Kaidah Perubahan","Bentuk Asing (Asal)","Bentuk Baku Indonesia","Bentuk Tidak Baku (Hindari)"],[["aa menjadi a","baal, octaaf","bal, oktaf","baal, oktaaf"],["c (di depan a, u, o) -> k","construction, cubic","konstruksi, kubik","konstruksi, cubik"],["c (di depan e, i, y) -> s","central, circulation","sentral, sirkulasi","central, cirkulasi"],["cc (di depan o, u) -> k","accomodation, acculturation","akomodasi, akulturasi","akomodasi, akkulturasi"],["cc (di depan e, i) -> ks","accent, vaccine","aksen, vaksin","aksent, vacsin"],["ch, sch -> k","technique, schema","teknik, skema","tehnik, sekema"],["ph -> f","phase, physiology","fase, fisiologi","phase, phisiologi"],["q -> k","aquarium, frequency","akuarium, frekuensi","aquarium, frekwensi"],["rh -> r","rhapsody, rhythm","rapsodi, ritme","rhapsodi, rhitme"],["th -> t","theory, method","teori, metode","theori, metoda"],["x (di tengah/akhir) -> ks","complex, taxi","kompleks, taksi","komplek, taxi"],["y -> i","system, analysis","sistem, analisis","sistim, analisa"]]],["h3","Daftar Kata Baku Populer yang Sering Salah Tulis dalam Ujian"],["ul",["Abjad (bukan abjat), aktivitas (bukan aktifitas), apotek (bukan apotik), atlet (bukan atlit), atmosfer (bukan atmosfir).","Cenderamata (bukan cinderamata), diagnosis (bukan diagnosa), ekspor (bukan eksport), ekstrem (bukan ekstrim).","Februari (bukan Pebruari), fondasi (bukan pondasi), foto (bukan photo), gladi (bukan geladi), hierarki (bukan hirarki).","Ijazah (bukan ijasah), izin (bukan ijin), jadwal (bukan jadual), jenderal (bukan jendral), karier (bukan karir).","Kuitansi (bukan kwitansi), lembap (bukan lembab), nasihat (bukan nasehat), objek (bukan obyek), praktik (bukan praktek).","Risiko (bukan resiko), sekadar (bukan sekedar), silakan (bukan silahkan), subjek (bukan subyek), zaman (bukan jaman)."]]]},{"id":"c3","label":"Bab III","judul":"Tata Kalimat: Unsur, Pola Dasar, Jenis Kalimat, & Kalimat Efektif","b":[["p","Tata kalimat atau sintaksis mengkaji hubungan antarkata dalam membentuk frasa, klausa, dan kalimat. Kalimat adalah satuan bahasa terkecil, dalam wujud lisan atau tulisan, yang mengungkapkan pikiran yang utuh. Dalam ragam tulis, kalimat diawali dengan huruf kapital dan diakhiri dengan tanda titik (.), tanda tanya (?), atau tanda seru (!)."],["h","A. Unsur-Unsur Pembentuk Kalimat (S-P-O-Pel-K)"],["ul",["Subjek (S): Bagian kalimat yang menunjukkan pelaku, tokoh, sosok, sesuatu hal, atau masalah yang menjadi pangkal pembicaraan. Subjek umumnya berkelas kata nomina atau frasa nominal, dan dapat diuji dengan pertanyaan 'apa' atau 'siapa'.","Predikat (P): Bagian kalimat yang memberi tahu melakukan tindakan apa atau dalam keadaan bagaimana subjek itu. Predikat dapat berupa verba, adjektiva, nomina, numeralia, atau frasa preposisional.","Objek (O): Bagian kalimat yang melengkapi predikat verbal transitif aktif. Objek terletak langsung di belakang predikat tanpa preposisi dan dapat menjadi subjek apabila kalimat diubah menjadi bentuk pasif.","Pelengkap (Pel): Bagian kalimat yang melengkapi predikat (biasanya verba berimbuhan ber-, ter-, ke-an, atau verba dwitransitif). Berbeda dengan objek, pelengkap tidak dapat dipasifkan menjadi subjek. Contoh: Indonesia berdasarkan Pancasila ('Pancasila' adalah Pelengkap).","Keterangan (K): Bagian kalimat yang menerangkan berbagai hal mengenai bagian kalimat yang lainnya (tempat, waktu, cara, alat, tujuan, sebab, akibat). Letak keterangan bersifat manasuka (dapat dipindah ke awal, tengah, atau akhir kalimat) dan umumnya didahului preposisi (di, ke, dari, pada, dengan, untuk, karena)."]],["h","B. Enam Pola Dasar Kalimat Bahasa Indonesia"],["tb",["Pola Dasar","Struktur Unsur","Contoh Kalimat"],[["Pola 1: S - P","Subjek + Predikat (Verba Intransitif / Adjektiva / Nomina)","Mahasiswa (S) sedang berdiskusi (P). / Ayahnya (S) seorang dosen (P)."],["Pola 2: S - P - O","Subjek + Predikat (Verba Transitif) + Objek","Peneliti (S) menganalisis (P) data lapangan (O)."],["Pola 3: S - P - Pel","Subjek + Predikat + Pelengkap","Tubuhnya (S) berlumuran (P) keringat (Pel)."],["Pola 4: S - P - K","Subjek + Predikat + Keterangan","Rapat koordinasi (S) berlangsung (P) di aula kampus (K)."],["Pola 5: S - P - O - Pel","Subjek + Predikat (Dwitransitif) + Objek + Pelengkap","Ibu (S) membelikan (P) adik (O) sepatu baru (Pel)."],["Pola 6: S - P - O - K","Subjek + Predikat + Objek + Keterangan","Pemerintah (S) menyalurkan (P) bantuan sosial (O) kemarin pagi (K)."]]],["h","C. Jenis Kalimat Berdasarkan Struktur Gramatikal"],["ul",["Kalimat Tunggal: Kalimat yang hanya terdiri atas satu klausa (satu pola S-P). Contoh: Para siswa membaca buku di perpustakaan.","Kalimat Majemuk Setara (Koordinatif): Kalimat yang terdiri atas dua klausa atau lebih yang memiliki kedudukan sederajat, dihubungkan dengan konjungsi koordinatif seperti dan, serta (penjumlahan); atau (pemilihan); tetapi, melainkan, sedangkan (pertentangan); lalu, kemudian (urutan).","Kalimat Majemuk Bertingkat (Subordinatif): Kalimat yang terdiri atas induk kalimat (klausa utama) dan anak kalimat (klausa subordinatif) yang kedudukannya tidak sejajar. Anak kalimat berfungsi menggantikan salah satu fungsi sintaksis (subjek, objek, atau keterangan) dan ditandai konjungsi subordinatif (ketika, sejak, agar, supaya, jika, apabila, meskipun, walaupun, karena, sehingga, bahwa, yang).","Kalimat Majemuk Campuran: Gabungan antara kalimat majemuk setara dan kalimat majemuk bertingkat (minimal terdiri atas tiga klausa)."]],["h","D. Syarat Kalimat Efektif"],["p","Kalimat efektif adalah kalimat yang mampu mengungkapkan gagasan penutur atau penulis secara tepat sehingga dapat dipahami oleh pendengar atau pembaca secara tepat pula. Tujuh syarat utama kalimat efektif meliputi:"],["ul",["1. Kesepadanan Struktur: Memiliki kejelasan subjek dan predikat. Hindari penggunaan preposisi di depan subjek (contoh salah: 'Bagi para siswa harap berkumpul' -> seharusnya 'Para siswa harap berkumpul') serta hindari penggunaan konjungsi intrakalimat pada kalimat tunggal.","2. Keparalelan (Kesejajaran Bentuk): Kesamaan bentuk kata atau imbuhan yang digunakan dalam rincian setara. Contoh salah: 'Tahap akhir penelitian adalah pengumpulan data, mengolah data, dan pelaporan.' Seharusnya: 'pengumpulan data, pengolahan data, dan pelaporan.'","3. Ketegasan Makna: Penonjolan ide pokok kalimat melalui peletakan kata kunci di awal kalimat, urutan logis, atau penggunaan partikel penegas (-lah, -kah).","4. Kehematan Kata: Menghindari penggunaan kata, frasa, atau bentuk lain yang tidak perlu (pleonasme), seperti menghilangkan subjek ganda, menghindari hiponim yang sudah tercakup (misalnya 'warna merah' cukup 'merah', 'bulan Agustus' cukup 'Agustus'), dan menghindari penjamakan ganda ('para hadirin', 'banyak guru-guru').","5. Kecermatan Pemilihan Kata: Tidak menimbulkan tafsiran ganda (ambiguitas) dan tepat dalam memilih diksi.","6. Kepaduan (Koherensi): Hubungan timbal balik antarunsur kalimat berjalan erat tanpa menyisipkan kata yang tidak perlu antara predikat dan objek (contoh salah: 'membahas tentang masalah' -> seharusnya 'membahas masalah').","7. Kelogisan: Ide kalimat dapat diterima oleh akal sehat dan sesuai dengan ejaan yang berlaku. Contoh tidak logis: 'Waktu dan tempat kami persilakan.' Seharusnya: 'Bapak Kepala Sekolah kami persilakan.'"]]]},{"id":"c4","label":"Bab IV","judul":"Tata Makna: Jenis Makna, Relasi Makna, & Perubahan Makna","b":[["p","Tata makna atau semantik adalah cabang ilmu bahasa yang menyelidiki makna atau arti tanda bahasa. Pemahaman semantik membantu pembaca menafsirkan pesan tersurat maupun tersirat dalam sebuah wacana serta mencegah kesalahpahaman komunikasi."],["h","A. Klasifikasi Jenis Makna"],["tb",["Jenis Makna","Pengertian","Contoh dalam Kalimat"],[["Makna Leksikal","Makna dasar kata sebagaimana tercantum dalam kamus (leksikon), lepas dari konteks kalimat.","Kata 'kursi' bermakna tempat duduk yang berkaki dan bersandaran."],["Makna Gramatikal","Makna yang muncul akibat proses gramatikal (pengimbuhan, pengulangan, pemajemukan).","Kata 'berkuda' bermakna mengendarai kuda; 'kuda-kuda' bermakna penyangga atap."],["Makna Denotatif","Makna lugas, objektif, dan sebenarnya sesuai dengan acuan fisik tanpa nilai rasa tambahan.","Ia membeli kambing hitam untuk kurban Iduladha."],["Makna Konotatif","Makna kias atau tambahan yang mengandung nilai rasa (positif/negatif) dan asosiasi emosional.","Dalam kasus itu, ia dijadikan kambing hitam (pihak yang dipersalahkan)."],["Makna Referensial","Kata yang memiliki acuan langsung di dunia nyata (benda, peristiwa, sifat).","Meja, gunung, merah, berlari."],["Makna Nonreferensial","Kata yang tidak memiliki acuan fisik di dunia nyata (umumnya kata tugas).","Dan, atau, karena, tetapi, di."],["Makna Idiomatik","Makna gabungan kata yang tidak dapat diramalkan dari makna unsur pembentuknya.","Banting tulang (bekerja keras), meja hijau (pengadilan), naik daun (terkenal)."]]],["h","B. Relasi Makna (Hubungan Semantis Antarkata)"],["ul",["Sinonim (Padan Kata): Hubungan semantik yang menyatakan adanya kesamaan makna antara satu satuan ujaran dengan satuan ujaran lainnya. Contoh: mati = wafat = meninggal = gugur; pintar = pandai = cerdas. Meskipun bersinonim, nuansa makna dan konteks pemakaiannya sering berbeda.","Antonim (Lawan Kata): Hubungan semantik antara dua buah satuan ujaran yang maknanya menyatakan kebalikan, pertentangan, atau kontras. Jenis antonim meliputi antonim mutlak (hidup >< mati), antonim kutub/gradasi (panas >< dingin), antonim relasional (suami >< istri, menjual >< membeli), dan antonim hierarkis (meter >< kilometer).","Homonim: Dua kata atau lebih yang memiliki bentuk tulisan dan pelafalan yang sama, tetapi maknanya berbeda dan berasal dari sumber yang berlainan. Contoh: 'bisa' (dapat/mampu) dan 'bisa' (racun ular); 'hak' (milik/wewenang) dan 'hak' (bagian alas sepatu).","Homofon: Kata-kata yang sama bunyi pelafalannya, tetapi berbeda tulisan dan maknanya. Contoh: 'bank' (lembaga keuangan) dan 'bang' (sapaan kakak laki-laki); 'massa' (kumpulan orang/jumlah zat) dan 'masa' (waktu).","Homograf: Kata-kata yang sama ejaan tulisannya, tetapi berbeda pelafalan dan maknanya. Contoh: 'apel' (buah) dan 'apel' (upacara); 'serang' (menyerbu) dan 'Serang' (nama kota di Banten); 'tahu' (paham) dan 'tahu' (makanan dari kedelai).","Polisemi: Satu satuan bahasa (kata atau frasa) yang memiliki lebih dari satu makna, namun makna-makna tersebut masih memiliki pertalian asal-usul atau konsep dasar yang sama. Contoh: kata 'kepala' pada kepala manusia, kepala sekolah, kepala surat, dan kepala kereta api.","Hipernim dan Hiponim: Hipernim adalah kata umum yang mencakup makna kata-kata di bawahnya (superordinat), sedangkan hiponim adalah kata khusus yang maknanya tercakup dalam hipernim (subordinat). Contoh: 'bunga' adalah hipernim; 'mawar, melati, anggrek, kamboja' adalah hiponim (kohiponim satu sama lain)."]],["h","C. Faktor dan Jenis Perubahan Makna"],["p","Seiring perkembangan zaman dan dinamika sosial budaya, makna kata dapat mengalami pergeseran atau perubahan:"],["ul",["1. Generalisasi (Meluas): Cakupan makna sekarang lebih luas daripada makna pada masa lampau. Contoh: 'bapak', 'ibu', 'saudara' dahulu hanya untuk hubungan darah, kini untuk sapaan umum; 'berlayar' dahulu hanya memakai perahu layar, kini mencakup kapal bermesin.","2. Spesialisasi (Menyempit): Cakupan makna sekarang lebih sempit daripada makna asalnya. Contoh: 'sarjana' dahulu berarti semua orang cendekiawan, kini khusus lulusan strata satu (S-1); 'madrasah' dahulu berarti sekolah secara umum, kini sekolah bernapaskan Islam.","3. Ameliorasi (Membaik): Proses perubahan makna yang mengakibatkan makna baru dirasakan lebih tinggi, hormat, atau halus nilainya dibandingkan makna lama. Contoh: kata 'istri' lebih halus daripada 'bini'; 'tunawisma' lebih halus daripada 'gelandangan'; 'pramuniaga' daripada 'pelayan toko'.","4. Peyorasi (Memburuk): Proses perubahan makna yang mengakibatkan makna baru dirasakan lebih rendah atau kurang menyenangkan dibandingkan makna lama. Contoh: kata 'oknum', 'gerombolan', 'kroninya' dahulu bermakna netral, kini berkonotasi negatif.","5. Sinestesia: Perubahan makna akibat pertukaran tanggapan antara dua indra yang berbeda. Contoh: 'suaranya sedap didengar' (indra pengecap ke pendengaran), 'kata-katanya pedas' (pengecap ke pendengaran), 'wajahnya manis' (pengecap ke penglihatan).","6. Asosiasi: Perubahan makna yang terjadi karena adanya persamaan sifat antara dua hal. Contoh: 'amplop' diasosiasikan dengan uang suap; 'catut' diasosiasikan dengan calo tiket atau pengambilan keuntungan tidak sah."]]]},{"id":"c5","label":"Bab V","judul":"Paragraf: Unsur Pembangun, Syarat Kesatuan-Koherensi, & Pola Pengembangan","b":[["p","Paragraf (alinea) adalah satuan bahasa yang lebih besar daripada kalimat, terdiri atas sekumpulan kalimat yang saling bertalian secara logis untuk mengembangkan satu gagasan utama (pikiran utama). Secara visual, paragraf ditandai dengan penulisan baris pertama yang menjorok ke dalam (indensi) atau pemberian spasi antarparagraf."],["h","A. Unsur-Unsur Pembangun Paragraf"],["ul",["1. Gagasan Utama (Ide Pokok): Inti persoalan atau pokok pembicaraan yang menjadi dasar pengembangan seluruh paragraf. Setiap paragraf yang baik hanya memiliki satu gagasan utama.","2. Kalimat Utama: Kalimat yang memuat gagasan utama secara eksplisit. Kalimat utama bersifat umum dan menjadi tumpuan bagi kalimat-kalimat lain dalam paragraf tersebut.","3. Kalimat Penjelas: Kalimat-kalimat yang berisi uraian, rincian, contoh, data, bukti, atau alasan yang berfungsi mendukung dan memperjelas kalimat utama."]],["h","B. Syarat Pembentukan Paragraf yang Baik"],["ul",["Kesatuan (Kohesi Gagasan / Unity): Seluruh kalimat penjelas dalam satu paragraf harus berfokus pada satu gagasan utama yang sama. Jika terdapat kalimat yang menyimpang dari topik utama, kalimat tersebut disebut kalimat sumbang dan merusak kesatuan paragraf.","Kepaduan (Koherensi): Hubungan antarkalimat dalam paragraf terjalin secara harmonis, logis, dan mengalir lancar. Kepaduan dibangun melalui dua perangkat: (a) kohesi leksikal (pengulangan kata kunci, sinonim, hiponim) dan (b) kohesi gramatikal (kata ganti/pronomina seperti ia, mereka, ini, tersebut, serta konjungsi antarkalimat seperti oleh karena itu, namun, selain itu, dengan demikian).","Kelengkapan (Ketuntasan): Paragraf memuat kalimat penjelas yang memadai sehingga gagasan utama terjelaskan secara tuntas dan tidak menggantung."]],["h","C. Jenis Paragraf Berdasarkan Letak Kalimat Utama"],["tb",["Jenis Paragraf","Letak Kalimat Utama","Ciri Khas & Pola Alur"],[["Paragraf Deduktif","Di awal paragraf","Alur berpikir dari pernyataan umum menuju rincian khusus (Umum -> Khusus). Kalimat kedua dst. biasanya memuat kata rujukan (ini, itu, tersebut) atau pengulangan kata kunci."],["Paragraf Induktif","Di akhir paragraf","Alur berpikir dari fakta, data, atau contoh khusus menuju simpulan umum (Khusus -> Umum). Kalimat terakhir sering ditandai konjungsi penyimpul: jadi, oleh karena itu, dengan demikian, akibatnya."],["Paragraf Campuran (Deduktif-Induktif)","Di awal dan ditegaskan kembali di akhir paragraf","Kalimat utama dibuka di awal paragraf, dijelaskan di tengah, lalu ditegaskan ulang dengan variasi redaksi di kalimat penutup (Umum -> Khusus -> Umum)."],["Paragraf Ineratif","Di tengah paragraf","Kalimat pengantar di awal, inti gagasan utama di tengah paragraf, diikuti penjelasan tambahan di bagian akhir."],["Paragraf Deskriptif / Naratif","Tersebar di seluruh kalimat (tanpa kalimat utama tunggal)","Umumnya terdapat pada karangan narasi (cerita) dan deskripsi (pelukisan objek), di mana semua kalimat memiliki bobot informasi yang setara."]]],["h","D. Jenis Paragraf Berdasarkan Tujuan / Bentuk Wacana"],["ul",["Narasi: Menceritakan rangkaian peristiwa atau kejadian berdasarkan urutan waktu (kronologis), melibatkan tokoh, latar, dan konflik. Terbagi atas narasi ekspositoris (biografi, kisah nyata) dan narasi sugestif (cerpen, novel).","Deskripsi: Melukiskan atau menggambarkan suatu objek, tempat, atau suasana secara terperinci dengan melibatkan pancaindra sehingga pembaca seolah-olah melihat, mendengar, atau merasakan langsung objek tersebut.","Eksposisi: Memaparkan, menjelaskan, atau menginformasikan suatu konsep, proses, atau pengetahuan secara objektif dan faktual tanpa bermaksud memengaruhi sikap pembaca.","Argumentasi: Membuktikan kebenaran suatu pendapat atau pendirian dengan menyajikan alasan logis, fakta, data statistik, dan bukti empiris untuk meyakinkan pembaca.","Persuasi: Bertujuan membujuk, mengajak, atau memengaruhi pembaca agar melakukan tindakan tertentu sesuai keinginan penulis, sering ditandai kata ajakan seperti mari, ayo, hendaknya, sebaiknya."]],["h","E. Pola Pengembangan Paragraf Eksposisi dan Argumentasi"],["p","Dalam penulisan ilmiah dan soal ujian pemahaman bacaan, paragraf dikembangkan melalui beberapa pola logis: (1) Pola Klasifikasi/Divisi (pengelompokan berdasarkan kriteria tertentu); (2) Pola Definisi Luas (pengertian disertai ciri dan ruang lingkup); (3) Pola Ilustrasi/Contoh; (4) Pola Perbandingan dan Pertentangan (analogi dan kontras); (5) Pola Sebab-Akibat dan Akibat-Sebab; serta (6) Pola Proses (urutan tahapan kerja)."]]},{"id":"c6","label":"Bab VI","judul":"Kemahiran Bahasa (1): Membaca Pemahaman, Ide Pokok, Simpulan, & Fakta-Opini","b":[["p","Kemahiran membaca pemahaman menguji kemampuan peserta didik dalam menangkap informasi tersurat, menyimpulkan informasi tersirat, menilai keakuratan argumen, serta membedakan pernyataan faktual dan subjektif dalam berbagai jenis teks (artikel ilmiah populer, tajuk rencana/editorial, biografi, hingga infografik)."],["h","A. Teknik Menemukan Ide Pokok dan Kalimat Utama"],["p","Ide pokok merupakan inti sari paragraf. Langkah sistematis untuk menemukannya secara cepat dan tepat adalah sebagai berikut:"],["ul",["Langkah 1 - Baca Kalimat Pertama dan Kalimat Terakhir: Lebih dari 85% soal teks ujian nasional dan ujian sekolah menggunakan pola deduktif atau induktif. Perhatikan apakah kalimat terakhir mengandung konjungsi simpulan (jadi, dengan demikian, oleh sebab itu, maka).","Langkah 2 - Identifikasi Kata Kunci dan Rujukan: Jika kalimat kedua memuat kata ganti penunjuk (hal ini, fenomena tersebut, kondisi itu) yang merujuk pada pernyataan kalimat pertama, maka kalimat pertama adalah kalimat utama.","Langkah 3 - Ringkas Kalimat Utama Menjadi Frasa Inti: Ide pokok tidak harus ditulis persis sama dengan kalimat utama; dalam pilihan ganda, ide pokok sering kali disajikan dalam bentuk frasa nominal yang merangkum inti kalimat utama."]],["h","B. Menentukan Simpulan, Pernyataan Tersirat, dan Tujuan Penulis"],["ul",["Simpulan Bacaan: Simpulan adalah ikhtisar akhir yang mencakup keseluruhan isi paragraf atau wacana berdasarkan fakta-fakta yang disajikan. Simpulan yang tepat harus: (1) melingkupi seluruh gagasan utama dalam teks, (2) tidak bertentangan dengan data teks, dan (3) tidak melampaui batas informasi yang dibahas teks (tidak over-generalization).","Informasi Tersirat (Inferensi): Makna yang tidak tertulis secara harfiah, tetapi dapat ditarik secara logis dari hubungan sebab-akibat atau perbandingan antarpernyataan di dalam teks.","Tujuan Penulis: Dapat dikenali dari jenis teks dan kata kerja operasional pada opsi jawaban: teks eksposisi bertujuan menginformasikan/menjelaskan; teks argumentasi bertujuan meyakinkan/membuktikan; teks persuasi bertujuan mengajak/mengimbau; sedangkan tajuk rencana bertujuan menyikapi suatu isu aktual."]],["h","C. Membedakan Kalimat Fakta dan Kalimat Opini"],["tb",["Aspek Pembeda","Kalimat Fakta","Kalimat Opini"],[["Sifat Kebenaran","Objektif; kebenarannya dapat dibuktikan dan diuji secara empiris oleh siapa pun.","Subjektif; berupa pendapat, penilaian, prediksi, harapan, atau tafsiran pribadi/kelompok."],["Data Pendukung","Memuat data pasti: tanggal, tempat, jumlah, persentase, peristiwa yang sudah terjadi.","Tidak memiliki bukti pasti; sering mengacu pada masa depan (akan, diprediksi) atau penilaian relatif."],["Penanda Kebahasaan","Kata kerja faktual (terjadi, mencatat, meresmikan, berjumlah, terletak).","Kata sifat relatif & modalitas (sangat, paling, indah, buruk, sebaiknya, seharusnya, mungkin, diduga, menurut saya)."],["Contoh Kalimat","Kementerian Pendidikan merilis Kurikulum Merdeka pada tahun 2022 yang diterapkan di lebih dari 140.000 satuan pendidikan.","Penerapan kurikulum baru tersebut diharapkan mampu meningkatkan kualitas literasi siswa secara signifikan di masa depan."]]],["h","D. Memahami Tajuk Rencana (Editorial) dan Biografi"],["ul",["Tajuk Rencana (Editorial): Artikel pokok dalam surat kabar yang merupakan pandangan redaksi terhadap peristiwa yang sedang menjadi sorotan masyarakat. Unsur penting yang sering ditanyakan dalam soal tajuk rencana meliputi: (1) isu atau masalah aktual yang disoroti, (2) opini atau sikap redaksi (mendukung, mengkritik, menyarankan), dan (3) pihak yang dituju oleh redaksi (pemerintah, masyarakat, penegak hukum).","Teks Biografi: Riwayat hidup tokoh yang ditulis oleh orang lain (jika ditulis sendiri disebut autobiografi). Soal biografi umumnya menanyakan: (1) keteladanan tokoh (sifat positif yang patut ditiru), (2) keistimewaan tokoh (prestasi atau kemampuan luar biasa yang membedakannya dari orang lain), dan (3) permasalahan serta cara tokoh mengatasinya."]]]},{"id":"c7","label":"Bab VII","judul":"Kemahiran Bahasa (2): Menulis Karya Ilmiah, Surat Resmi, Rangkuman, & Penyuntingan","b":[["p","Kemahiran menulis dalam ujian Bahasa Indonesia diujikan dalam bentuk menulis terbatas, yaitu kemampuan melengkapi bagian teks yang rumpang, menyusun kerangka karya ilmiah, menulis daftar pustaka, menyusun surat resmi/lamaran pekerjaan, serta menyunting kesalahan ejaan dan struktur kalimat."],["h","A. Sistematika Karya Tulis Ilmiah (KTI)"],["p","Karya tulis ilmiah disusun secara sistematis dan logis dengan struktur baku berikut:"],["ul",["1. Bagian Pembuka: Halaman judul, lembar pengesahan, kata pengantar, daftar isi, daftar tabel/gambar, dan abstrak.","2. Bab I Pendahuluan: Memuat (a) Latar Belakang Masalah (kesenjangan antara harapan/das sollen dan kenyataan/das sein), (b) Rumusan Masalah (berupa kalimat tanya yang fokus), (c) Tujuan Penelitian (sejalan dengan rumusan masalah), dan (d) Manfaat Penelitian (manfaat teoretis dan praktis).","3. Bab II Kajian Pustaka / Landasan Teori: Berisi tinjauan teori para ahli, penelitian terdahulu yang relevan, dan kerangka berpikir.","4. Bab III Metode Penelitian: Menjelaskan jenis penelitian, waktu dan tempat, populasi dan sampel, teknik pengumpulan data, serta teknik analisis data.","5. Bab IV Hasil Penelitian dan Pembahasan: Penyajian data temuan dan interpretasi analisis berdasarkan teori.","6. Bab V Penutup: Terdiri atas Simpulan (jawaban langsung atas rumusan masalah) dan Saran (rekomendasi konkret bagi pihak terkait).","7. Bagian Penunjang: Daftar Pustaka dan Lampiran."]],["h","B. Kaidah Penulisan Daftar Pustaka (Gaya Umum Indonesia / APA)"],["p","Penulisan daftar pustaka dari sumber buku mengikuti urutan: Nama Penulis (dibalik jika lebih dari satu kata, tanpa gelar akademis). Tahun Terbit. Judul Buku (dicetak miring). Kota Terbit: Nama Penerbit."],["h3","Contoh Penulisan Daftar Pustaka yang Benar"],["ul",["Satu Penulis: Keraf, Gorys. 2010. Diksi dan Gaya Bahasa. Jakarta: Gramedia Pustaka Utama.","Dua Penulis: Alwi, Hasan dan Dendy Sugono. 2011. Telaah Bahasa dan Sastra. Jakarta: Yayasan Obor Indonesia.","Tiga Penulis atau Lebih: Chaer, Abdul, dkk. 2014. Linguistik Umum. Jakarta: Rineka Cipta.","Jurnal Ilmiah: Maulana, Dhama. 2026. \"Analisis Fonologis Pemulihan Bahasa Pascastroke.\" Jurnal Bahasa dan Sastra, Vol. 14, No. 2, hlm. 45-60.","Catatan Penting: Daftar pustaka disusun secara alfabetis berdasarkan nama belakang penulis pertama, tidak diberi nomor urut, dan baris kedua serta seterusnya menjorok ke dalam (hanging indent 1,25 cm)."]],["h","C. Surat Dinas dan Surat Lamaran Pekerjaan"],["p","Surat resmi harus menggunakan bahasa baku, lugas, santun, dan efektif. Bagian penting dalam surat dinas dan surat lamaran pekerjaan yang sering menjadi objek soal:"],["ul",["Penulisan Tanggal Surat: Tidak perlu didahului nama kota jika nama kota sudah tercantum pada kop surat dinas. Pada surat lamaran pekerjaan (tanpa kop), nama kota ditulis sebelum tanggal: Jakarta, 19 November 2026 (tanpa tanda titik di akhir).","Penulisan Alamat Tujuan: Tidak menggunakan kata 'Kepada' bersamaan dengan 'Yth.' (cukup: Yth. Manajer Personalia PT Nusantara Jaya). Kata 'Jalan' tidak disingkat menjadi 'Jln.' atau 'Jl.', dan tidak diakhiri tanda titik.","Salam Pembuka dan Penutup: Menggunakan huruf kapital hanya pada kata pertama dan diakhiri tanda koma: Dengan hormat, ... Hormat saya,","Kalimat Pembuka Surat Lamaran: Harus mencantumkan sumber informasi lowongan kerja secara jelas. Contoh: 'Berdasarkan informasi lowongan pekerjaan yang dimuat pada harian Kompas, 15 November 2026, saya mengajukan lamaran pekerjaan untuk mengisi posisi Staf Editor.'","Penulisan Pemerincian Identitas Pelamar: Jika didahului kalimat pengantar yang belum selesai (berakhir dengan koma atau titik dua yang menyambung kalimat), maka rincian nama, tempat/tanggal lahir, pendidikan, dan alamat diawali huruf kecil. Contoh: 'Adapun identitas diri saya adalah sebagai berikut: nama : ...; tempat, tanggal lahir : ...; pendidikan terakhir : ...; alamat : ...'"]],["h","D. Teknik Penyuntingan Teks"],["p","Penyuntingan (editing) dilakukan pada empat tataran: (1) ejaan dan tanda baca, (2) diksi/pilihan kata (ketepatan makna dan kebakuan), (3) keefektifan kalimat (kelengkapan S-P, kehematan, kesejajaran), dan (4) kepaduan paragraf (ketepatan konjungsi antarkalimat)."]]},{"id":"c8","label":"Bab VIII","judul":"Majas dan Peribahasa: Klasifikasi Gaya Bahasa & Ungkapan Tradisional","b":[["p","Majas (gaya bahasa) adalah pemanfaatan kekayaan bahasa, pemakaian ragam tertentu untuk memperoleh efek-efek tertentu yang membuat sebuah karya sastra maupun tuturan semakin hidup dan estetis. Sementara itu, peribahasa adalah kelompok kata atau kalimat yang tetap susunannya dan biasanya mengiaskan maksud tertentu."],["h","A. Klasifikasi Majas dalam Bahasa Indonesia"],["p","Secara garis besar, majas dikelompokkan menjadi empat kategori utama: Majas Perbandingan, Majas Pertentangan, Majas Sindiran, dan Majas Penegasan."],["tb",["Kelompok & Nama Majas","Pengertian","Contoh Kalimat"],[["1. Perbandingan: Personifikasi","Menginsankan benda mati atau makhluk selain manusia sehingga seolah bertindak dan berperasaan seperti manusia.","Angin malam berbisik lirih membelai dedaunan cemara."],["2. Perbandingan: Metafora","Pembandingan langsung secara implisit tanpa menggunakan kata pembanding (seperti, bagai, laksana).","Perpustakaan adalah gudang ilmu; ia adalah bintang kelas kami."],["3. Perbandingan: Simile (Asosiasi)","Perbandingan eksplisit dua hal berbeda dengan menggunakan kata penghubung: seperti, bagai, bak, laksana, ibarat.","Wajahnya pucat pasi bagaikan bulan kesiangan."],["4. Perbandingan: Hiperbola","Pernyataan yang melebih-lebihkan kenyataan untuk memperoleh efek dramatis atau intensitas tinggi.","Suaranya menggelegar membelah angkasa; air matanya mengalir menganak sungai."],["5. Perbandingan: Litotes","Ungkapan merendahkan diri secara halus dengan menyatakan kebalikan dari keadaan sebenarnya yang lebih tinggi.","Singgahlah ke gubuk reyot kami (padahal rumahnya megah)."],["6. Perbandingan: Metonimia","Menggunakan nama merek, ciri, atau atribut tertentu untuk menggantikan benda atau objek keseluruhannya.","Ayah pergi ke Surabaya naik Garuda (pesawat Garuda Indonesia)."],["7. Perbandingan: Sinekdoke","Terdiri atas Pars pro toto (sebagian untuk keseluruhan) dan Totem pro parte (keseluruhan untuk sebagian).","Pars pro toto: Setiap kepala dikenai biaya masuk.\nTotem pro parte: Indonesia menjuarai Piala Thomas."],["8. Perbandingan: Eufemisme","Mengganti ungkapan yang dianggap kasar atau tabu dengan ungkapan yang lebih halus dan sopan.","Para tunakarya (pengangguran) mendapatkan pelatihan kerja."],["9. Pertentangan: Paradoks","Mengandung pertentangan nyata antara dua hal dalam satu kalimat, namun mengandung kebenaran jika direnungkan.","Ia merasa kesepian di tengah keramaian kota metropolitan."],["10. Pertentangan: Antitesis","Memadukan pasangan kata yang berlawanan arti secara sejajar dalam satu kalimat.","Tua muda, besar kecil, kaya miskin turut merayakan hari kemerdekaan."],["11. Sindiran: Ironi","Sindiran halus dengan menyatakan hal yang bertentangan dengan fakta sebenarnya.","Rapi sekali kamarmu, sampai-sampai tidak ada tempat untuk melangkah."],["12. Sindiran: Sinisme","Sindiran yang lebih kasar daripada ironi, disampaikan secara langsung dengan nada mencemooh.","Untuk apa kau belajar tinggi-tinggi jika perilakumu masih seperti anak kecil?"],["13. Sindiran: Sarkasme","Sindiran paling kasar dan tajam yang menyakiti hati secara langsung, sering memakai kata-kata tidak sopan.","Otakmu memang udang, soal semudah ini saja tidak bisa kaukerjakan!"],["14. Penegasan: Pleonasme","Menambahkan keterangan yang sebenarnya sudah jelas tercakup dalam kata sebelumnya untuk menegaskan.","Mereka turun ke bawah menyelamatkan diri; ia melihat dengan mata kepala sendiri."],["15. Penegasan: Repetisi","Pengulangan kata, frasa, atau klausa yang sama dalam beberapa kalimat berturut-turut untuk penekanan.","Selamat datang pahlawanku, selamat datang kusuma bangsaku, selamat datang harapanku."],["16. Penegasan: Klimaks & Antiklimaks","Klimaks: urutan gagasan dari tingkat rendah ke tinggi. Antiklimaks: dari tinggi ke rendah.","Klimaks: Dari anak-anak, remaja, hingga orang tua hadir.\nAntiklimaks: Kepala dinas, camat, lurah, hingga ketua RT berkumpul."]]],["h","B. Peribahasa, Ungkapan (Idiom), dan Pepatah"],["p","Peribahasa mencakup pepatah, perumpamaan, dan pemeo. Berikut adalah kumpulan peribahasa populer yang sering muncul dalam soal pemahaman konteks:"],["ul",["Air beriak tanda tak dalam: Orang yang banyak bicara biasanya kurang berilmu.","Bagai air di daun talas: Orang yang tidak tetap pendiriannya, selalu berubah-ubah.","Berat sama dipikul, ringan sama dijinjing: Suka dan duka ditanggung bersama-sama secara gotong royong.","Besar pasak daripada tiang: Pengeluaran lebih besar daripada pendapatan.","Bagaikan pungguk merindukan bulan: Mengharapkan sesuatu yang mustahil atau sangat sulit dicapai.","Nasi sudah menjadi bubur: Perbuatan yang sudah terlanjur terjadi dan tidak dapat diperbaiki lagi.","Tong kosong nyaring bunyinya: Orang yang tidak berilmu biasanya banyak membual.","Sambil menyelam minum air: Menyelesaikan dua atau tiga pekerjaan sekaligus dalam satu waktu.","Ada udang di balik batu: Memiliki maksud atau tujuan tersembunyi di balik suatu perbuatan baik.","Tak ada gading yang tak retak: Tidak ada sesuatu pun di dunia ini yang sempurna tanpa cacat."]]]},{"id":"c9","label":"Bab IX","judul":"Kesusastraan: Prosa Fiksi, Puisi, Drama, Unsur Intrinsik-Ekstrinsik, & Sejarah Sastra","b":[["p","Kesusastraan adalah karya seni yang menggunakan bahasa sebagai medium utamanya untuk mengekspresikan pengalaman batin, gagasan, dan nilai-nilai kemanusiaan secara imajinatif dan estetis. Secara garis besar, genre sastra terbagi atas prosa fiksi, puisi, dan drama."],["h","A. Unsur Intrinsik dan Ekstrinsik Karya Sastra (Prosa & Drama)"],["p","Unsur intrinsik adalah unsur yang membangun karya sastra dari dalam karya itu sendiri, meliputi:"],["ul",["1. Tema: Gagasan pokok atau ide dasar yang menjiwai keseluruhan cerita (misalnya: perjuangan keadilan, konflik tradisi dan modernitas, keteguhan moral).","2. Tokoh dan Penokohan (Perwatakan): Tokoh adalah pelaku cerita (protagonis, antagonis, tritagonis, figuran). Penokohan adalah cara pengarang menggambarkan watak tokoh melalui dua teknik: (a) teknik analitik (pengarang menyebutkan watak tokoh secara langsung) dan (b) teknik dramatik (watak disimpulkan pembaca melalui dialog, tindakan tokoh, pikiran tokoh, lingkungan tempat tinggal, atau tanggapan tokoh lain).","3. Alur (Plot): Rangkaian peristiwa yang dijalin berdasarkan hubungan sebab-akibat. Tahapan alur terdiri atas: pengenalan (eksposisi), pemunculan konflik, peningkatan konflik (komplikasi), puncak konflik (klimaks), peleraian (antiklimaks), dan penyelesaian (resolusi). Jenis alur: alur maju (progresif), alur mundur (regresif/sorot balik), dan alur campuran.","4. Latar (Setting): Meliputi latar tempat (lokasi kejadian), latar waktu (kapan terjadi), dan latar sosial-budaya (tata cara hidup, adat istiadat, status sosial masyarakat dalam cerita).","5. Sudut Pandang (Point of View): Posisi pengarang dalam membawakan cerita: (a) Sudut pandang orang pertama pelaku utama ('aku' sebagai tokoh sentral); (b) Sudut pandang orang pertama pelaku sampingan ('aku' menceritakan tokoh lain); (c) Sudut pandang orang ketiga serbatahu ('dia/ia/nama tokoh', pengarang mengetahui isi hati semua tokoh); dan (d) Sudut pandang orang ketiga pengamat (hanya menceritakan apa yang tampak dari luar).","6. Gaya Bahasa dan Amanat: Gaya bahasa adalah cara khas pengarang memilih diksi dan majas. Amanat adalah pesan moral yang ingin disampaikan pengarang kepada pembaca (dapat tersurat maupun tersirat)."]],["p","Unsur ekstrinsik adalah unsur di luar teks sastra yang memengaruhi penciptaan karya, yaitu: (1) latar belakang kehidupan pengarang, (2) kondisi sosial, politik, budaya, dan ekonomi masyarakat saat karya diciptakan, serta (3) nilai-nilai yang terkandung dalam karya (nilai moral, nilai sosial, nilai budaya, nilai religius, dan nilai estetis)."],["h","B. Struktur Fisik dan Struktur Batin Puisi"],["tb",["Dimensi Struktur","Komponen Utama","Penjelasan & Fungsi"],[["Struktur Fisik (Kebahasaan)","Diksi (Pilihan Kata)","Pemilihan kata yang padat makna, mempertimbangkan bunyi, urutan, dan daya sugesti."],["Struktur Fisik (Kebahasaan)","Imaji / Pengimajian (Citraan)","Susunan kata yang membangkitkan pengalaman indrawi: citraan penglihatan (visual), pendengaran (auditif), perabaan (taktil), penciuman, pengecapan, dan gerak (kinestetik)."],["Struktur Fisik (Kebahasaan)","Kata Konkret & Majas","Kata yang melukiskan sesuatu secara nyata untuk memperjelas imaji serta bahasa figuratif (metafora, personifikasi, simbol)."],["Struktur Fisik (Kebahasaan)","Rima dan Ritme","Persamaan bunyi pada awal, tengah, atau akhir larik (rima) serta alunan naik-turunnya tekanan suara (ritme)."],["Struktur Fisik (Kebahasaan)","Tipografi (Perwajahan)","Bentuk tata letak baris, bait, huruf kapital, dan tanda baca yang memberi efek visual dan makna tambahan."],["Struktur Batin (Semantik)","Tema (Sense)","Pokok persoalan yang diungkapkan penyair dalam puisinya."],["Struktur Batin (Semantik)","Perasaan (Feeling)","Sikap emosional penyair terhadap pokok persoalan (sedih, kagum, gelisah, rindu, protes)."],["Struktur Batin (Semantik)","Nada dan Suasana (Tone)","Nada adalah sikap penyair terhadap pembaca (menggurui, menyindir, merayu, lugas); suasana adalah keadaan jiwa pembaca setelah membaca puisi."],["Struktur Batin (Semantik)","Amanat (Intention)","Pesan atau tujuan yang hendak disampaikan penyair melalui puisinya."]]],["h","C. Drama dan Unsur Pementasannya"],["p","Drama adalah karya sastra yang menggambarkan kehidupan dan watak manusia melalui tingkah laku (akting) dan dialog yang dipentaskan. Unsur khas naskah drama meliputi: (1) Babak dan Adegan (pembagian lakon berdasarkan perubahan latar/waktu), (2) Dialog (percakapan antartokoh, monolog, prolog sebagai pembuka, dan epilog sebagai penutup), serta (3) Kramagung atau Petunjuk Lakuan (petunjuk teknis tindakan, ekspresi, dan tata panggung yang biasanya ditulis dalam tanda kurung dan dicetak miring)."],["h","D. Ringkasan Periodisasi Sejarah Sastra Indonesia"],["tb",["Angkatan / Periode","Karakteristik Karya & Tema Utama","Tokoh & Karya Penting"],[["Sastra Melayu Klasik","Istana sentris, anonim, terikat aturan baku (pantun, syair, gurindam, hikayat), mengandung kemustahilan dan nasihat moral.","Hikayat Hang Tuah, Gurindam Dua Belas (Raja Ali Haji), Syair Abdul Muluk."],["Angkatan Balai Pustaka (1920-an)","Tema kawin paksa, pertentangan adat lama vs kaum muda, berlatar kedaerahan (Minangkabau), bahasa Melayu tinggi.","Marah Rusli (Sitti Nurbaya), Abdul Muis (Salah Asuhan), Merari Siregar (Azab dan Sengsara)."],["Angkatan Pujangga Baru (1930-an)","Semangat kebangsaan, romantisme, emansipasi, bahasa Indonesia yang lebih dinamis, pengaruh sastra Eropa (Soneta).","Sutan Takdir Alisjahbana (Layar Terkembang), Amir Hamzah (Nyanyi Sunyi), Armijn Pane (Belenggu)."],["Angkatan '45","Realisme, ekspresionisme, revolusi kemerdekaan, kemanusiaan universal, pembebasan bentuk puisi dari ikatan lama.","Chairil Anwar (Kerikil Tajam, Deru Campur Debu), Idrus (Dari Ave Maria ke Jalan Lain ke Roma), Asrul Sani."],["Angkatan '66 & Kontemporer","Kritik sosial-politik, perlawanan terhadap tirani, eksperimentasi bentuk (puisi mantra/mbeling), warna lokal dan postmodern.","Taufiq Ismail (Tirani dan Benteng), W.S. Rendra, Sutardji Calzoum Bachri, Ahmad Tohari, Pramoedya Ananta Toer."]]]]},{"id":"c10","label":"Bagian 10","judul":"Latihan (1): Kaidah Ejaan, Tata Kalimat, Tata Makna, dan Paragraf","b":[["p","Petunjuk: Pilihlah satu jawaban yang paling tepat untuk setiap soal di bawah ini. Kunci jawaban dan pembahasan ringkas tersedia di bagian akhir paket latihan ini."],["q","1",[["t","Penulisan huruf kapital yang tepat terdapat pada kalimat ..."]],["Setiap hari Sen
